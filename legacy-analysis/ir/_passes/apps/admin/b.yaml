  - record_key: order-approval-0002
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL allow administrators to change the status of PENDING
      orders to either APPROVED or DENIED through a rich client interface.
      Status changes SHALL be collected and committed together through an
      asynchronous message-based workflow that updates the order processing
      system.
    confidence: high
    confidence_basis: >
      OrdersApprovePanel provides UI with Approve, Deny, and Commit buttons.
      Multiple orders can be selected and status changed before committing.
      Commit action calls tableModel.commit() which sends accumulated changes.
      ApplRequestProcessor.updateOrders() receives XML of changed orders,
      builds OrderApproval XML document, and sends to AsyncSender EJB for
      asynchronous processing. Workflow is clear and deterministic.
    risk_class: operational
    basis: >
      OrdersApprovePanel.createButtonPanel() creates Approve button that sets
      selected rows to APPROVED status, Deny button sets to DENIED status.
      Commit button calls tableModel.commit() which sends changed orders via
      AdminRequestBD.updateOrders(OrderApproval). ApplRequestProcessor.
      updateOrders() parses XML request, extracts OrderId and OrderStatus for
      each changed order, creates OrderApproval document with list of changed
      orders. AsyncSender receives XML and sends to order processing queue
      for transition.
    traces:
