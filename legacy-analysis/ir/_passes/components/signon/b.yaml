records:
  - record_key: customer-management-auth-0001
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL authenticate a user by verifying that the provided userName
      and password match a registered user's credentials.
    confidence: high
    confidence_basis: >
      Both passes should find this requirement consistently. It is the primary business
      function implemented in SignOnEJB.authenticate() method with direct enforcement
      in the code, and the ejb-jar.xml declares this method as a core service. The
      FilterChain calls this method for every protected resource access.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate() method receives userName and password, looks up the
      user by primary key, and returns the result of matchPassword(). UserEJB
      implements matchPassword() as a direct string comparison with the stored password.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }
    stack_metadata:
      ejb.bean: SignOnEJB
      ejb.transaction: Required

