records:
  - record_key: CUSTOMER-ENTITY-0001
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL maintain a Customer entity with a unique userId as the primary key.
      Each Customer SHALL have exactly one Account and one Profile associated with it.
    confidence: high
    confidence_basis: >
      The Customer EJB is declared as a CMP 2.x entity bean with userId explicitly set as
      the primary key in the ejb-jar.xml. The ejbPostCreate method in CustomerEJB
      programmatically creates and associates exactly one Account and one Profile.
      The ejb-jar.xml declares these as one-to-one CMR relationships with cascade-delete,
      providing both declarative and programmatic enforcement.
    risk_class: operational
    basis: >
      Customer EJB is a Container-Managed Persistence (CMP 2.x) entity bean.
      The userId field is declared as the CMP field and primkey-field.
      In ejbPostCreate, after initial Account creation with "active" status and Profile
      creation with default preferences, setAccount() and setProfile() establish the
      CMR relationships. The ejb-jar.xml defines one-to-one relationships between
      Customer-Account and Customer-Profile, both with cascade-delete semantics.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 46
        line_end: 88
        excerpt: |
          <entity>
            <display-name>CustomerEB</display-name>
            <ejb-name>CustomerEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.customer.ejb.CustomerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.customer.ejb.CustomerLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.customer.ejb.CustomerEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-version>2.x</cmp-version>
            <cmp-field>
              <field-name>userId</field-name>
            </cmp-field>
            <primkey-field>userId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 69
        line_end: 72
        excerpt: |
          public String ejbCreate(String userId) throws CreateException {
              setUserId(userId);
              return null;
          }
    stack_metadata:
      ejb.bean: CustomerEJB
      db.object: Customer
      ejb.transaction: Required

  - record_key: CUSTOMER-ENTITY-0002
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL automatically create an Account with status "active" and a Profile
      with default preferences (preferredLanguage="en_US", favoriteCategory=null,
      myListPreference=true, bannerPreference=true) when a new Customer is created.
    confidence: high
    confidence_basis: >
      The CustomerEJB.ejbPostCreate method contains explicit logic to create an Account
      and Profile with the stated defaults using the AccountLocalHome and ProfileLocalHome
      factories. The constants defining the default values are publicly defined in
      AccountLocalHome and ProfileLocalHome interface classes. This two-phase creation
      (ejbCreate then ejbPostCreate) is a J2EE entity bean pattern that guarantees
      execution in sequence.
    risk_class: operational
    basis: >
      In CustomerEJB.ejbPostCreate (lines 74-89), immediately after setUserId() completes,
      an InitialContext lookup retrieves AccountLocalHome and ProfileLocalHome beans.
      AccountLocalHome.create(AccountLocalHome.Active) creates an Account with status "active".
      ProfileLocalHome.create() is called with the constants:
      ProfileLocalHome.DefaultPreferredLanguage ("en_US"),
      ProfileLocalHome.DefaultFavoriteCategory (null),
      ProfileLocalHome.DefaultMyListPreference (true),
      ProfileLocalHome.DefaultBannerPreference (true).
      These constants are defined in ProfileLocalHome.java lines 44-47.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              try {
                  InitialContext ic = new InitialContext();
                  AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
                  AccountLocal account = alh.create(AccountLocalHome.Active);
                  setAccount(account);
                  ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
                  ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
                    ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
                    ProfileLocalHome.DefaultBannerPreference);
                  setProfile(profile);
              } catch (NamingException ne) {
                  throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/profile/ejb/ProfileLocalHome.java
        line_start: 44
        line_end: 47
        excerpt: |
          public static final String DefaultPreferredLanguage = "en_US";
          public static final String DefaultFavoriteCategory = null;
          public static final boolean DefaultMyListPreference = true;
          public static final boolean DefaultBannerPreference = true;
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 49
        excerpt: |
          public static final String Active = "active";
    stack_metadata:
      ejb.bean: CustomerEJB
      ejb.transaction: Required

  - record_key: CUSTOMER-ENTITY-0003
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL maintain an Account entity for each Customer with a status field.
      Each Account SHALL have exactly one ContactInfo entity and exactly one CreditCard entity.
    confidence: high
    confidence_basis: >
      AccountEJB is declared as a CMP 2.x entity with a status CMP field. The ejb-jar.xml
      declares two one-to-one CMR relationships (Account-ContactInfo and Account-CreditCard)
      with cascade-delete. AccountEJB.ejbPostCreate programmatically creates default
      ContactInfo and CreditCard instances when an Account is created with just the
      status parameter (lines 80-93). This provides both declarative and programmatic
      enforcement of the relationships.
    risk_class: operational
    basis: >
      Account EJB is a CMP 2.x entity bean with a status CMP field (line 57).
      The ejb-jar.xml defines CMR fields for creditCard and contactInfo (lines 244-257).
      When AccountEJB.ejbPostCreate is called with just the status parameter, it looks up
      ContactInfoLocalHome and CreditCardLocalHome, creates default instances with no
      parameters, and establishes the relationships via setContactInfo and setCreditCard.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 229
        line_end: 262
        excerpt: |
          <entity>
            <display-name>AccountEB</display-name>
            <ejb-name>AccountEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.customer.account.ejb.AccountLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.customer.account.ejb.AccountLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.customer.account.ejb.AccountEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.Object</prim-key-class>
            <cmp-field>
              <field-name>status</field-name>
            </cmp-field>
            <ejb-local-ref>
              <ejb-ref-name>ejb/CreditCard</ejb-ref-name>
              <ejb-link>CreditCardEJB</ejb-link>
            </ejb-local-ref>
            <ejb-local-ref>
              <ejb-ref-name>ejb/ContactInfo</ejb-ref-name>
              <ejb-link>ContactInfoEJB</ejb-link>
            </ejb-local-ref>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 75
        line_end: 93
        excerpt: |
          public Object ejbCreate(String status) throws CreateException {
              setStatus(status);
              return null;
          }
          public void ejbPostCreate(String status) throws CreateException {
              setStatus(status);
              try {
                  InitialContext ic = new InitialContext();
                  ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
                  ContactInfoLocal contactInfo = cih.create();
                  setContactInfo(contactInfo);
                  CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
                  CreditCardLocal creditCard = cch.create();
                  setCreditCard(creditCard);
              } catch (javax.naming.NamingException ne) {
                  throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
              }
          }
    stack_metadata:
      ejb.bean: AccountEJB
      db.object: Account
      ejb.transaction: Required

  - record_key: CUSTOMER-ENTITY-0004
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL maintain an Account status field that SHALL be set to either
      "active" or "disabled". Each Account SHALL provide getStatus() and setStatus()
      operations to retrieve and modify this field.
    confidence: high
    confidence_basis: >
      The status field is declared as a CMP field in AccountEJB and ejb-jar.xml.
      AccountLocalHome defines two public constants: Active = "active" and Disabled = "disabled".
      The AccountLocal interface declares getStatus() and setStatus(String status) methods.
      The AccountEJB defines abstract getter and setter for status. Transaction attribute
      Required is applied to both methods in ejb-jar.xml.
    risk_class: operational
    basis: >
      AccountEJB declares abstract methods getStatus() and setStatus(String status)
      (lines 57-58). The ejb-jar.xml declares status as a CMP field (line 242).
      Container transactions with Required attribute are configured for getStatus (lines 1410-1415)
      and setStatus (lines 1480-1490). AccountLocalHome defines the two valid status values
      as public static final String constants (lines 48-49).
    traces:
