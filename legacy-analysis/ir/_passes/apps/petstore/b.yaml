  - record_key: shopping-cart-req-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow users to update the quantity of items in a shopping cart.
    confidence: high
    confidence_basis: >
      Implemented in CartEJBAction.perform() with CartEvent.UPDATE_ITEMS case.
      cart.updateItemQuantity(itemId, quantity) called for each item in the
      update map. Both layers (web and EJB) enforce this rule.
    risk_class: operational
    basis: >
      CartEJBAction lines 78-87 iterate over a map of items and call
      updateItemQuantity for each. The quantity is an Integer extracted from
      the CartEvent items map.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 78
        line_end: 87
        excerpt: |
          case  CartEvent.UPDATE_ITEMS : {
              Map items = ce.getItems();
              Iterator it = null;
              if (items != null) it = items.keySet().iterator();
              while ((it != null) && it.hasNext()) {
                  String itemId = (String)it.next();
                  int quantity = ((Integer)items.get(itemId)).intValue();
                  cart.updateItemQuantity(itemId, quantity);
              }
          }

