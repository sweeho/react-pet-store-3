  - record_key: supplier-integration-invoice-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The system SHALL support processing invoice information from a supplier by updating
      LineItem quantityShipped fields. The system SHALL accept a map of itemId to
      shipped quantity and add the shipped quantity to each LineItem's quantityShipped.
    confidence: high
    confidence_basis: >
      PurchaseOrderHelper.processInvoice explicitly implements this logic with clear
      variable names (lineItemIds map, quantityShipped field updates). The method
      documents its purpose in the class javadoc.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.java lines 80-91 show the invoice processing logic that
      updates quantityShipped by adding shipped amounts from the lineItemIds map.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 91
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {
            //set the quantity of line items shipped in the PO
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
              }
            }//end while
    stack_metadata:
      ejb.bean: PurchaseOrderHelper
      service.tier: Business Logic Helper

  - record_key: supplier-integration-completion-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The system SHALL determine that a PurchaseOrder is completely fulfilled when
      all of its LineItems have been fully shipped (quantityShipped equals quantity
      for every line item).
    confidence: high
    confidence_basis: >
      PurchaseOrderHelper.processInvoice implements this logic explicitly: after
      updating shipments, it loops through all LineItems and returns true only when
      every item has quantity == quantityShipped. This is the only method that
      computes order fulfillment status.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.java lines 93-102 show the fulfillment check: the method
      returns false if any LineItem has unshipped quantity remaining, and true only
      when the loop completes without finding a discrepancy.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 93
        line_end: 102
        excerpt: |
          // now loop through all LIs and see if all are shipped completely
          liColl = po.getLineItems();
          liIt = liColl.iterator();
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(li.getQuantity() != li.getQuantityShipped()) {
              return false;
            }
          }//end while
          return true;
    stack_metadata:
      ejb.bean: PurchaseOrderHelper

