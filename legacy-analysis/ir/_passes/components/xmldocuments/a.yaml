      XML Document processing SHALL support both DTD and XSD validation modes.
      Parser configuration SHALL accept a validating flag and xsdSupport flag to
      control validation method. When XSD support is enabled, JAXP schema properties
      SHALL be set on the SAX parser.
    confidence: high
    confidence_basis: >
      Validation support is implemented in XMLDocumentUtils with explicit mode selection
      parameters on multiple methods (createParser, deserialize, transform, fromXML).
      Declarative in both SupplierOrder and Invoice editor classes.
    risk_class: operational
    basis: >
      XMLDocumentUtils.createParser() accepts (boolean validating, boolean xsdSupport)
      parameters and sets JAXP_SCHEMA_LANGUAGE and JAXP_SCHEMA_SOURCE properties when
      xsdSupport is true. TPASupplierOrderXDE and TPAInvoiceXDE both support both DTD
      and XSD validation modes.
