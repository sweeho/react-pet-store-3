  - record_key: customer-management-requirement-0004
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL provide a print(Exception e, String msg) method that outputs exception
      information and optional message text to System.out when the debuggingOn flag is enabled.
    confidence: high
    confidence_basis: >
      The method (lines 60-62) explicitly delegates to print(Throwable, String) with the
      exception cast as a Throwable. The implementation at lines 68-75 shows it prints to
      System.out and includes exception message and stack trace.
    risk_class: operational
    basis: >
      Debug.print(Exception e, String msg) at lines 60-62 delegates to print((Throwable)e, msg).
      The Throwable version (lines 68-75) prints the exception message to System.out and
      conditionally prints the provided message and exception stack trace.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/util/tracer/src/com/sun/j2ee/blueprints/util/tracer/Debug.java
        line_start: 60
        line_end: 75
        excerpt: |
          public static void print(Exception e, String msg) {
              print((Throwable)e, msg);
          }

          public static void print(Exception e) {
              print(e, null);
          }

          public static void print(Throwable t, String msg) {
              if (debuggingOn) {
                  System.out.println("Received throwable with Message: "+t.getMessage());
                  if (msg != null)
                      System.out.print(msg);
                  t.printStackTrace();
              }
          }
    stack_metadata:
      framework: debug-utility
      method_signature: "static void print(Exception, String)"
      output_stream: "System.out"

