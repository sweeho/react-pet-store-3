  - record_key: ADDR-REQ-0002
    kind: requirement
    capability_key: order-checkout
    requirement: >
      The system SHALL support an optional second street name (streetName2) in an
      Address entity. When present, it SHALL be included in the address serialization.
      When absent or empty, it SHALL be omitted.
    confidence: high
    confidence_basis: >
      The DTD schema explicitly marks the second StreetName as optional with a question
      mark modifier. The Address.java toDOM method checks for streetName2 presence and
      only appends it if non-empty (line 147).
    risk_class: operational
    basis: >
      DTD shows "StreetName?" with optional modifier. Address.java toDOM method
      implements conditional serialization: "if (streetName2 != null &&
      !streetName2.equals(""))". The fromDOM method similarly treats it as optional
      with a null check.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
