  - record_key: supplier-integration-data-transfer-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The system SHALL provide a getData() method on SupplierOrder that returns a populated
      SupplierOrder value object containing all order data. This method shall retrieve all
      related entities (ContactInfo, LineItems) and construct a complete data transfer object.
    confidence: medium
    confidence_basis: >
      SupplierOrderEJB.getData() method (lines 205-216) is explicitly implemented to construct
      and return a SupplierOrder value object. The method extracts CMP fields (poId, poDate) and
      retrieves related collections (lineItems). However, the comment and implementation suggest
      this is a utility method for serialization/transfer rather than a primary business operation.
      The method is present and active in the codebase.
    risk_class: operational
    basis: >
      SupplierOrderEJB.getData() (lines 205-216) creates a new SupplierOrder object, populates
      it with getPoId(), getPoDate(), getShippingInfo() (from ContactInfo), and iterates through
      getLineItems() to add each LineItem to the returned object. This method is used for
      converting the entity bean to a serializable value object.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 205
        line_end: 216
        excerpt: |
          public SupplierOrder getData() {
            SupplierOrder supplierOrder = new SupplierOrder();
            supplierOrder.setOrderId(getPoId());
            supplierOrder.setOrderDate(new Date(getPoDate()));
            supplierOrder.setShippingInfo(supplierOrder.getShippingInfo());
            Collection lineItems = getLineItems();
            for (Iterator iterator = lineItems.iterator(); iterator.hasNext();) {
              LineItemLocal lineItem = (LineItemLocal) iterator.next();
              supplierOrder.addLineItem(lineItem.getData());
            }
            return supplierOrder;
          }
