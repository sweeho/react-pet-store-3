records:
  - record_key: order-workflow-requirement-0001
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL support lookup of J2EE resources (EJB homes, JMS destinations,
      datasources, and environment entries) via JNDI, wrapping any NamingException or
      runtime exception in a ServiceLocatorException with appropriate error context.
    confidence: high
    confidence_basis: >
      The code implements exception handling consistently across all lookup methods in both
      ServiceLocator implementations (ejb/ServiceLocator.java and web/ServiceLocator.java).
      The pattern is enforced uniformly for EJB homes, JMS resources, datasources, and
      environment entries. Exception wrapping is declared in the method signatures and
      demonstrated in the try-catch blocks.
    risk_class: operational
    basis: >
      Both ServiceLocator implementations catch NamingException and Exception from
      InitialContext.lookup() calls and re-throw as ServiceLocatorException. This pattern
      is consistent across 10 lookup methods in each implementation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 217
        line_end: 227
        excerpt: |
          public boolean getBoolean(String envName) throws ServiceLocatorException {
            Boolean bool = null;
            try {
              bool = (Boolean)ic.lookup(envName);
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
            return bool.booleanValue();
          }
    stack_metadata:
      ejb.bean: N/A
      framework: J2EE JNDI

  - record_key: order-workflow-requirement-0002
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL provide root cause exception extraction to unwrap nested
      ServiceLocatorException instances and retrieve the underlying cause for error
      diagnostics and logging.
    confidence: high
    confidence_basis: >
      The getRootCause() method is explicitly implemented and documented in the
      ServiceLocatorException class. The recursive logic is straightforward and
      the method is called directly in the toString() override, showing it is
      actively used for error reporting.
    risk_class: operational
    basis: >
      ServiceLocatorException.getRootCause() recursively unwraps nested
      ServiceLocatorException instances and returns the original exception or
      the ServiceLocatorException itself if no wrapped exception exists.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 92
        line_end: 97
        excerpt: |
          public Exception getRootCause() {
            if (exception instanceof ServiceLocatorException) {
              return ((ServiceLocatorException) exception).getRootCause();
            }
            return exception == null ? this : exception;
          }
    stack_metadata:
      framework: J2EE JNDI

  - record_key: order-workflow-requirement-0003
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL implement the Service Locator pattern for the web tier with
      a singleton pattern: a single static instance initialized at class load time
      that is accessible via getInstance().
    confidence: high
    confidence_basis: >
      The web/ServiceLocator class explicitly implements singleton pattern with
      static initialization block, static instance variable, and getInstance() method.
      The pattern is complete and unambiguous in the code. The ejb/ServiceLocator
      does not implement this pattern (no getInstance method or static instance),
      confirming this is web-tier specific.
    risk_class: operational
    basis: >
      The web/ServiceLocator has a static instance field 'me', a static initializer
      that creates the instance at class load time, and a getInstance() method that
      returns it. The ejb/ServiceLocator lacks these elements, showing tier-specific
      design.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 72
        line_end: 96
        excerpt: |
          private static ServiceLocator me;

          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }

          static public ServiceLocator getInstance() {
            return me;
          }
    stack_metadata:
      framework: J2EE Singleton Pattern

  - record_key: order-workflow-requirement-0004
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL cache JNDI-looked-up resources (EJB homes, JMS destinations,
      datasources, and environment entries) in the web-tier Service Locator to improve
      performance by reusing previously obtained resource references.
    confidence: high
    confidence_basis: >
      The caching logic is explicit and consistent in web/ServiceLocator: every lookup
      method checks the cache before performing JNDI lookup, and stores the result if
      not found. The ejb/ServiceLocator does not implement caching, confirming this is
      a specific requirement for the web tier. The pattern is uniform across all 10
      lookup methods.
    risk_class: operational
    basis: >
      The web/ServiceLocator maintains a java.util.HashMap wrapped in
      Collections.synchronizedMap(). Each lookup method (getLocalHome, getRemoteHome,
      getQueueConnectionFactory, getQueue, getTopicConnectionFactory, getTopic,
      getDataSource) checks cache.containsKey() before calling ic.lookup(), and
      stores results with cache.put().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 240
        line_end: 255
        excerpt: |
          public DataSource getDataSource(String dataSourceName) throws ServiceLocatorException {
            DataSource dataSource = null;
            try {
              if (cache.containsKey(dataSourceName)) {
                 dataSource = (DataSource) cache.get(dataSourceName);
              } else {
                  dataSource = (DataSource)ic.lookup(dataSourceName);
                  cache.put(dataSourceName, dataSource );
              }
            } catch (NamingException ne) {
               throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
            return dataSource;
          }
    stack_metadata:
      framework: J2EE JNDI

  - record_key: order-workflow-requirement-0005
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL use thread-safe cache operations in the web-tier Service Locator
      to support concurrent access to cached resource references without synchronization
      overhead in the calling code.
    confidence: high
    confidence_basis: >
      The web/ServiceLocator explicitly initializes the cache using
      Collections.synchronizedMap(new HashMap()), which is a documented thread-safe
      wrapper. The ejb/ServiceLocator does not use any cache, confirming this is a
      web-tier specific requirement. No explicit synchronization in calling code is
      required when accessing the cache.
    risk_class: operational
    basis: >
      In web/ServiceLocator constructor, the cache is initialized with
      Collections.synchronizedMap(new HashMap()), providing atomic operations for
      containsKey(), get(), and put() without requiring synchronized blocks in the
      lookup methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 83
        line_end: 92
        excerpt: |
          private ServiceLocator() throws ServiceLocatorException  {
            try {
              ic = new InitialContext();
              cache = Collections.synchronizedMap(new HashMap());
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
          }
    stack_metadata:
      framework: J2EE Collections

  - record_key: order-workflow-requirement-0006
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL support lookup of EJB remote homes via JNDI with proper
      PortableRemoteObject.narrow() casting to obtain correctly typed references
      across application servers.
    confidence: high
    confidence_basis: >
      The getRemoteHome() method explicitly uses PortableRemoteObject.narrow() in
      both implementations with a Class parameter for the target type. This is a
      standard J2EE pattern for remote EJB access. The method signature and implementation
      are identical in both ejb and web tiers, showing it is a general requirement.
    risk_class: operational
    basis: >
      Both ServiceLocator implementations implement getRemoteHome(String jndiHomeName,
      Class className) which calls ic.lookup(jndiHomeName) and then applies
      PortableRemoteObject.narrow(objref, className) before casting to EJBHome.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 101
        line_end: 113
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }
    stack_metadata:
      ejb.bean: Remote EJB lookup
      framework: J2EE RMI-IIOP

