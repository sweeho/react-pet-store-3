  - record_key: SUPP-RULE-0003
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      If an item cannot be found in inventory during fulfillment, the item SHALL
      be treated as unavailable and the line item SHALL remain unshipped.
    confidence: high
    confidence_basis: >
      The checkInventory method catches FinderException when inventoryHomeRef.findByPrimaryKey
      fails, treats it as item unavailable, and returns false without deducting inventory.
    risk_class: operational
    basis: >
      In checkInventory (lines 132-137), if the item is not found in the Inventory
      table (FinderException), the exception is caught with a comment explaining
      the supplier has not been populated, and the method returns false.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item) {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
          }
    stack_metadata:
      framework: ejb
      ejb.bean: OrderFulfillmentFacadeEJB

