  # Admin Dashboard - Order Reporting
  - record_key: AD-BR-0002
    kind: business-rule
    capability_key: admin-dashboard
    requirement: >
      The system SHALL provide administrators the ability to view orders filtered by status.
      GIVEN an administrator requests orders by status
      WHEN the status (e.g., PENDING, APPROVED, SHIPPED_PART, COMPLETED, DENIED) is provided
      THEN the system SHALL return a collection of OrderDetails containing order ID, user ID, date,
      total value, and current status.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB.getOrdersByStatus() is explicitly remote-accessible via session bean.
      The method queries ProcessManager for orders with given status, then looks up each purchase order
      and formats details. Database query is generated via CMP (Container-Managed Persistence) finder methods.
      Transaction attribute is Required (declarative).
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB remote session bean exposes getOrdersByStatus(String status) method.
      It calls processManagerLocal.getOrdersByStatus(status) to get collection, iterates through results,
      looks up PurchaseOrder for each orderId, extracts poDate, poValue, and formats order details.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 130
        line_end: 157
        excerpt: |
          public OrdersTO getOrdersByStatus(String status)
                                                        throws OPCAdminFacadeException {
              OrdersTO.MutableOrdersTO retVal = new OrdersTO.MutableOrdersTO();
              PurchaseOrderLocal po;
              ProcessManagerLocal mgr = getProcMgr();
              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection orders = mgr.getOrdersByStatus(status);
                  Iterator it = orders.iterator();
                  while((it!= null) && (it.hasNext())) {
                      ManagerLocal mgrEjb = (ManagerLocal) it.next();
                      po = pohome.findByPrimaryKey(mgrEjb.getOrderId());
                      Date gotDate = new Date(po.getPoDate());
                      String podate = (gotDate.getMonth()+1) + "/" +
                          gotDate.getDate() + "/" + (gotDate.getYear()+1900);
                      retVal.add(new OrderDetails(po.getPoId(), po.getPoUserId(),
                                                  podate, po.getPoValue(), status));
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
