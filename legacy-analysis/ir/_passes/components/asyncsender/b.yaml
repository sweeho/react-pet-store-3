  - record_key: CUST-COMM-REQ-0004
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL transmit messages as JMS TextMessage objects containing
      the caller-provided string as the message body.
    confidence: high
    confidence_basis: >
      The implementation explicitly creates a TextMessage, sets the text from the
      String parameter, and sends it. This is a required JMS protocol behavior
      with no alternatives in the code.
    risk_class: operational
    basis: >
      AsyncSenderEJB.sendAMessage creates a TextMessage via
      session.createTextMessage(), sets the message text with jmsMsg.setText(msg),
      and sends it via qSender.send(jmsMsg). The msg parameter is passed from the
      caller (e.g., purchaseOrder.toXML() in OrderEJBAction).
