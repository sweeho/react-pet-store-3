  - record_key: WAF-REQUIREMENT-0004
    kind: requirement
    capability_key: admin-dashboard
    requirement: >
      The system SHALL provide a client-state caching tag (client_cache_link) that
      encodes request parameters and request attributes as Base64-serialized hidden
      form variables to preserve state across navigation.
    confidence: high
    confidence_basis: >
      Tag is declared in waftags.tld with detailed documentation. Implementation
      class ClientStateTag exists. Dual evidence of declaration + implementation.
    risk_class: presentational
    basis: >
      waftags.tld defines tag client_cache_link with tagclass
      com.sun.j2ee.blueprints.waf.view.taglibs.smart.ClientStateTag. The tag
      documentation states: "This tag caches state in the page and provides a
      button or image link within a form with the current page parameters and
      the page request attributes by encoding them as hidden form variables that
      are serialized using Base 64 Encoded Strings."
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/waftags.tld
        line_start: 20
        line_end: 81
        excerpt: |
          <!-- client  cache link tag -->
          <tag>
            <name>client_cache_link</name>
            <tagclass>com.sun.j2ee.blueprints.waf.view.taglibs.smart.ClientStateTag</tagclass>
            <bodycontent>JSP</bodycontent>
            <info>
             This tag caches state in the page and provides a button or
             image link within a form with the current page parameters
             and the page request attributes by encoding them as hidden
             form variables that are serialized using Base 64 Encoded Strings.

             This tag when used along with a front controller such as the
