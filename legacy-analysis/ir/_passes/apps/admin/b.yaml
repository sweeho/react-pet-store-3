  - record_key: integration-0001
    kind: integration
    capability_key: order-approval
    requirement: >
      The system SHALL support delivery of rich client application through
      Java Web Start (JNLP). When an authenticated administrator requests
      the 'manageorders' screen, the system SHALL generate a dynamic JNLP
      file containing the client application metadata, including server
      hostname, port, and session ID for client-server communication.
    confidence: medium
    confidence_basis: >
      AdminRequestProcessor.buildJNLP() generates JNLP XML dynamically from
      request parameters. doPost() responds to currentScreen=manageorders
      with JNLP content-type and calls buildJNLP(). JNLP template includes
      codebase, jar references, and application descriptor with server
      details and session ID. Implementation is clear but represents
      deployment mechanism rather than core business logic.
    risk_class: operational
    basis: >
      AdminRequestProcessor.doPost() checks currentScreen parameter. If value
      is "manageorders", sets response content-type to "application/x-java-jnlp-file"
      and outputs buildJNLP(req) result. buildJNLP() constructs JNLP XML with
      codebase from req.getServerName() and req.getServerPort(), includes
      jar references, and application-desc with main-class
      PetStoreAdminClient, arguments including server details and
      req.getSession().getId().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 63
        line_end: 120
        excerpt: |
          protected String buildJNLP(HttpServletRequest req) throws ServletException {
              String serverName = req.getServerName();
              int serverPort = req.getServerPort();
              StringBuffer jnlp = new StringBuffer();
              jnlp.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n");
              jnlp.append("<jnlp codebase=\"http://").append(serverName).append(":").append(serverPort).append("/admin\">\n");
              jnlp.append("<information>\n").append("<title>Pet Store Admin Rich Client</title>\n");
              jnlp.append("<argument>com.sun.j2ee.blueprints.admin.client.HttpPostPetStoreProxy</argument>\n");
              jnlp.append("<argument>").append(serverName).append("</argument>\n");
              jnlp.append("<argument>").append(serverPort).append("</argument>\n");
              jnlp.append("<argument>").append(req.getSession().getId()).append("</argument>\n");
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
              throws IOException, ServletException {
              String curScreen = req.getParameter("currentScreen");
              if(curScreen.equals("manageorders")) {
                  resp.setContentType("application/x-java-jnlp-file");
                  ServletOutputStream out = resp.getOutputStream();
                  out.println(buildJNLP(req));

  - record_key: integration-0002
    kind: integration
    capability_key: order-approval
    requirement: >
      The system SHALL use XML as the protocol for rich client communication
      with the admin web tier. Requests SHALL include Type element identifying
      operation (GETORDERS, UPDATESTATUS, REVENUE, ORDERS). Responses SHALL
      include XML elements matching the request type (e.g., Order elements
      for GETORDERS, Category/Item elements for chart requests).
    confidence: high
    confidence_basis: >
      ApplRequestProcessor is the sole handler for rich client XML requests.
      All three request types (getOrders, updateOrders, getChartInfo) are
      explicitly implemented with XML parsing via DocumentBuilder and
      response generation via StringBuffer XML construction. Pattern is
      consistent and deterministic across all operations.
    risk_class: operational
    basis: >
      ApplRequestProcessor.doPost() reads request XML via BufferedReader,
      parses with DocumentBuilder, extracts root element and Type element
      value. Dispatches to getOrders(), updateOrders(), or getChartInfo()
      based on Type value. getOrders() extracts Status, calls getOrdersByStatus(),
      iterates OrderDetails objects, appends XML elements for each. updateOrders()
      extracts Order elements with OrderId and OrderStatus, builds OrderApproval
      XML. getChartInfo() extracts Start, End, ReqCategory, calls getChartInfo(),
      iterates Map entries, appends Category or Item XML elements with values.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 85
        line_end: 164
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
              throws java.io.IOException, javax.servlet.ServletException {
              HttpSession session = req.getSession(false);
              ServletOutputStream out = resp.getOutputStream();
              if(session == null) {
                  // error handling
              } else {
                  String sId = session.getId();
                  resp.setContentType("text/xml");
                  BufferedReader inp = req.getReader();
                  StringBuffer strbuf = new StringBuffer("");
                  while(true) {
                      String str = inp.readLine();
                      if(str == null) break;
                      strbuf.append(str+"\n");
                  }
                  out.println(processRequest(strbuf.toString()));
              }
          String processRequest(String xmlString) {
              InputSource source =
                  new InputSource(new ByteArrayInputStream(xmlString.getBytes()));
              DocumentBuilder db =
                  DocumentBuilderFactory.newInstance().newDocumentBuilder();
              Element root = db.parse(source).getDocumentElement();
              String reqType = getValue(root.getElementsByTagName("Type").item(0));
              if (reqType.equals("GETORDERS")) {
                  return getOrders(root);
              }
              else if (reqType.equals("UPDATESTATUS")) {
                  return updateOrders(root);
              }
              else if (reqType.equals("REVENUE") || reqType.equals("ORDERS")) {
                  return getChartInfo(root, reqType);
              }

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >
      The getProperDate() method uses deprecated Date constructor with
      year.intValue()-1900, month.intValue()-1, day.intValue(). This
      indicates legacy date handling from early Java versions where years
      required the 1900 offset and months were zero-indexed. Unclear
      whether this handles dates correctly across all input formats or
      century boundaries. Modern implementations would use Calendar or
      java.time API. Date arithmetic may not handle leap years or DST
      correctly.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
    description: >
      The session-config specifies a session-timeout of 54 minutes. No
      documentation explains why this specific value was chosen. It is
      unclear whether this timeout applies to the admin web tier session,
      the rich client session, or both. Whether sessions are shared or
      separate between web tier and client application is not explicit
      in the configuration.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/PetStoreAdminClient.java
    description: >
      The comment "TODO: If no network connection is currently available the
      data will be cached locally until a network connection is available."
      indicates an intended feature for offline caching. No evidence that
      this feature was implemented. Current implementation appears to
      require network connectivity at all times. Unclear whether this is
      a design goal or aspirational comment.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >
      Error handling in ApplRequestProcessor catches exceptions but
      frequently returns null on error (line 201-202, 303) rather than
      meaningful error XML. This makes it unclear how the client
      interprets processing failures. Also, some exceptions (e.g.,
      XMLDocumentException in AdminRequestBD) are caught and wrapped
      but their handling is not shown in processRequest error cases.
      Path through exception handling may result in null return instead
      of client error message.
