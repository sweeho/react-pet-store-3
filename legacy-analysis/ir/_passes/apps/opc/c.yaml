  - record_key: ORDER-APPROVAL-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      Orders with a total price less than 500 USD (or less than 50000 JPY for Japanese locale orders)
      SHALL be automatically approved upon receipt. Larger orders SHALL remain in PENDING status
      awaiting administrator approval.
    confidence: high
    confidence_basis: >
      The rule is explicit in the source code with literal threshold values and locale-specific logic.
      The mechanism is hardcoded in the canIApprove() method with specific numeric thresholds and
      Locale comparisons. Both the rule and the implementation are clear and authoritative.
    risk_class: financial
    basis: >
      PurchaseOrderMDB.canIApprove() method applies hardcoded thresholds: Locale.US < 500, Locale.JAPAN < 50000.
      When these thresholds are met, the order is immediately approved by generating an OrderApproval XML
      and sending it to the OrderApprovalMDB queue. Larger orders remain PENDING for manual review.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 158
        line_end: 163
        excerpt: |
          if(canIApprove(purchaseOrder)) {
            ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
            OrderApproval oa = new OrderApproval();
            oa.addOrder(co);
            ret = oa.toXML();
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      ejb.transaction: Required

  - record_key: ORDER-APPROVAL-0002
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL support admin review and batch approval or denial of orders. An administrator
      SHALL be able to update the status of multiple pending orders in a single operation via
      OrderApproval messages containing status decisions.
    confidence: high
    confidence_basis: >
      The OrderApprovalMDB is designed to process batches of order decisions from an OrderApproval message,
      iterating through a collection of ChangedOrder objects and updating each in the ProcessManager.
      The batch processing capability and multiple order support are explicit in the code structure.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() receives an OrderApproval XML containing a collection of ChangedOrder objects.
      It iterates through this collection, checks each order's current status, and applies the status update
      from the admin decision. Multiple orders are processed in a single transaction.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 191
        line_end: 224
        excerpt: |
          approval = OrderApproval.fromXML(xmlMessage, entityCatalogURL, validateXmlOrderApproval);
          Collection coll = approval.getOrdersList();
          Iterator it = coll.iterator();
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            // ... add to mail list ...
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
            if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
              po = poHome.findByPrimaryKey(co.getOrderId());
              String xmlPO = getXmlPO(po, supplierOrderXDE);
              supplierPoList.add(xmlPO);
            }
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      ejb.transaction: Required

  - record_key: SUPPLIER-INTEG-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      When an order is approved, the system SHALL send a purchase order to the supplier in XML format
      containing order ID, order date, shipping address, and line items with category, product, item ID,
      line number, quantity, and unit price.
    confidence: high
    confidence_basis: >
      The OrderApprovalMDB explicitly builds TPASupplierOrderXDE documents for approved orders with
      all required fields. The document structure is defined in the getXmlPO() method which is called
      only for approved orders. The supplier order generation logic is enforced programmatically.
    risk_class: operational
    basis: >
      OrderApprovalMDB.getXmlPO() constructs an XML purchase order with the order ID, date, shipping
      address (from contact info), and iterates through line items to add each with all required fields.
      This is only done for APPROVED orders (line 219-222 condition).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 248
        line_end: 268
        excerpt: |
          private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
            supplierOrderXDE.newDocument();
            supplierOrderXDE.setOrderId(po.getPoId());
            Date tmpDate = new Date(po.getPoDate());
            supplierOrderXDE.setOrderDate(tmpDate);
            ContactInfoLocal cinfo = po.getContactInfo();
            AddressLocal addr = cinfo.getAddress();
            supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                addr.getStreetName1(), addr.getCity(),
                                                addr.getState(), addr.getCountry(),
                                                addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());
            Collection liColl = po.getData().getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItem li = (LineItem) liIt.next();
              supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),
                                           li.getLineNumber(), li.getQuantity(), li.getUnitPrice());
            }
            return supplierOrderXDE.getDocumentAsString();
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 218
        line_end: 223
        excerpt: |
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
