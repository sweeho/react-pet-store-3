  - record_key: order-workflow-business-rule-0002
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      A SupplierOrder status SHALL transition through states: PENDING → APPROVED
      → COMPLETED, or alternatively PENDING → DENIED. The setPoStatus method
      enables state transitions.
    confidence: high
    confidence_basis: >
      OrderStatusNames defines four states with documented transitions in its
      class javadoc. The setPoStatus method declared in ejb-jar.xml with
      Required transaction attribute allows any status update. No validation
      logic is enforced in the code, allowing any transition.
    risk_class: operational
    basis: >
      OrderStatusNames class documents the state machine:
      "pending->approved->completed or pending->denied". Four status constants
      are defined: PENDING, APPROVED, DENIED, COMPLETED.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 62
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {
              public static final String PENDING = "PENDING";
              public  static final String APPROVED = "APPROVED";
              public  static final String DENIED = "DENIED";
              public  static final String COMPLETED = "COMPLETED";
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.transaction: Required

  - record_key: supplier-integration-workflow-0001
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      When a SupplierOrder is created from supplier order data, the system SHALL
      atomically create a ContactInfo record with the supplier's shipping
      information and associate it with the order, then create LineItem records
      for each item in the order and associate them with the order, all within
      a single transaction.
    confidence: high
    confidence_basis: >
      The ejbPostCreate method (invoked immediately after ejbCreate) contains
      all the logic to create related entities. The method is wrapped with
      container-managed transactions (Required attribute from line 454), ensuring
      all operations commit or roll back together. ServiceLocatorException is
      caught and re-thrown as CreateException, causing order creation to fail
      if association fails.
    risk_class: operational
    basis: >
      SupplierOrderEJB.ejbPostCreate at lines 162-184 creates ContactInfo by
      invoking cinforef.create(supplierOrder.getShippingInfo()), then iterates
      over the order's line items and creates LineItemLocal instances, adding
      each to the order. This occurs in a Required transaction (ejb-jar.xml,
      line 454).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 158
        line_end: 184
        excerpt: |
          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                              throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);
              LineItemLocalHome lineItemref = (LineItemLocalHome)
                  serviceLocator.getLocalHome(JNDINames.LI_EJB);
              Collection litems = supplierOrder.getLineItems();
              Iterator it = litems.iterator();
              while((it != null) && (it.hasNext())) {
                LineItem li = (LineItem) it.next();
                LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
                addLineItem(lineItemloc);
              }
            } catch(ServiceLocatorException ne) {
              throw new CreateException("ServiceLocator Ex while persisting PO CMR :" +
                                        ne.getMessage());
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 445
        line_end: 456
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>SupplierOrderEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
              <method-name>create</method-name>
              <method-params>
                <method-param>com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrder</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.transaction: Required

