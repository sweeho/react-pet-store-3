  - record_key: SUPP-REQ-0007
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL support partial order fulfillment when some but not all line items
      are available in inventory. Items that cannot be fulfilled SHALL remain PENDING.
    confidence: high
    confidence_basis: >
      The processAnOrder method iterates through each line item and calls checkInventory
      independently. If the check fails for an item, allItemsAvailable is set to false
      but processing continues. Only if ALL items pass does it set poStatus to COMPLETED.
      This logic is explicit in the code.
    risk_class: operational
    basis: >
      In OrderFulfillmentFacadeEJB.processAnOrder() (lines 176-210), the code processes
      each line item with independent inventory checks. If any check fails,
      allItemsAvailable remains false. At line 197-198, only if allItemsAvailable is
      true does it set poStatus to COMPLETED; otherwise the PO remains in its current
      state (implicitly PENDING).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
              if(invoiceReqd) {
                try {
                  invoiceXml = (createInvoice(po, items));
                } catch (XMLDocumentException xe) {
                  System.out.println("OrderFulfillmentFacade**" + xe);
                  return null;
                }
              }
              return invoiceXml;
    stack_metadata:
      framework: ejb
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

  - record_key: SUPP-REQ-0008
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      When new inventory arrives at the supplier, the system SHALL reprocess all pending
      purchase orders to determine if any can now be fulfilled.
    confidence: high
    confidence_basis: >
      The processPendingPO method is explicitly designed to be called when inventory
      arrives. It queries for all orders with PENDING status, re-processes each one,
      and generates invoices for any newly fulfilled items. The RcvrRequestProcessor
      servlet calls this method after inventory updates.
    risk_class: operational
    basis: >
      The OrderFulfillmentFacadeEJB.processPendingPO() method (lines 247-269) finds
      all orders with status PENDING via findOrdersByStatus, iterates through them,
      and calls processAnOrder for each. The RcvrRequestProcessor servlet (lines 186)
      calls procPO.processPendingPO() after inventory is updated.
    traces:
