<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Inventory access denied — wireframe</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #27272a; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 24px; border-bottom: 1px solid #e4e4e7; }
  .brand { font-weight: 600; font-size: 13px; color: #3f3f46; }
  .brand span { color: #a1a1aa; font-weight: 400; }
  .wrap { display: flex; justify-content: center; padding: 88px 24px; }
  .card { width: 420px; border: 1px solid #e4e4e7; border-radius: 10px; padding: 24px; text-align: center; }
  .icon { width: 36px; height: 36px; border: 1px solid #a1a1aa; border-radius: 50%; margin: 0 auto 14px; }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
  p { margin: 0 0 20px; font-size: 13px; color: #71717a; }
  .btn { display: inline-block; height: 36px; line-height: 36px; padding: 0 18px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #3f3f46; color: #fff; }
  .anno { max-width: 420px; margin: 16px auto 0; font-size: 11px; color: #a1a1aa; border-left: 2px solid #e4e4e7; padding-left: 8px; text-align: left; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Pet Store <span>/ Supplier</span></div>
    <div class="brand"><span>Not signed in</span></div>
  </div>

  <div class="wrap">
    <div>
      <div class="card">
        <div class="icon"></div>
        <h1>Access denied</h1>
        <p>The inventory portal is open to supplier staff only.</p>
        <span class="btn">Sign in</span>
      </div>
      <p class="anno">Shown when an unauthenticated user, or a signed-in user without the supplier role, requests the inventory page. No inventory data is rendered behind this state.</p>
    </div>
  </div>
</body>
</html>
