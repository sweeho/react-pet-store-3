      framework: J2EE EJB 2.0 MDB
  - record_key: SUPINT-REQUIREMENT-0002
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL check inventory availability before fulfilling order
      line items. If the inventory quantity is less than the requested quantity,
      the line item SHALL NOT be shipped and inventory SHALL NOT be deducted.
    confidence: high
    confidence_basis: >
      The checkInventory method in OrderFulfillmentFacadeEJB (lines 126-139) explicitly
      compares inv.getQuantity() with item.getQuantity() and returns false if inventory
      is insufficient. This is called from processAnOrder (line 189) and inventory
      deduction only happens on true return.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.checkInventory checks inventory quantity and only
      calls reduceQuantity if sufficient inventory exists (lines 126-139). The processAnOrder
      method calls checkInventory for each line item and only marks item as completed
      if checkInventory returns true (lines 185-196).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      db.object: InventoryEJB
