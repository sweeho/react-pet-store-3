records:
  - record_key: CC-ENTITY-0001
    kind: entity
    capability_key: creditcard-validation
    requirement: >
      The system SHALL store credit card data as a Container-Managed Persistence (CMP)
      entity bean with three required fields: CardNumber, CardType, and ExpiryDate.
    confidence: high
    confidence_basis: >
      The requirement is declaratively defined in ejb-jar.xml with CMP 2.x configuration
      and three abstract fields in CreditCardEJB. Confirmed by both deployment descriptor
      and implementation.
    risk_class: financial
    basis: >
      ejb-jar.xml declares CreditCardEJB as a CMP entity with persistence-type=Container
      and cmp-version=2.x, with three declared CMP fields: cardNumber, cardType, expiryDate.
      CreditCardEJB.java lines 50-57 define abstract getter/setter methods for these fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 46
        line_end: 72
        excerpt: |
          <entity>
            <display-name>CreditCardEB</display-name>
            <ejb-name>CreditCardEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.creditcard.ejb.CreditCardLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.creditcard.ejb.CreditCardLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.creditcard.ejb.CreditCardEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.Object</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>CreditCard</abstract-schema-name>
            <cmp-field>
              <field-name>expiryDate</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>cardType</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>cardNumber</field-name>
            </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 50
        line_end: 57
        excerpt: |
          public abstract String getCardNumber();
          public abstract void setCardNumber(String cardNumber);
          public abstract String getCardType();
          public abstract void setCardType(String cardType);
          public abstract String getExpiryDate();
          public abstract void setExpiryDate(String expiryDate);
    stack_metadata:
      ejb.bean: CreditCardEJB
      ejb.persistence: Container-Managed Persistence 2.x
      db.object: CreditCard

