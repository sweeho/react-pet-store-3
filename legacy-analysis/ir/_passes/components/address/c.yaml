  - record_key: ADDR-XML-SERIALIZE-0001
    kind: business-rule
    capability_key: order-checkout
    requirement: >
      The system SHALL serialize an Address to XML DOM format. The serialized structure
      SHALL include: streetName1 (required), streetName2 (conditional if non-empty),
      city, state, zipCode, and country. All elements use the XML element names defined
      in the Address DTD.
    confidence: high
    confidence_basis: >
      The toDOM() method in Address.java (lines 144-155) implements serialization with
      explicit logic. The method structure and element ordering matches the DTD schema
      exactly. The conditional check for streetName2 (lines 147-149) shows explicit
      handling of optional fields. No other serialization methods are defined in the
      codebase.
    risk_class: operational
    basis: >
      Address.java toDOM() (lines 144-155) creates an Element named "Address" and
      appends children in order: streetName1 (unconditional), streetName2 (conditional),
      city, state, zipCode, country. The conditional for streetName2 checks null and
      empty string. Country is appended unconditionally despite being optional in DTD.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }
    stack_metadata:
      transfer_object: Address

  - record_key: ADDR-XML-DESERIALIZE-0001
    kind: business-rule
    capability_key: order-checkout
    requirement: >
      The system SHALL deserialize an Address from XML DOM format. The parser SHALL
      require streetName1, city, state, zipCode, and country elements; SHALL treat
      streetName2 as optional; and SHALL throw XMLDocumentException if the element
      type is not "Address" or if any required element is missing.
    confidence: high
    confidence_basis: >
      The fromDOM() method (lines 157-180) is the sole deserialization path. It performs
      strict element-order parsing with explicit required/optional handling via the
      second parameter to XMLDocumentUtils calls (false for required, true for optional).
      The logic for streetName2 (lines 164-168) checks for optional sibling and only
      sets the field if present. Required fields fail with XMLDocumentException if missing.
    risk_class: operational
    basis: >
      Address.java fromDOM() (lines 157-180) parses DOM in order: (1) streetName1
      with false parameter (required), (2) streetName2 with true parameter (optional),
      (3) city, state, zipCode, country all with false parameter (required). Line 179
      throws XMLDocumentException if element is not type Address or if required fields
      are missing.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 157
        line_end: 180
        excerpt: |
          public static Address fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
              Element child;
              Address address = new Address();
              child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
              address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
              Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
              if (optionalChild != null) {
                address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                child = optionalChild;
              }
              child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
              address.city = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
              address.state = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
              address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
              address.country = XMLDocumentUtils.getContentAsString(child, false);
              return address;
            }
            throw new XMLDocumentException(XML_ADDRESS + " element expected.");
          }
    stack_metadata:
      transfer_object: Address

  - record_key: ADDR-TRANSACTION-0001
    kind: business-rule
    capability_key: order-checkout
    requirement: >
      The system SHALL apply Required transaction semantics to all AddressEJB accessor
      (get/set) methods and business methods. All operations on AddressLocal objects
      SHALL execute within a Required transactional context.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml assembly-descriptor section (lines 250-387) declares
      container-transaction elements for every AddressEJB method with trans-attribute
      Required. This covers all get/set methods (getStreetName1, getStreetName2, getCity,
