  - record_key: supplier-integration-line-item-relationship-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      A Supplier Order SHALL have one or more Line Items associated with it. Each Line Item
      identifies a product category ID, product ID, item ID, line number, quantity ordered,
      unit price, and quantity shipped. When a Supplier Order is deleted, all its associated
      Line Items SHALL be automatically deleted (cascade delete).
    confidence: high
    confidence_basis: >
      The ejb-jar.xml relationships section (lines 289-314) declares a ONE-TO-MANY relationship
      with cascade-delete on LineItem. The LineItemEJB (lines 187-224) defines all seven CMP
      fields. The SupplierOrder DTD (line 38) requires at least one LineItem (LineItem+).
      Both the declarative configuration and the value object model consistently enforce this.
    risk_class: operational
    basis: >
      ejb-jar.xml defines SupplierOrder-LineItem relationship (lines 289-314) with multiplicity
      One on SupplierOrder, Many on LineItem, with <cascade-delete /> (line 305). LineItemEJB
      (lines 187-224) declares CMP fields: categoryId (line 200), productId (line 203), itemId
      (line 206), lineNumber (line 209), quantity (line 212), unitPrice (line 215), quantityShipped
      (line 218). The SupplierOrder.java class (line 70) has ArrayList lineItems with addLineItem()
      method (lines 110-116).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 285
        line_end: 314
        excerpt: |
          <!--
             ONE-TO-MANY Relationship between SupplierOrder and line items.
             Every PO has 1 or more line items relate to it
          -->
