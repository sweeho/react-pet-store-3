    kind: entity
    capability_key: order-workflow
    requirement: >
      The system SHALL maintain a Purchase Order entity with the following required fields:
      Order ID (primary key), User ID, Email ID, Order Date, Locale, and Total Price.
    confidence: high
    confidence_basis: >
      Both the PurchaseOrder.java value object (lines 75-82) and the EJB entity configuration
      (ejb-jar.xml lines 60-83) consistently define these CMP fields with identical names and
      types. The PurchaseOrder DTD (lines 38-56) enforces these as required elements.
    risk_class: operational
    basis: >
      PurchaseOrder.java defines instance fields for orderId, userId, emailId, orderDate,
      locale, and totalPrice (lines 75-82). PurchaseOrderEJB.java abstract methods
      confirm these as CMP fields: getPoId, getPoUserId, getPoEmailId, getPoDate, getPoLocale,
      getPoValue (lines 79-145). ejb-jar.xml declares cmp-field elements for poId, poUserId,
      poEmailId, poDate, poLocale, poValue (lines 60-83) with poId as the primkey-field
      (line 84).
