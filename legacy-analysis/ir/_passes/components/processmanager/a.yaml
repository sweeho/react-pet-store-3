  - record_key: order-workflow-rule-0001
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      All order workflow operations (create, update, query) SHALL execute
      within a container-managed transaction with Required semantics, ensuring
      atomicity of order state changes.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declaratively configures all ProcessManagerEJB and
      ManagerEJB business methods with <trans-attribute>Required</trans-attribute>
      and <transaction-type>Container</transaction-type>. Multiple entries in
      the assembly-descriptor section consistently apply Required to all
      relevant methods, providing redundant enforcement.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly-descriptor section contains multiple
      container-transaction entries, each specifying Required semantics for
      createManager, updateStatus, getStatus, getOrdersByStatus, and all
      ManagerEJB state-mutating methods (setStatus, create, findByPrimaryKey,
      findOrdersByStatus).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 262
        line_end: 390
        excerpt: |
          <assembly-descriptor>
            <container-transaction>
              <method>
                <ejb-name>ManagerEJB</ejb-name>
                <method-intf>LocalHome</method-intf>
                <method-name>create</method-name>
                <method-params>
                  <method-param>java.lang.String</method-param>
                  <method-param>java.lang.String</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
            </container-transaction>
            <container-transaction>
              <method>
                <ejb-name>ProcessManagerEJB</ejb-name>
                <method-intf>Local</method-intf>
                <method-name>createManager</method-name>
                <method-params>
                  <method-param>java.lang.String</method-param>
                  <method-param>java.lang.String</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
            </container-transaction>

