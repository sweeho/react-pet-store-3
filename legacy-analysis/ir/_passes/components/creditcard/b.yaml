  - record_key: creditcard-validation-req-0001
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL accept credit card information during order checkout consisting
      of card number, card type, and expiry date.
    confidence: high
    confidence_basis: >
      OrderEvent class explicitly carries creditCard object. OrderEJBAction receives
      credit card from event and stores it in PurchaseOrder. CustomerHTMLAction
      extracts credit card fields from request parameters and creates CreditCard object.
    risk_class: financial
    basis: >
      OrderEvent constructor takes CreditCard parameter. OrderEJBAction.perform() calls
      purchaseOrder.setCreditCard(creditCard). CustomerHTMLAction.extractCreditCard()
      extracts credit_card_number, credit_card_type, credit_card_expiry_month, and
      credit_card_expiry_year from request parameters.
