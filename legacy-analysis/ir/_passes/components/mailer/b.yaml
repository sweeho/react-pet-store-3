  - record_key: customer-communications-req-0006
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL use container-managed transactions with Required transaction
      attribute for message processing, meaning the onMessage() method must execute
      within a container-demarcated transaction.
    confidence: high
    confidence_basis: >
      ejb-jar.xml declares transaction-type as Container and explicitly specifies
      container-transaction element for onMessage() method with trans-attribute Required.
      This is declarative policy, not implementation detail.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor defines container-transaction for MailerMDB.onMessage()
      with trans-attribute of Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 53
        line_end: 80
        excerpt: |
          <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
              <transaction-type>Container</transaction-type>
              <message-driven-destination>
                <destination-type>javax.jms.Queue</destination-type>
              </message-driven-destination>

              <resource-ref>
                 <res-ref-name>mail/MailSession</res-ref-name>
                 <res-type>javax.mail.Session</res-type>
                 <res-auth>Container</res-auth>
                 <res-sharing-scope>Shareable</res-sharing-scope>
               </resource-ref>
            </message-driven>

            <container-transaction>
              <method>
                <ejb-name>MailerMDB</ejb-name>
                <method-name>onMessage</method-name>
                <method-params>
                  <method-param>javax.jms.Message</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
            </container-transaction>

  - record_key: customer-communications-workflow-0001
    kind: workflow
    capability_key: customer-communications
    requirement: >
      GIVEN the mailer service receives a JMS message with XML-formatted email,
      WHEN the onMessage() listener processes it, THEN the message SHALL be parsed,
      a Mail object created, and the email sent via MailHelper.sendMail(), using the
      system's configured Mail Session from JNDI.
    confidence: high
    confidence_basis: >
      The entire flow is explicit in MailerMDB.onMessage(): message receive → cast to
      TextMessage → extract XML → Mail.fromXML() → sendMail(). Each step is clearly
      coded and traces directly.
    risk_class: operational
    basis: >
      MailerMDB.onMessage() method shows the complete workflow: receive Message parameter,
      cast to TextMessage, extract XML string, parse via Mail.fromXML(), then call
      sendMail() with extracted address, subject, content.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 74
        line_end: 91
        excerpt: |
          public void onMessage(Message recvMsg) {
            TextMessage textMessage = null;
            String xmlMailMessage = null;
            Mail recMail = null;
            try {
              textMessage = (TextMessage)recvMsg;
              xmlMailMessage = textMessage.getText();
              recMail = Mail.fromXML(xmlMailMessage);
              sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
            } catch (MailerAppException me) {
              //throw new EJBException("MailerMDB.onMessage" + me);
              //ignore since user probably forgot to set up mail server
            } catch (XMLDocumentException xde) {
              throw new EJBException("MailerMDB.onMessage" + xde);
            } catch(JMSException je) {
              throw new EJBException("MailerMDB.onMessage" + je);
            }
          }

