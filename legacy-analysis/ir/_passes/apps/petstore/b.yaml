  - record_key: customer-management-req-0002
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL allow users to sign on (authenticate) with their user ID
      and retrieve their customer profile including preferred language.
    confidence: high
    confidence_basis: >
      SignOnEJBAction.perform() calls scf.getCustomer().getProfile() (line 86)
      and retrieves profile.getPreferredLanguage() (line 87). The profile is
      fetched during sign-on and locale is set. FinderException is caught for
      new users (line 92).
    risk_class: operational
    basis: >
      SignOnEJBAction lines 77-97 show the sign-on flow. User ID is stored in
      ShoppingClientFacade. Profile retrieval and locale setting occur during
      authentication. FinderException handling indicates optional profile lookup.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 77
        line_end: 97
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              SignOnEvent cue = (SignOnEvent)e;
              String userId = cue.getUserName();
              ShoppingClientFacadeLocal scf = null;
              scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
              scf.setUserId(userId);
              try {
                  ProfileLocal profile = scf.getCustomer().getProfile();
                  Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
                  machine.setAttribute(PetstoreKeys.LOCALE, locale);
                  ShoppingCartLocal cart = scf.getShoppingCart();
                  cart.setLocale(locale);
              } catch ( FinderException fe) {
                  // in the process of creating a user for the first time
                  // so the locale will be se when creating the user
              }
              return null;
          }

