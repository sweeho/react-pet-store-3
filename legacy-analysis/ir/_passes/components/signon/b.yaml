  - record_key: customer-management-protected-config-0001
    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL read protected resources configuration from an XML file at
      /WEB-INF/signon-config.xml, containing signon-form-login-page,
      signon-form-error-page, and security-constraint definitions.
    confidence: high
    confidence_basis: >
      The configuration file is loaded in SignOnFilter.init() and parsed by
      SignOnDAO. The XML schema is defined and used consistently.
    risk_class: operational
    basis: >
      SignOnFilter.init() retrieves the resource URL and creates a SignOnDAO
      instance. SignOnDAO parses the XML and extracts protected resources, login
      page, and error page paths.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 88
        line_end: 102
        excerpt: |
          public void init(FilterConfig config) throws ServletException {
              this.config = config;
              URL protectedResourcesURL = null;
              try {
                  protectedResourcesURL = config.getServletContext().getResource("/WEB-INF/signon-config.xml");
                  if (protectedResourcesURL != null) {
                      SignOnDAO dao = new SignOnDAO(protectedResourcesURL);
                      signOnErrorPage = dao.getSignOnErrorPage();
                      signOnPage = dao.getSignOnPage();
                      protectedResources = dao.getProtectedResources();
                  }
              } catch (java.net.MalformedURLException ex) {
                  System.err.println("SignonFilter: malformed URL exception: " + ex);
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 38
        line_end: 82
        excerpt: |
          <signon-config>
