  - record_key: creditcard-validation-business-rule-0002
    kind: business-rule
    capability_key: creditcard-validation
    requirement: >
      The system SHALL require ACID transaction support for all credit card entity operations,
      with transaction attribute set to Required at both LocalHome and Local interface levels.
    confidence: high
    confidence_basis: >
      ejb-jar.xml declaratively specifies container-transaction elements for all methods
      with trans-attribute=Required. This appears consistently for all get/set operations,
      create operations, and remove operations.
    risk_class: financial
    basis: >
      ejb-jar.xml assembly-descriptor section defines container-transaction declarations
      with trans-attribute="Required" for each method on LocalHome and Local interfaces.
      All CRUD operations (create, get, set, remove) carry this attribute.
