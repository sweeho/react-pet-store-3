      ejb.security: use-caller-identity

  - record_key: CC-CREATION-0007
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL support creation of CreditCard entities via the LocalHome
      interface with three overloaded create() methods: one taking three string
      parameters (cardNumber, cardType, expiryDate), one taking a CreditCard value
      object, and one taking no parameters.
    confidence: high
    confidence_basis: >
      All three create methods are declared in ejb-jar.xml and implemented in
      CreditCardEJB with corresponding ejbCreate and ejbPostCreate lifecycle methods.
    risk_class: operational
    basis: >
      CreditCardEJB.java lines 62-86 show three ejbCreate methods with respective
      parameters. ejb-jar.xml lines 147-165 declare all three create overloads.
      Each is assigned trans-attribute=Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
        line_end: 86
        excerpt: |
          public Object ejbCreate(String cardNumber, String cardType,
                                  String expiryDate) throws CreateException {
                                    setCardNumber(cardNumber);
                                    setCardType(cardType);
                                    setExpiryDate(expiryDate);
                                    return null;
          }

          public Object ejbCreate(CreditCard creditCard) throws CreateException {
            setCardNumber(creditCard.getCardNumber());
            setCardType(creditCard.getCardType());
            setExpiryDate(creditCard.getExpiryDate());
            return null;
          }

          public Object ejbCreate() throws CreateException {
            return null;
          }
