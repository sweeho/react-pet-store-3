  - record_key: CAT-ENTITY-0004
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL maintain a Page entity representing a paginated result set
      with a list of objects, start position, and a hasNext flag indicating whether
      more results are available.
    confidence: high
    confidence_basis: >
      Page model is fully defined with clear semantics. All DAO methods return Page
      objects constructed consistently with the hasNext flag.
    risk_class: operational
    basis: >
      Page.java defines objects list, start position, and hasNext boolean flag.
      Multiple DAO implementations consistently create Page objects with these fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 94
        excerpt: |
          public class Page implements Serializable {
              List objects;
              int start;
              boolean hasNext;
              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }
              public boolean isNextPageAvailable() {
                  return hasNext;
              }
              public boolean isPreviousPageAvailable() {
                  return start > 0;
              }

