      The system SHALL accept email messages from a JMS queue in XML format
      and process them asynchronously via a message-driven bean.
    confidence: high
    confidence_basis: >
      Both declarative configuration (ejb-jar.xml message-driven-destination)
      and implementation (MailerMDB implements MessageDrivenBean and MessageListener)
      confirm asynchronous JMS queue processing. Two independent layers enforce
      this architectural pattern.
    risk_class: operational
    basis: >
      The MailerMDB is declared as a message-driven bean consuming from a
      javax.jms.Queue. The onMessage method is the entry point for all mail
      processing. Container manages the lifecycle and message delivery.
