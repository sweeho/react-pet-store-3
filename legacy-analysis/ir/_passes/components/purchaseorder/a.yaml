    capability_key: order-checkout
    requirement: >
      Each PurchaseOrder SHALL maintain a one-to-one relationship with a ContactInfo
      (shipping address) and a one-to-one relationship with a CreditCard.
    confidence: high
    confidence_basis: >
      Both relationships are declared in ejb-jar.xml as CMR (container-managed
      relationships) with multiplicity One and unidirectional direction. The PurchaseOrderEJB
      exposes getter/setter methods for both relationships with Required transaction
      attributes, indicating they are load-bearing persistence semantics.
    risk_class: operational
    basis: >
      ejb-jar.xml defines two ejb-relation declarations: PurchaseOrder-ContactInfo and
      PurchaseOrder-Card, each with One multiplicity and cascade-delete on the inverse side.
    traces:
