            <session-timeout>15</session-timeout>
          </session-config>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/ShoppingControllerEJB.java
        line_start: 73
        line_end: 76
        excerpt: |
          public void ejbCreate() {
              sm = new StateMachine(this, sc);
              sm.setAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE, getShoppingClientFacade());
          }

  - record_key: order-checkout-req-0001
