  - record_key: XMLDOC-REQUIREMENT-0014
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL support factory-based instantiation of XMLDocumentEditor
      implementations via XMLDocumentEditorFactory. The factory loads a catalog
      of schema-to-XDE-class mappings from a URL-specified properties file and
      instantiates the appropriate XDE class by its fully qualified class name
      for a given schema URI.
    confidence: high
    confidence_basis: >
      XMLDocumentEditorFactory.java implements the factory pattern with getXDE(String)
      and createXDE(String) methods. The factory maintains a Properties object of
      schema URI to class name mappings. It uses Class.forName().newInstance() to
      dynamically instantiate XDE classes.
    risk_class: operational
    basis: >
      XMLDocumentEditorFactory.java (lines 45-76) defines the factory class with
      Properties xdeCatalog field. Constructor (lines 51-58) loads mappings from
      a catalog URL. getXDE(String schemaURI) method (lines 60-66) retrieves the
      class name and calls createXDE(). createXDE(String className) method (lines
      68-74) uses Class.forName(className).newInstance() to instantiate the XDE.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 45
        line_end: 76
        excerpt: |
          public class XMLDocumentEditorFactory {
            private Properties xdeCatalog = new Properties();

            public XMLDocumentEditorFactory() {}

            public XMLDocumentEditorFactory(URL catalogURL) throws XMLDocumentException {
              try {
                xdeCatalog.load(catalogURL.openStream());
              } catch (IOException exception) {
                throw new XMLDocumentException("Can't load from resource: " + catalogURL, exception);
              }
            }

            public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
              String className = xdeCatalog.getProperty(schemaURI);
              if (className != null) {
                return createXDE(className);
              }
              throw new XMLDocumentException("No mapping for schema: " + schemaURI);
            }

            public XMLDocumentEditor createXDE(String className) throws XMLDocumentException {
              try {
                return (XMLDocumentEditor) Class.forName(className).newInstance();
              } catch(Exception exception) {
                throw new XMLDocumentException("Can't instantiate XDE: " + className, exception);
              }
            }
    stack_metadata:
      framework: Java reflection (dynamic class instantiation)

