  - record_key: supplier-integration-xml-serialization-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The system SHALL serialize and deserialize Supplier Order data to/from XML format.
      The XML representation SHALL conform to the SupplierOrder DTD and include all order
      fields (OrderId, OrderDate), shipping contact information, and line items.
      Date format SHALL be yyyy-MM-dd (ISO 8601 date format).
    confidence: high
    confidence_basis: >
      SupplierOrder.java (lines 57-277) implements comprehensive XML serialization (toXML methods
