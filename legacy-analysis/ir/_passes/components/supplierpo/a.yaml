findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
    description: >
      Line 221 contains a FIX ME comment indicating that orderDate parsing
      failure defaults to new Date() without clear logging. The condition under
      which this default is applied and whether it should occur is unresolved.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
    description: >
      The ContactInfo relationship to Address is unidirectional (line 254-255
      comment states no CMR field on Address side). It is unclear whether this
      is by design (to prevent independent Address deletion) or an oversight.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
    description: >
      Line 209 in getData() appears to have a bug: setShippingInfo is called
      with the result of getShippingInfo() on the newly-created object (not yet
      populated). This looks like it should be calling getContactInfo() and
      converting to ContactInfo, but the logic is unclear.
