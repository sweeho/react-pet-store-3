  - record_key: SERVICELOCATOR-BR-0013
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      The web-tier ServiceLocator implementation SHALL use a singleton pattern,
      initialized statically via a static block, ensuring a single instance is
      available application-wide through getInstance() method.
    confidence: high
    confidence_basis: >
      Static initializer block and getInstance() method are explicit in web tier
      implementation. EJB tier does not use singleton pattern (each caller creates new instance).
    risk_class: operational
    basis: >
      web/ServiceLocator uses static field 'me' initialized in static block.
      getInstance() returns the singleton instance. Private constructor prevents
      direct instantiation outside static block.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 67
        line_end: 96
        excerpt: |
          public class ServiceLocator {
            private InitialContext ic;
            private Map cache;
            private static ServiceLocator me;
            static {
              try {
                me = new ServiceLocator();
              } catch(ServiceLocatorException se) {
                System.err.println(se);
                se.printStackTrace(System.err);
              }
            }
            private ServiceLocator() throws ServiceLocatorException {
              // ...
            }
            static public ServiceLocator getInstance() {
              return me;
            }
          }
    stack_metadata:
      framework: j2ee
      session.scope: singleton

  - record_key: SERVICELOCATOR-BR-0014
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      The web-tier ServiceLocator SHALL implement resource caching using a
      synchronized HashMap to store and reuse previously looked-up resources,
      improving performance by avoiding repeated JNDI lookups for the same resource.
    confidence: high
    confidence_basis: >
      Web tier implementation explicitly initializes 'cache = Collections.synchronizedMap(new HashMap())'
      and every lookup method checks cache before performing JNDI lookup.
      EJB tier does not implement caching (no cache field).
    risk_class: operational
    basis: >
      All getXxx() methods in web tier check cache.containsKey() and cache.get()
      before performing ic.lookup(), storing results with cache.put().
      EJB tier getLocalHome() and getRemoteHome() do not cache.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 69
        line_end: 121
        excerpt: |
          private Map cache;
          private ServiceLocator() throws ServiceLocatorException {
            try {
              ic = new InitialContext();
              cache = Collections.synchronizedMap(new HashMap());
            } catch (...) { ... }
          }
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
                cache.put(jndiHomeName, home);
              }
            } catch (...) { ... }
            return home;
          }
    stack_metadata:
      framework: j2ee
      session.scope: singleton

