  - record_key: SUPP-RULE-0002
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      When a line item quantity cannot be fulfilled due to insufficient inventory,
      no inventory deduction SHALL occur and the item SHALL remain unshipped.
    confidence: high
    confidence_basis: >
      The checkInventory method returns false when inventory is insufficient and
      does not call reduceQuantity. The calling code only deducts inventory if
      checkInventory returns true.
    risk_class: operational
    basis: >
      In checkInventory (lines 129-130), if inv.getQuantity() < item.getQuantity(),
      the method returns false immediately without calling reduceQuantity.
      In processAnOrder (lines 189-192), if checkInventory returns false,
      allItemsAvailable is set to false and processing continues without marking
      the item as shipped.
    traces:
