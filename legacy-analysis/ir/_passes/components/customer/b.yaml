  - record_key: ACCT-WF-0001
    kind: workflow
    capability_key: customer-management
    requirement: >
      When an Account is created, the system SHALL automatically create an associated
      ContactInfo and CreditCard.
    confidence: high
    confidence_basis: >
      The ejbPostCreate method performs deterministic JNDI lookups and creates both
      related entities in sequence. This is the only documented initialization path.
    risk_class: operational
    basis: >
      AccountEJB has two create signatures, one accepting pre-created ContactInfo and
      CreditCard objects, and one creating them automatically. ejbPostCreate (lines 80-94)
      shows that when created with just status, ContactInfo and CreditCard are looked up
      and created automatically via JNDI.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 94
        excerpt: |
          public void ejbPostCreate(String status) throws CreateException {
            setStatus(status);
            try {
              InitialContext ic = new InitialContext();
              ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
              ContactInfoLocal contactInfo = cih.create();
              setContactInfo(contactInfo);
              CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
              CreditCardLocal creditCard = cch.create();
              setCreditCard(creditCard);
            } catch (javax.naming.NamingException ne) {
              throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
            }
          }

