  - record_key: SUPP-REQ-0005
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      When a purchase order contains multiple line items, the system SHALL process each
      line item independently. Items that can be fulfilled SHALL be shipped; items that
      cannot due to insufficient inventory SHALL remain unshipped but the order SHALL be
      retained for future retry.
    confidence: high
    confidence_basis: >
      processAnOrder (lines 176-210) iterates through lineItems collection. For each item,
      if li.getQuantity() == li.getQuantityShipped() it continues (skip already-shipped).
      Then calls checkInventory for each item independently (line 189). If fails, sets
      allItemsAvailable = false and continues (line 190-191) to process remaining items.
      Only if allItemsAvailable is true does it set order status to COMPLETED (lines 197-198).
      Otherwise order remains in prior state (implicitly PENDING from XML parsing).
    risk_class: operational
    basis: >
      processAnOrder creates boolean allItemsAvailable = true (line 178), iterates
      through line items, and only sets allItemsAvailable = false on failed checkInventory
      (line 190). At end, only calls po.setPoStatus(COMPLETED) if allItemsAvailable is
      true (lines 197-198). Items marked shipped via li.setQuantityShipped (line 193).
      If ANY item cannot be fulfilled, order status is not updated.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
              if(invoiceReqd) {
                try {
                  invoiceXml = (createInvoice(po, items));
                } catch (XMLDocumentException xe) {
                  System.out.println("OrderFulfillmentFacade**" + xe);
                  return null;
                }
              }
              return invoiceXml;
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

  - record_key: SUPP-REQ-0006
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      When at least one line item has been fulfilled from inventory, the system SHALL
      generate an XML invoice document containing all fulfilled items with their itemId,
      lineNumber, quantity, unitPrice, categoryId, and productId.
    confidence: high
    confidence_basis: >
      createInvoice method (lines 145-171) is called only when invoiceReqd is true
      (line 199). invoiceReqd is set to true when checkInventory succeeds and
      li.setQuantityShipped is called (line 195). The method iterates through
      po.getLineItems and only adds items that are in the newLis HashMap (fulfilled
      items). Each item is added via invoiceXDE.addLineItem with all required fields.
    risk_class: operational
    basis: >
      createInvoice (lines 145-171) constructs invoiceXDE document, sets poId, date
      fields, then iterates through line items. For each item in the newLis HashMap
      (which contains fulfilled items), calls invoiceXDE.addLineItem with
      anItem.getCategoryId(), getProductId(), getItemId(), getLineNumber(),
      getQuantity(), getUnitPrice(). newLis is populated in processAnOrder line 194
      only when checkInventory succeeds.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 171
        excerpt: |
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
                }
              }
              String invDoc = null;
              invDoc = invoiceXDE.getDocumentAsString();
              return(invDoc);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      xml.object: TPAInvoiceXDE

