  - record_key: admin-biz-rule-0001
    kind: business-rule
    capability_key: admin-dashboard
    requirement: >
      The system SHALL restrict access to the admin request processor endpoint
      to users in the "administrator" role only.
    confidence: high
    confidence_basis: >
      Security constraint is explicitly declared in web.xml with role enforcement.
      Both the declarative configuration and the web.xml security-constraint are
      unambiguous sources of enforcement.
    risk_class: operational
    basis: >
      web.xml defines a security-constraint on /AdminRequestProcessor URL pattern
      that requires the "administrator" role, enforced via auth-constraint element.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>
    stack_metadata:
      framework: J2EE Servlet
      web.xml.security-constraint: true

