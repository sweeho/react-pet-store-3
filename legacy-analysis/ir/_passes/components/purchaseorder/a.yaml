  - record_key: ORDER-CHECKOUT-0005
    kind: requirement
    capability_key: order-checkout
    requirement: >
      A PurchaseOrder SHALL store the total price as a float value representing the sum
      of all line items (before or after tax/shipping is determined by business logic
      outside this component).
    confidence: medium
    confidence_basis: >
      The poValue field is persisted as a float (ejb-jar.xml line 82-83) and is set
      during order creation (PurchaseOrderEJB.java line 203). However, no code in this
      component shows how the total is calculated from line items, suggesting that
      calculation happens upstream in the order-checkout component (petstore app).
    risk_class: financial
    basis: >
      ejb-jar.xml line 82-83; PurchaseOrderEJB.java line 203; PurchaseOrder.java lines
      81, 120-122, 174-177.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 82
        line_end: 83
        excerpt: |
          <cmp-field>
            <field-name>poValue</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 197
        line_end: 205
        excerpt: |
          public String ejbCreate(PurchaseOrder purchaseOrder) throws CreateException {
                setPoId(purchaseOrder.getOrderId());
                setPoUserId(purchaseOrder.getUserId());
                setPoEmailId(purchaseOrder.getEmailId());
                setPoDate(purchaseOrder.getOrderDate().getTime());
                setPoLocale(purchaseOrder.getLocale().toString());
                setPoValue(purchaseOrder.getTotalPrice());
                return null;
          }
    stack_metadata:
      framework: EJB 2.0 CMP
      db.object: PurchaseOrder

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: >
      Line 268 sets billing info equal to shipping info with a comment "// XXX".
      This appears intentional (not a copy-paste error) but the XXX marker suggests
      uncertainty about whether billing and shipping should always be identical or if
      this is a simplification for the demo. The specification does not clarify when
      billing differs from shipping.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
    description: >
      The automatic approval thresholds (500 USD, 50000 JPY) are hardcoded in the
      canIApprove method. No external configuration or documentation explains the
      business rationale for these specific values or how they were determined. It is
      unclear if other locales should also receive auto-approval, or if these are the
      only two supported locales.
