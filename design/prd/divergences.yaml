divergences:
  - claim: |
      A single approval threshold of $500 is applied to all orders.
    code_says: |
      The legacy source code implements a hardcoded $500 threshold that triggers admin review.
      However, a second threshold of $50,000 is also defined in the code (OrderStatusNames.java and related classes)
      but has no associated logic or behavior beyond the first threshold.
    document_says: |
      The PRD states: "The $500 figure is fixed in the source, not configurable at deploy time.
      Any rebuild should make it a setting, and probably a rule set rather than a single number."
      The document also notes: "A second threshold at $50,000 exists in the code but has no behaviour
      attached beyond the first, so all review effectively happens at one level."
    code_ref: legacy-analysis/discovery/report.md#p214-p219
    document_ref: design/sources/markdown/java-pet-store-1-3-2-product-requirements-document/extracted.md#p214-p220
    capability: order-approval
    severity: low
    notes: |
      Both the code and documentation agree that only the $500 threshold is active.
      The $50,000 threshold is present but unused. This is noted as a design shortcoming
      (inflexible and hardcoded) rather than a true contradiction. The rebuild should
      make thresholds configurable and support rule-based approval logic.
