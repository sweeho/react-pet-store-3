  - record_key: SHOPPING_CART_REQ_0005
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL provide the ability to retrieve all items currently in the
      shopping cart, enriched with product details from the catalog including product
      name, category, and unit cost.
    confidence: high
    confidence_basis: >
      The getItems method is clearly defined in the interface and implemented in the
      EJB. The implementation uses CatalogHelper to fetch product details and converts
      them to CartItem objects. Both the interface and implementation show this pattern.
    risk_class: operational
    basis: >
      ShoppingCartLocal interface defines getItems; ShoppingCartLocalEJB implements it
      by using CatalogHelper to fetch Item objects from the catalog and converting them
      to CartItems with full product information. This is displayed in cart.jsp.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 65
        line_end: 65
        excerpt: |
          public Collection getItems();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
          public Collection getItems() {
            CatalogHelper catalog = new CatalogHelper(false);
            HashMap map = getDetails();
            ArrayList items = new ArrayList();
            Iterator it = map.keySet().iterator();
            while (it.hasNext()) {
              String key = (String)it.next();
              Integer value = (Integer)map.get(key);
              Item item = null;
              try {
                item = catalog.getItem(key, locale);
                CartItem ci = new CartItem(item.getItemId(),
                  item.getProductId(),
                  item.getCategory(),
                  item.getProductName(),
                  item.getAttribute(),
                  value.intValue(),
                  item.getListCost());
                items.add(ci);
              } catch (CatalogException cce) {
                System.out.println("ShoppingCartEJB caught: " + cce);
              }
            }
            return items;
          }
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Required

  - record_key: SHOPPING_CART_REQ_0006
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate and provide the subtotal of all items in the
      shopping cart as the sum of (unit cost × quantity) for each item.
    confidence: high
    confidence_basis: >
      The getSubTotal method is defined in the interface and clearly implemented
      in the EJB. The implementation iterates through cart items and sums the product
      of unit cost and quantity. This is also used in the cart.jsp display.
    risk_class: financial
    basis: >
      ShoppingCartLocal interface defines getSubTotal; ShoppingCartLocalEJB implements
      it by iterating through getItems() and summing (unitCost * quantity) for each
      CartItem. The cart.jsp displays this value as currency.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocal.java
        line_start: 71
        line_end: 71
        excerpt: |
          public Double getSubTotal();
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
            Collection items = getItems();
            if (items == null) return null;
            double ret = 0.0d;
            for (Iterator it =items.iterator(); it.hasNext(); ) {
              CartItem i = (CartItem) it.next();
              ret += (i.getUnitCost() * i.getQuantity()) ;
            }
            return new Double(ret);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
        line_start: 96
        line_end: 98
        excerpt: |
          <td bgcolor="#CCCCFF" class="petstore_listing" align="right">
            <fmt:formatNumber value="${cart.subTotal}" type="currency" />
          </td>
    stack_metadata:
      ejb.bean: ShoppingCartLocalEJB
      ejb.transaction: Required

