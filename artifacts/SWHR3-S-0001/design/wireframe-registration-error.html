<!doctype html>
<html>
<head><meta charset="utf-8"><title>Registration error</title>
<style>
body{margin:0;background:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3f3f46}
.page{width:720px;margin:0 auto}
.chrome{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e4e4e7;padding:10px 16px;background:#fafafa}
.logo{width:96px;height:20px;background:#d4d4d8;border-radius:4px;flex:none}
.navbars{display:flex;gap:10px;flex:1}
.navbar{width:52px;height:8px;background:#e4e4e7;border-radius:4px}
.search{width:150px;height:26px;border:1px solid #d4d4d8;border-radius:6px;background:#fff;display:flex;align-items:center;padding:0 8px;font-size:10px;color:#a1a1aa;flex:none}
.body{padding:40px 16px}
.wrap{max-width:460px;margin:0 auto}
.h1{font-size:19px;font-weight:700;color:#27272a;margin:0 0 16px;text-align:center}
.card{border:1px solid #e4e4e7;border-radius:10px;background:#fff;padding:22px;text-align:center}
.mark{width:34px;height:34px;border-radius:50%;border:1px solid #a1a1aa;background:#fafafa;margin:0 auto 14px}
.msg{font-size:12px;line-height:1.6;color:#3f3f46;margin:0 0 6px;font-weight:600}
.detail{font-size:11px;line-height:1.6;color:#71717a;margin:0 0 18px}
.actions{display:flex;gap:10px;justify-content:center}
.btn{height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;padding:0 18px}
.btn-primary{background:#3f3f46;color:#fff}
.btn-outline{border:1px solid #d4d4d8;background:#fff;color:#3f3f46}
</style></head>
<body>
<div class="page">
  <div class="chrome">
    <div class="logo"></div>
    <div class="navbars"><div class="navbar"></div><div class="navbar"></div><div class="navbar"></div><div class="navbar"></div><div class="navbar"></div></div>
    <div class="search">Search</div>
  </div>

  <div class="body">
    <div class="wrap">
      <div class="h1">Account Not Created</div>
      <div class="card">
        <div class="mark"></div>
        <div class="msg">We could not create your account.</div>
        <div class="detail">That user name is already taken. Choose a different user name and try again.</div>
        <div class="actions">
          <div class="btn btn-primary">Back to Registration</div>
          <div class="btn btn-outline">Sign In</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
