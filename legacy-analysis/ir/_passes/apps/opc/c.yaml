  - record_key: SUPPLIER-INTEG-0002
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL receive invoice messages from suppliers containing order ID and line item shipment information.
      For each invoice, the system SHALL determine whether the order is fully shipped (all line items received)
      or partially shipped (some items remain).
    confidence: high
    confidence_basis: >
      InvoiceMDB explicitly processes invoice XML and uses PurchaseOrderHelper to determine shipment completeness.
      The logic distinguishes between COMPLETED (all shipped) and SHIPPED_PART (partial) states. The invoice
      processing is the authoritative source of shipment status.
    risk_class: operational
    basis: >
      InvoiceMDB receives invoice XML via JMS topic subscription. It extracts the order ID and line item IDs,
      then calls PurchaseOrderHelper.processInvoice() which returns a boolean indicating if all items have shipped.
      Based on this result, the status is updated to COMPLETED or SHIPPED_PART.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 172
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 201
        line_end: 212
        excerpt: |
          <!-- Process recieving an INVOICE from the Suppler Start-->
          <message-driven>
            <description>opc node to process Invoice from the Supplier</description>
            <display-name>InvoiceMDB</display-name>
            <ejb-name>InvoiceMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.opc.ejb.InvoiceMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
