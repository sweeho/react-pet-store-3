      an explicit catch for NumberFormatException. If a non-numeric quantity is submitted,
      a NumberFormatException will be thrown and propagate. The outer catch block only
      catches FinderException, so invalid quantity inputs may cause an unhandled exception.
      It is unclear if this is intentional error handling or a gap in the implementation.

