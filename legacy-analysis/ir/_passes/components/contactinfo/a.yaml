  - record_key: CONTACTINFO-ENTITY-0001
    kind: entity
    capability_key: order-checkout
    requirement: >
      The system SHALL maintain a ContactInfo entity with contact information fields.
      Each ContactInfo SHALL have a givenName, familyName, telephone, email, and an
      associated Address.
    confidence: high
    confidence_basis: >
      ContactInfo is declared as a CMP 2.x entity bean with Container-managed persistence
      in ejb-jar.xml. All required fields are defined as CMP fields with corresponding
      accessor methods in ContactInfoEJB. The DTD and ContactInfo.java POJO both declare
      these fields as required elements.
    risk_class: operational
    basis: >
      ContactInfoEJB is declared as a CMP 2.x entity bean with abstract methods for
      each field (givenName, familyName, telephone, email). The DTD defines ContactInfo
      element with FamilyName, GivenName, Email, Phone as PCDATA elements with no
      OPTIONAL marker. The ContactInfoLocalHome provides create methods that accept
      these parameters. The relationship to Address is enforced through ejb-local-ref
      and CMR fields.
