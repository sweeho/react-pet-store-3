    requirement: >
      The system SHALL maintain a Supplier Order entity with the following required fields:
      Purchase Order ID (primary key), Purchase Order Date, and Purchase Order Status.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml configuration (lines 48-104) explicitly declares SupplierOrderEJB as
      a Container-Managed Persistence entity bean with CMP fields poId, poDate, and poStatus.
      The SupplierOrderEJB.java abstract accessor methods (lines 81-113) confirm these as
      persistent fields. The CMP fields are consistently defined across both declarative and
      programmatic sources.
    risk_class: operational
    basis: >
      ejb-jar.xml declares SupplierOrderEJB entity bean (lines 48-104) with CMP fields poId
      (line 61), poDate (line 64), poStatus (line 67), and primkey-field poId (line 69).
      SupplierOrderEJB.java defines abstract methods getPoId (line 81), getPoDate (line 93),
      setPoDate (line 100), getPoStatus (line 106), and setPoStatus (line 113). The persistence
      type is Container (line 55) with CMP version 2.x (line 58).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 48
        line_end: 69
        excerpt: |
          <entity>
            <description>SupplierOrder CMP EJB</description>
            <display-name>SupplierOrderEB</display-name>
            <ejb-name>SupplierOrderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderLocalHome</local-home>
