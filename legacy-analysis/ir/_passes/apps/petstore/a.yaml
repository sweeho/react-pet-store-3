  - record_key: shopping-cart-req-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support updating the quantity of items in the shopping cart
      in a single batch operation with multiple itemId-to-quantity mappings.
    confidence: high
    confidence_basis: >
      CartEvent UPDATE_ITEMS action type is defined. CartEJBAction iterates over
      items HashMap and calls updateItemQuantity for each. CartHTMLAction parses
      multiple itemQuantity_* parameters in a single request and builds quantities map.
    risk_class: operational
    basis: >
      CartEvent.UPDATE_ITEMS (value 3) accepts HashMap of items. CartEJBAction
      iterates over items map and calls cart.updateItemQuantity(itemId, quantity).
      CartHTMLAction collects all parameters prefixed with "itemQuantity_" when
      actionType="update".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 78
        line_end: 88
        excerpt: |
          case  CartEvent.UPDATE_ITEMS : {
              Map items = ce.getItems();
              Iterator it = null;
              if (items != null) it = items.keySet().iterator();
              while ((it != null) && it.hasNext()) {
                  String itemId = (String)it.next();
                  int quantity = ((Integer)items.get(itemId)).intValue();
                  cart.updateItemQuantity(itemId, quantity);
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 99
        line_end: 121
        excerpt: |
          else if (actionType.equals("update")) {
              Map quantities = new HashMap();
              Map parameters = request.getParameterMap();
              for (Iterator it = parameters.keySet().iterator();
                   it.hasNext(); ) {
                  String name = (String) it.next();
                  String value = ((String[]) parameters.get(name))[0];
                  final String ITEM_QTY = "itemQuantity_";
                  if (name.startsWith(ITEM_QTY)) {
                      String itemID = name.substring(ITEM_QTY.length());
                      Integer quantity = null;
                      try {
                          quantity = new Integer(value);
                      }
                      catch (NumberFormatException nfe) {
                          quantity = new Integer(0);
                      }
                      quantities.put(itemID, quantity);
                  }
              }
              event = CartEvent.createUpdateItemEvent(quantities);

  - record_key: shopping-cart-req-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL track cart sessions per authenticated user and provide
      access to cart contents across multiple web requests.
    confidence: high
    confidence_basis: >
      Session management configured in web.xml with 15-minute timeout. EJB tier
      maintains ShoppingClientFacadeLocal which holds ShoppingCartLocal reference.
      ShoppingControllerEJB stores facade in StateMachine for request-to-request
      access.
    risk_class: operational
    basis: >
      Web.xml declares session-timeout of 15 minutes. ShoppingControllerEJB creates
      ShoppingClientFacade in ejbCreate() and stores it in StateMachine attributes,
      making cart accessible across requests. Session is available from HttpSession
      in web tier and from EJB tier through controlled facade.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 161
        line_end: 163
        excerpt: |
