  - record_key: UIDGEN-REQ-0002
    kind: requirement
    capability_key: order-workflow
    requirement: >
      Counter values SHALL be persisted to durable storage such that increment operations
      are atomic and survive application restarts.
    confidence: high
    confidence_basis: >
      The Counter entity bean is implemented via CMP 2.x (Container-Managed Persistence),
      which delegates all persistence responsibility to the container. Both CMP field
      definitions and deployment configuration confirm this. No alternative persistence
      mechanism is visible in the code.
    risk_class: operational
    basis: >
      CounterEJB is an abstract entity bean (javax.ejb.EntityBean) with CMP version 2.x
      declared in ejb-jar.xml. Two CMP fields (counter and name) are declared via
      abstract accessors. The container automatically maps these to database storage.
