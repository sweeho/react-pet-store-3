  - record_key: SUPP-REQ-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL validate that sufficient inventory quantity is available before
      deducting from stock. If inventory quantity is less than the requested line item
      quantity, no inventory deduction SHALL occur.
    confidence: high
    confidence_basis: >
      checkInventory method (OrderFulfillmentFacadeEJB lines 126-139) performs explicit
      comparison: if(inv.getQuantity() < item.getQuantity()) returns false immediately,
      bypassing reduceQuantity call. Method is called from processAnOrder for every
      unshipped line item. Logic is clear and deterministic.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.checkInventory (lines 126-139) retrieves InventoryLocal
      by itemId, compares current quantity against line item quantity. Only if
      inv.getQuantity() >= item.getQuantity() does it proceed to call
      inv.reduceQuantity(). If FinderException occurs (item not found), method returns
      false without calling reduceQuantity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required
      db.object: InventoryEJB

