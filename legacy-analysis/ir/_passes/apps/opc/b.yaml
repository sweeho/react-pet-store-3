  - record_key: admin-dashboard-0001
    kind: requirement
    capability_key: admin-dashboard
    requirement: >
      The system SHALL provide analytics that aggregate order and revenue
      data by date range and category. For REVENUE request type, the system
      SHALL sum (quantity × unit price) for line items. For ORDERS request
      type, the system SHALL sum quantities. Results SHALL be aggregated by
      category when category filter is null, or by item when category filter
      is specified.
    confidence: medium
    confidence_basis: >
      Logic is embedded in OPCAdminFacadeEJB.getChartInfo() with conditional
      aggregation. Implementation is clear but complex; ordering and rounding
      assumptions are implicit in code. Method is called by remote interface
      but no external documentation found. Single source.
    risk_class: presentational
    basis: >
      OPCAdminFacadeEJB.getChartInfo() retrieves purchase orders between start
      and end dates, iterates line items, and accumulates revenue or order
      quantity into HashMap keyed by category or item ID. Calculation is
      (quantity × unit price) for revenue, quantity only for orders. Results
      returned as Map to client.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 169
        line_end: 256
        excerpt: |
          public Map getChartInfo(String request,
                                  Date start,
                                  Date end,
                                  String categ)
              throws OPCAdminFacadeException {
              String id;
              Float tmpValue;
              Integer tmpQty;
              PurchaseOrderLocal po;

              Map chartDetails = new HashMap();

              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection poColl =
                      pohome.findPOBetweenDates(start.getTime(), end.getTime());

                  Iterator it = poColl.iterator();
                  while((it!= null) && (it.hasNext())) {
                      po = (PurchaseOrderLocal) it.next();
                      Collection liColl = po.getAllItems();
                      Iterator lit = liColl.iterator();
                      while((lit!=null) && (lit.hasNext())) {
                          LineItem loc = (LineItem) lit.next();
                          if(request.equals("REVENUE")) {
                              if(categ == null) {
                                  id = loc.getCategoryId();
                                  if(chartDetails.containsKey(id)) {
                                      tmpValue = (Float) chartDetails.get(id);
                                      chartDetails.put(id,
                                           new Float(tmpValue.floatValue() +
                                           (loc.getQuantity()*loc.getUnitPrice())));

