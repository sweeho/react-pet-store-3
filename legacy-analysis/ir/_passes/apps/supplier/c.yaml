  - record_key: SUPP-REQ-0008
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      When new inventory arrives at the supplier, the system SHALL automatically
      reprocess all orders with PENDING status to attempt fulfillment of remaining
      items. Multiple invoices MAY be generated for newly fulfillable items.
    confidence: high
    confidence_basis: >
      processPendingPO method (lines 247-269) explicitly finds all orders with status
      PENDING via supplierOrderLocalHome.findOrdersByStatus(PENDING) (line 251). It
      iterates through them and calls processAnOrder for each (line 258), collecting
      generated invoices in an ArrayList (lines 248, 264). This method is called from
      RcvrRequestProcessor.doPost (line 186) when inventory is updated.
    risk_class: operational
    basis: >
      processPendingPO finds orders with PENDING status (line 251), iterates through
      collection (lines 253-266), calls processAnOrder for each order (line 258),
      and collects invoices in ArrayList. The method is called from RcvrRequestProcessor
      after updateInventory is completed (line 186). Comment at lines 240-241 says
      "Called by the web tier when new inventory arrives".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 247
        line_end: 269
        excerpt: |
          public Collection processPendingPO() throws FinderException {
            ArrayList invoices = new ArrayList();
            Collection coll =
              supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING);
            if(coll != null) {
              Iterator it = coll.iterator();
              while((it!=null) && (it.hasNext())) {
                SupplierOrderLocal order = (SupplierOrderLocal) it.next();
                String newInvoice = null;
                try {
                  newInvoice = processAnOrder(order);
                } catch (XMLDocumentException xe) {
                  System.out.println("OrderFulfillmentFacade:" + xe);
                }
                if(newInvoice != null) {
                  invoices.add(newInvoice);
                }
              }
            }
            return invoices;
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

