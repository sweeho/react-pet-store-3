      excluded from the approve panel.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
    description: >
      The AdminRequestBD class is instantiated fresh on every request
      (line 168 in ApplRequestProcessor.getOrders(), line 227 in updateOrders(),
