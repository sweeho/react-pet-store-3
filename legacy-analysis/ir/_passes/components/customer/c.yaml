  - record_key: CUSTOMER-ENTITY-0010
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL enforce transactional consistency on all entity operations using
      the Required transaction attribute. All create, remove, and accessor methods SHALL
      participate in a container-managed transaction.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml assembly descriptor explicitly lists transaction attributes for
      all entity operations. Every method listed includes a trans-attribute of Required
      (lines 675-1490). This ensures that even if multiple entities are accessed in a
      single operation, all changes are atomic. The transactional consistency is enforced
      at the EJB container level, not application level.
    risk_class: operational
    basis: >
      For all six entities (CustomerEJB, AccountEJB, ProfileEJB, ContactInfoEJB,
      CreditCardEJB, AddressEJB), container-transaction elements in ejb-jar.xml
      specify trans-attribute=Required for all methods. This includes lifecycle methods
      (create, remove) and accessor methods (getters/setters). The Required attribute
      means the method SHALL run in a transaction context, and if no transaction exists,
      the container creates one.
    traces:
