  - record_key: order-workflow-creation-0001
    kind: requirement
    capability_key: order-checkout
    requirement: >
      A Purchase Order SHALL be created from a populated PurchaseOrder value object
      containing all required order data: user ID, email, order date, total price,
      shipping info, billing info, credit card, and line items.
      WHEN the EJB create() method is called, the ejbPostCreate() method SHALL automatically
      create and associate the related Contact Info, Credit Card, and Line Item entities.
    confidence: high
    confidence_basis: >
      PurchaseOrderEJB.java ejbCreate() (lines 197-205) populates the CMP fields from
      the PurchaseOrder value object. ejbPostCreate() (lines 211-238) is explicitly called
      to set up relationships with ContactInfo, CreditCard, and LineItems using ServiceLocator.
      The pattern is standard EJB 2.x entity bean lifecycle.
    risk_class: operational
    basis: >
      PurchaseOrderEJB.ejbCreate() (lines 197-205) receives a PurchaseOrder value object
      and extracts orderDate, userId, emailId, date, locale, and totalPrice into CMP fields.
      ejbPostCreate() (lines 211-238) uses ServiceLocator to look up and create ContactInfo,
      CreditCard, and LineItem entities, then associates them via CMR fields (setContactInfo,
      setCreditCard, addLineItem).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 197
        line_end: 238
        excerpt: |
          public String ejbCreate(PurchaseOrder purchaseOrder) throws CreateException {
                  setPoId(purchaseOrder.getOrderId());
                  setPoUserId(purchaseOrder.getUserId());
                  setPoEmailId(purchaseOrder.getEmailId());
                  setPoDate(purchaseOrder.getOrderDate().getTime());
                  setPoLocale(purchaseOrder.getLocale().toString());
                  setPoValue(purchaseOrder.getTotalPrice());
                  return null;
          }

          public void ejbPostCreate(PurchaseOrder purchaseOrder)
                                                   throws CreateException {
              try {
                  ServiceLocator serviceLocator = new ServiceLocator();
                  ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
                  ContactInfoLocal cinfoloc = (ContactInfoLocal)
                      cinforef.create(purchaseOrder.getShippingInfo());
                  setContactInfo(cinfoloc);
                  CreditCardLocalHome cardref = (CreditCardLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CARD_EJB);
                  CreditCardLocal cardloc = (CreditCardLocal)
                      cardref.create(purchaseOrder.getCreditCard());
                  setCreditCard(cardloc);
                  LineItemLocalHome lineItemref = (LineItemLocalHome)
                      serviceLocator.getLocalHome(JNDINames.LI_EJB);
                  Collection litems = purchaseOrder.getLineItems();
                  Iterator it = litems.iterator();
                  while((it != null) && (it.hasNext())) {
                      LineItem li = (LineItem) it.next();
                      LineItemLocal lineItemloc = (LineItemLocal)
                          lineItemref.create(li, 0);
                      addLineItem(lineItemloc);
                  }
              } catch(ServiceLocatorException ne) {
                  throw new CreateException("ServiceLocator Ex while persisting PO CMR :" + ne.getMessage());
              }
          }
    stack_metadata:
      ejb.lifecycle: ejbCreate, ejbPostCreate

