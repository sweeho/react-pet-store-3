  - record_key: CAT-RULE-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      Search queries SHALL be tokenized on whitespace, with each token treated as
      a separate keyword. An empty token set returns an empty page.
    confidence: medium
    confidence_basis: >
      Implementation in GenericCatalogDAO.searchItems is clear. No configuration
      or declarative specification of this behavior was found, but both DAO
      implementations would implement the same parsing.
    risk_class: operational
    basis: >
      GenericCatalogDAO.searchItems uses StringTokenizer to split on whitespace.
      If keywordSet.isEmpty(), it returns Page.EMPTY_PAGE.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 352
        excerpt: |
          public Page searchItems(String searchQuery, int start, int count, Locale locale)
              throws CatalogDAOSysException {
              Collection keywordSet = new HashSet();
              StringTokenizer tokenizer = new StringTokenizer(searchQuery);
              while (tokenizer.hasMoreTokens()) {
                keywordSet.add(tokenizer.nextToken());
              }
              if (keywordSet.isEmpty()) {
                return Page.EMPTY_PAGE;
              }

