  - record_key: SERVICELOCATOR-BR-0004
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      The system SHALL support JNDI lookup of remote EJB Homes by JNDI name with
      PortableRemoteObject narrowing to convert the remote reference to the target class,
      with all NamingException and Exception caught and wrapped as ServiceLocatorException.
    confidence: high
    confidence_basis: >
      Explicit method getRemoteHome() appears in both implementations with identical logic
      including PortableRemoteObject.narrow() call. The pattern is consistent and enforced.
    risk_class: operational
    basis: >
      getRemoteHome(String jndiHomeName, Class className) method requires both JNDI name
      and target class for narrowing. PortableRemoteObject is used for type conversion.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 101
        line_end: 113
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
              Object objref = ic.lookup(jndiHomeName);
              Object obj = PortableRemoteObject.narrow(objref, className);
              home = (EJBHome)obj;
            } catch (NamingException ne) {
              throw new ServiceLocatorException(ne);
            } catch (Exception e) {
              throw new ServiceLocatorException(e);
            }
            return home;
          }
    stack_metadata:
      framework: j2ee
      ejb.bean: true

