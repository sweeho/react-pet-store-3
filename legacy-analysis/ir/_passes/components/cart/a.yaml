  - record_key: SC-REQUIREMENT-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow users to update item quantities in the shopping cart.
      When quantity is set to zero or less, the item SHALL be removed from the cart.
    confidence: high
    confidence_basis: >
      The implementation explicitly handles the zero-and-below case with a conditional
      check. CartHTMLAction parses quantity parameters and routes them to updateItemQuantity.
      The logic is stated in code, not inferred.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB.updateItemQuantity() first removes the item, then conditionally
      puts it back only if newQty > 0. CartHTMLAction extracts all parameters matching
      the pattern "itemQuantity_" and passes them to updateItemQuantity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 99
        line_end: 121
        excerpt: |
          else if (actionType.equals("update")) {
              Map quantities = new HashMap();
              Map parameters = request.getParameterMap();
              for (Iterator it = parameters.keySet().iterator();
                   it.hasNext(); ) {
                  String name = (String) it.next();
                  String value = ((String[]) parameters.get(name))[0];
                  final String ITEM_QTY = "itemQuantity_";
                  if (name.startsWith(ITEM_QTY)) {
                      String itemID = name.substring(ITEM_QTY.length());
                      Integer quantity = null;
                      try {
                          quantity = new Integer(value);
                      }
                      catch (NumberFormatException nfe) {
                          quantity = new Integer(0);
                      }
                      quantities.put(itemID, quantity);
                  }
              }
              event = CartEvent.createUpdateItemEvent(quantities);

  - record_key: SC-REQUIREMENT-0005
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate the cart subtotal as the sum of (unit price × quantity)
      for all items currently in the cart.
    confidence: high
    confidence_basis: >
      The calculation logic is explicitly coded in getSubTotal() with no ambiguity.
      The algorithm is straightforward arithmetic applied to CartItem data retrieved
      from the catalog service. This is enforced at the EJB tier, not the presentation tier.
    risk_class: financial
    basis: >
      ShoppingCartLocalEJB.getSubTotal() iterates through all cart items (fetched from catalog),
      multiplies each item's unit cost by its quantity, and returns the sum as a Double.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              double ret = 0.0d;
              // total up the quantities
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);

