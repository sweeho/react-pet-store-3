  - record_key: SC-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      When a user updates an item quantity to zero or any negative value, that item
      SHALL be automatically removed from the cart rather than stored with a zero or
      negative quantity.
    confidence: high
    confidence_basis: >
      The updateItemQuantity() method implements this with an explicit conditional:
      "if (newQty > 0) cart.put(...)". This is enforced in code, not a side effect.
      The comment in the code also confirms intent.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB.updateItemQuantity removes the item first, then only re-adds
      it if newQty > 0. The comment "remove item if it is less than or equal to 0" confirms
      the intent.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
