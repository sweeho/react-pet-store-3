  - record_key: ADDR-REQ-0011
    kind: requirement
    capability_key: order-checkout
    requirement: >
      The system SHALL support marshalling an Address entity to XML format conforming
      to the Address DTD. The XML representation SHALL include streetName1, optional
      streetName2, city, state, zipCode, and optional country elements.
    confidence: high
    confidence_basis: >
      Address.java implements toDOM() method that transforms the entity to XML.
      The method includes logic for conditional elements (streetName2 and country).
      The DTD defines the exact structure expected.
    risk_class: operational
    basis: >
      Address.java toDOM method (lines 144-155) builds XML with all six fields.
      Conditional logic: streetName2 only if non-empty, country unconditionally.
      Address.dtd (line 38) defines the expected element structure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);

