  # ========== ORDER WORKFLOW ==========
  - record_key: order-workflow-req-0001
    kind: workflow
    capability_key: order-workflow
    requirement: >
      The system SHALL create a new purchase order when an OrderEvent is processed.
      The order SHALL contain: unique order ID, user ID, email, order date,
      shipping info, billing info, credit card, line items, and total price.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() creates a new PurchaseOrder object and populates
      all required fields (lines 92-146). Order ID is generated via UniqueIdGenerator
      EJB with prefix "1001". Order date is set to current date (line 118).
      All components (shipping, billing, card, items) are populated before
      submission.
    risk_class: operational
    basis: >
      OrderEJBAction lines 92-146 show complete order creation flow.
      UniqueIdGeneratorLocal is used to generate orderIdString (line 110).
      All fields of PurchaseOrder are populated: setOrderId, setUserId,
      setEmailId, setOrderDate, setShippingInfo, setBillingInfo, setCreditCard,
      locale, and line items. Line items are extracted from cart with category,
      productId, itemId, quantity, and unitCost.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 88
        line_end: 146
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
            OrderEvent oe = (OrderEvent)e;
            PurchaseOrder purchaseOrder = new PurchaseOrder();
            ContactInfo billTo = oe.getBillTo();
            ContactInfo shipTo = oe.getShipTo();
            CreditCard creditCard = oe.getCreditCard();
            String orderIdString = null;
            // get the UniqueIdGenerator EJB
            UniqueIdGeneratorLocal uidgen = null;
            try {
              ServiceLocator sl = new ServiceLocator();
              UniqueIdGeneratorLocalHome home =
                (UniqueIdGeneratorLocalHome)sl.getLocalHome(JNDINames.UIDG_EJBHOME);
              uidgen = home.create();
            } catch (javax.ejb.CreateException cx) {
              cx.printStackTrace();
            } catch (ServiceLocatorException slx) {
              slx.printStackTrace();
            }
            orderIdString = uidgen.getUniqueId("1001");
            // get ther userId
            ShoppingClientFacadeLocal scf = null;
            scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
            String userId = scf.getUserId();
            purchaseOrder.setOrderId(orderIdString);
            purchaseOrder.setUserId(userId);
            purchaseOrder.setEmailId(billTo.getEmail());
            purchaseOrder.setOrderDate(new Date());
            purchaseOrder.setShippingInfo(shipTo);
            purchaseOrder.setBillingInfo(billTo);
            purchaseOrder.setCreditCard(creditCard);
            int lineItemCount = 0;
            float totalCost = 0;
            // Add the items from the shopping cart
            ShoppingCartLocal cart = scf.getShoppingCart();
            Locale locale = (Locale)machine.getAttribute(PetstoreKeys.LOCALE);
            purchaseOrder.setLocale(locale);
            Collection items = cart.getItems();
            // if the cart is empty throw an exception saying so
            if (items.size() == 0) {
              throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
            }
            Iterator it = items.iterator();
            while (it.hasNext()) {
              CartItem item = (CartItem)it.next();
              float cost = new Float(item.getUnitCost()).floatValue();
              totalCost += (cost*item.getQuantity());
              purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                     item.getProductId(),
                                                     item.getItemId(),
                                                     (lineItemCount++) + "",
                                                     item.getQuantity(),
                                                     cost));
            }
            purchaseOrder.setTotalPrice(totalCost);

