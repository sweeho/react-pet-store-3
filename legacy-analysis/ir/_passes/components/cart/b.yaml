  - record_key: SHOPPING_CART_ENTITY_0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      A CartItem entity SHALL contain itemId, productId, category, name, attribute,
      quantity, and unitCost. Quantity and unitCost are numeric; all others are strings.
      The entity SHALL calculate totalCost as quantity × unitCost.
    confidence: high
    confidence_basis: >
      CartItem is a concrete, serializable value object with all fields defined in
      the constructor and getter methods. The totalCost calculation is explicitly
      implemented.
    risk_class: operational
    basis: >
      CartItem class defines all fields and methods in the constructor, getters,
      and the getTotalCost method.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 46
        line_end: 98
        excerpt: |
          public class CartItem implements Serializable {
            private String itemId;
            private String productId;
            private String category;
            private String name;
            private String attribute;
            private int quantity;
            private double unitCost;

            public CartItem(String itemId, String productId, String category,
              String name, String attribute, int quantity, double unitCost) {
              this.category = category;
              this.itemId = itemId;
              this.productId = productId;
              this.name = name;
              this.attribute = attribute;
              this.quantity = quantity;
              this.unitCost = unitCost;
            }

            public double getTotalCost() {
              return quantity * unitCost;
            }
          }
    stack_metadata: {}

