  - record_key: ORDER_WORKFLOW-REQUIREMENT-0001
    kind: requirement
    capability_key: order-workflow
    requirement: >
      OrderApproval documents SHALL be validated against a DTD before parsing.
      Validation mode SHALL be controlled via a VALIDATING constant (true for strict).
      fromXML() methods SHALL throw XMLDocumentException if document type does not
      match expected DTD_PUBLIC_ID.
    confidence: high
    confidence_basis: >
      Validation is performed in OrderApproval.fromXML() which calls XMLDocumentUtils.fromXML()
      with VALIDATING flag. The DTD_PUBLIC_ID constant is defined and used.
    risk_class: operational
    basis: >
      OrderApproval class defines DTD_PUBLIC_ID constant and VALIDATING = true constant.
      fromXML(String) and fromXML(Source, URL, boolean) methods use XMLDocumentUtils.fromXML()
      with these parameters.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 66
