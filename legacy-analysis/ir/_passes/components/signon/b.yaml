  - record_key: customer-management-session-0001
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL maintain a session attribute indicating whether a user is
      currently signed on, using the key j_signon.
    confidence: high
    confidence_basis: >
      The session attribute is consistently used throughout SignOnFilter for tracking
      authentication state. Both the check and set operations are present in the code
      with explicit attribute management.
    risk_class: operational
    basis: >
      SignOnFilter maintains a boolean session attribute SIGNED_ON_USER (j_signon).
      On successful authentication, it sets this to true. On initial access, it
      initializes it to false.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 135
        excerpt: |
          boolean signedOn = false;
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
              signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
          } else {
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
          }
          // jump to the resource if signed on
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 191
        line_end: 201
        excerpt: |
          hreq.getSession().setAttribute(USER_NAME, userName);
          // remove the sign on user key before putting it back in
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
              hreq.getSession().removeAttribute(SIGNED_ON_USER);
          }
          hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
    stack_metadata:
      framework: Servlet
      session.scope: HttpSession

  - record_key: customer-management-protected-0001
    kind: workflow
    capability_key: customer-management
    requirement: >
      GIVEN a user is not authenticated, WHEN they attempt to access a protected
      resource, THEN the filter SHALL forward the request to the sign-on page and
      store the original URL in the session.
    confidence: high
    confidence_basis: >
      The workflow is clearly implemented in SignOnFilter.doFilter() method with
      explicit URL pattern matching and request forwarding logic.
    risk_class: operational
    basis: >
      SignOnFilter.doFilter() checks if signedOn is false, then searches the
      protectedResources map for URL pattern matching. When found, it stores the
      original URL and forwards to the signon page.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 136
        line_end: 155
        excerpt: |
          Iterator it = null;
          if (protectedResources != null) it = protectedResources.keySet().iterator();
          while ((it != null) && it.hasNext()) {
              String protectedName = (String)it.next();
              ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);
              String urlPattern = resource.getURLPattern();
              // now check agains the targetURL
              if (urlPattern.equals(targetURL)) {
                  // put the orginal url in the session so others can access
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                  // Jump out of the filter and go to the next page
                  return;
              }
          }
    stack_metadata:
      framework: Servlet Filter
      session.scope: HttpSession

  - record_key: customer-management-redirect-auth-0001
    kind: workflow
    capability_key: customer-management
    requirement: >
      GIVEN a user submits valid credentials, WHEN authentication succeeds, THEN
      the system SHALL redirect to the originally requested URL.
    confidence: high
    confidence_basis: >
      The redirect is explicitly implemented in SignOnFilter.validateSignOn() after
      successful authentication with the original URL retrieved from session.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() calls authenticate(), and on success, retrieves
      the ORIGINAL_URL from session and calls hres.sendRedirect().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 188
        line_end: 209
        excerpt: |
          SignOnLocal signOn = getSignOnEjb();
          boolean authenticated = signOn.authenticate(userName, password);
          if (authenticated) {
              hreq.getSession().setAttribute(USER_NAME, userName);
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
              // redirect to the original destination
              String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
              hres.sendRedirect(targetURL);
              return;
          }
    stack_metadata:
      framework: Servlet Filter
      session.scope: HttpSession

