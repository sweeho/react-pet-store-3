  - record_key: CUST-SESS-0001
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL maintain a session attribute indicating whether a user is
      currently signed on.
    confidence: high
    confidence_basis: >
      The session attribute is referenced consistently across SignOnFilter and
      signon.jsp, with both setting and checking the SIGNED_ON_USER attribute.
    risk_class: operational
    basis: >
      SignOnFilter sets session attribute SIGNED_ON_USER to Boolean(true) upon
      successful authentication (line 201). On each request, the filter checks
      this attribute to determine if user is signed on (lines 126-130).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 135
        excerpt: |
          // check if the user is signed on
          boolean signedOn = false;
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
              signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
          } else {
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
          }
          // jump to the resource if signed on
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }

  - record_key: CUST-SESS-0002
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL store the authenticated username in the session for later
      retrieval.
    confidence: high
    confidence_basis: >
      The session attribute USER_NAME (j_signon_username) is set immediately after
      authentication succeeds and is used to identify the current user context.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() sets session attribute USER_NAME to the
      authenticated username upon successful authentication (line 196). The
      attribute name is defined as public constant.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 191
        line_end: 201
        excerpt: |
          if (authenticated) {
              // place a true boolean in the session
              if (hreq.getSession().getAttribute(USER_NAME) != null) {
                  hreq.getSession().removeAttribute(USER_NAME);
              }
              hreq.getSession().setAttribute(USER_NAME, userName);
              // remove the sign on user key before putting it back in
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));

  - record_key: CUST-COOKIE-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      GIVEN a user has checked the "Remember My User Name" checkbox during sign-on,
      WHEN the sign-on is successful, THEN the system SHALL store the username in
      a cookie with a 30-day expiration.
    confidence: high
    confidence_basis: >
      The cookie creation and expiration is explicitly implemented with a hardcoded
      max age value in SignOnFilter. The JSP provides the UI evidence that this is
      a user-facing feature.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() checks for rememberUserName parameter. When
      present, creates a cookie with name bp_signon and calls setMaxAge(2678400),
      which is 30 days in seconds (30*24*60*60 = 2592000, actual value 2678400).
      JSP signon.jsp line 122 provides the checkbox UI.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 173
        excerpt: |
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);

  - record_key: CUST-COOKIE-0002
    kind: business-rule
    capability_key: customer-management
    requirement: >
      GIVEN a user has NOT checked the "Remember My User Name" checkbox during
      sign-on, WHEN an existing remember-me cookie exists, THEN the system SHALL
      delete the cookie by setting its max age to 0.
    confidence: high
    confidence_basis: >
      The cookie deletion logic is explicitly implemented in SignOnFilter with
      the standard setMaxAge(0) pattern for cookie expiration.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() checks for rememberUserName parameter. When
      parameter is null (not checked), iterates through all cookies to find
      bp_signon cookie and calls setMaxAge(0) to delete it.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 174
        line_end: 186
        excerpt: |
          } else {
              // see if the cookie exists and remove accordingly
              Cookie[] cookies = hreq.getCookies();
              if (cookies != null) {
                  for (int loop=0; loop < cookies.length; loop++) {
                      if (cookies[loop].getName().equals(COOKIE_NAME)) {
                          cookies[loop].setMaxAge(0);
                          hres.addCookie(cookies[loop]);
                      }
                  }
              }
          }

