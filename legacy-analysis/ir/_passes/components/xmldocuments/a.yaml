  - record_key: SUPPLIER_INTEGRATION-REQUIREMENT-0002
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      XML serialization and deserialization SHALL use a custom entity resolver
      to map public entity identifiers to system resource locations. Entity catalog
      SHALL be loaded from a properties file at initialization. Mapping failures
      SHALL throw XMLDocumentException with descriptive message.
    confidence: high
    confidence_basis: >
      CustomEntityResolver implements EntityResolver interface and is used throughout
      XMLDocumentUtils and the TPA document editor classes. The implementation directly
      reflects this requirement.
    risk_class: operational
    basis: >
      CustomEntityResolver loads EntityCatalog.properties and provides mapEntityURI()
      method. Used in XMLDocumentUtils for all parsing operations and in TPA editor
      constructors. All XML operations pass entityCatalogURL parameter.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
        line_start: 47
        line_end: 79
        excerpt: |
          public class CustomEntityResolver implements EntityResolver {
            public static final String ENTITY_CATALOG
              = "/com/sun/j2ee/blueprints/xmldocuments/rsrc/EntityCatalog.properties";
            private Properties entityCatalog = null;

            public CustomEntityResolver(EntityResolver parentResolver) {
              this.parentResolver = parentResolver;
              entityCatalog = new Properties();
              InputStream stream = getClass().getResourceAsStream(ENTITY_CATALOG);
              if (stream != null) {
                try {
                  entityCatalog.load(stream);
                } catch (IOException exception) {
                  System.err.println("Can't load from resource: " + ENTITY_CATALOG + ": " + exception);
                }
              }
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 408
        line_end: 417
        excerpt: |
          public static void toXML(Document document, String dtdPublicId, URL entityCatalogURL, String encoding, Result result)
                throws XMLDocumentException {
              try {
                CustomEntityResolver entityResolver = new CustomEntityResolver(entityCatalogURL);
                String dtdSystemId = entityResolver.mapEntityURI(dtdPublicId);
                toXML(document, dtdPublicId, dtdSystemId, encoding, result);
              } catch (Exception exception) {
                exception.printStackTrace(System.err);
                throw new XMLDocumentException(exception);
              }
          }
    stack_metadata:
