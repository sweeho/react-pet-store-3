    requirement: >
      The system SHALL maintain a one-to-one relationship between ContactInfo and Address.
      When a ContactInfo is deleted, its associated Address SHALL be cascade-deleted.
    confidence: high
    confidence_basis: >
      The relationship is declared in ejb-jar.xml with cascade-delete configured on the
      Address side. CMR field (address) is declared as abstract in ContactInfoEJB. Both
      the declarative configuration and the programmatic relationship management (setAddress
      method) enforce this constraint.
    risk_class: operational
