      billing/shipping address. When a Purchase Order is deleted, its associated Contact
      Information SHALL be automatically deleted (cascade delete).
    confidence: high
    confidence_basis: >
      The ejb-jar.xml relationships section (lines 286-310) explicitly declares a ONE-TO-ONE
      unidirectional relationship with cascade-delete on the ContactInfo side, and the
      PurchaseOrderEJB class has getContactInfo/setContactInfo methods (lines 151-157)
      confirming this relationship is enforced at the entity level.
    risk_class: operational
    basis: >
      ejb-jar.xml defines the PurchaseOrder-ContactInfo relationship (lines 286-310) with
      multiplicity One on PurchaseOrder side, multiplicity One on ContactInfo side, and
      explicit <cascade-delete /> tag (line 301). The CMR field contactInfo is declared
      in PurchaseOrderEJB (lines 151-157) with getter/setter methods.
