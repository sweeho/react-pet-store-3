  - record_key: admin-dashboard-req-0001
    kind: requirement
    capability_key: admin-dashboard
    requirement: >
      The system SHALL provide a method to retrieve all orders matching a given
      status, for administrative dashboard and reporting purposes.
    confidence: high
    confidence_basis: >
      ProcessManagerEJB.getOrdersByStatus(String status) is declared in both
      the ProcessManagerLocal interface and ejb-jar.xml with Required
      transaction attribute. ManagerEJB provides the corresponding finder
      method with an EJB-QL query that selects all Manager entities by status.
    risk_class: operational
    basis: >
      ProcessManagerEJB.getOrdersByStatus is documented as "Business method
      to get all orders of given status for the admin". It calls
      mlh.findOrdersByStatus(status). The ManagerEJB declares the finder with
      EJB-QL: "SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 86
        line_end: 91
        excerpt: |
          /**
           * Business method to get all orders of given status for the admin
           */
          public Collection getOrdersByStatus(String status) throws FinderException {
              return mlh.findOrdersByStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 70
        line_end: 79
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findOrdersByStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </query-method>
            <ejb-ql>SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1</ejb-ql>
          </query>

  - record_key: order-workflow-entity-0001
