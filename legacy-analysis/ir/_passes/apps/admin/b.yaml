  - record_key: order-approval-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL provide administrators with access to retrieve all
      purchase orders matching a given status (PENDING, APPROVED, DENIED,
      SHIPPED_PART, or COMPLETED) through a remote EJB facade service.
    confidence: high
    confidence_basis: >
      OPCAdminFacade EJB is explicitly configured in web.xml with remote
      reference binding. AdminRequestBD and ApplRequestProcessor both invoke
      getOrdersByStatus() method. Code path is straightforward and
      deterministic. Both passes would identify this requirement from
      configuration and code.
    risk_class: operational
    basis: >
      web.xml declares ejb-ref to OPCAdminFacadeRemote. AdminRequestBD creates
      remote home via ServiceLocator and calls opcAdminEJB.getOrdersByStatus(status).
      ApplRequestProcessor receives XML request with Status element, parses it,
      calls AdminRequestBD.getOrdersByStatus(), and returns orders as XML with
      OrderId, UserId, OrderDate, OrderAmount, OrderStatus.
