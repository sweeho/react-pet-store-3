  - record_key: CUSTOMER-WORKFLOW-0001
    kind: workflow
    capability_key: customer-management
    requirement: >
      The system SHALL support a customer creation workflow:
      1. Create a user identity in the SignOn system (CreateUserEJBAction)
      2. Create a new Customer entity with a userId
      3. The Customer creation SHALL automatically create an associated Account entity with status ACTIVE
      4. The Customer creation SHALL automatically create an associated Profile entity with default preferences
      5. Update the customer's Account with contact information, address, and credit card details (CustomerEJBAction)
    confidence: high
    confidence_basis: >
      The workflow is enacted across two action classes (CreateUserEJBAction and CustomerEJBAction)
      and the ejbPostCreate methods of CustomerEJB and AccountEJB. CreateUserEJBAction is called
      first to create the SignOn user, then CustomerEJBAction is called to update the new customer.
      The automatic creation of Account and Profile is declaratively enforced via ejbPostCreate
      and container-managed relationships.
    risk_class: operational
    basis: >
      CreateUserEJBAction.perform() creates a SignOn user and sets the userId in ShoppingClientFacadeLocal.
      CustomerEJBAction.perform() handles CREATE and UPDATE actions. For CREATE, it calls
      scf.createCustomer(userId), then calls updateCustomer(). For UPDATE, it calls updateCustomer().
      CustomerEJB.ejbPostCreate() automatically creates Account and Profile.
      AccountEJB.ejbPostCreate() automatically creates ContactInfo and CreditCard.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 78
        line_end: 103
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              CreateUserEvent cue = (CreateUserEvent)e;
              SignOnLocal signOn = null;
              String userName = cue.getUserName();
              try {
                  ServiceLocator sl = new ServiceLocator();
                  SignOnLocalHome home =(SignOnLocalHome)sl.getLocalHome(JNDINames.SIGN_ON_EJBHOME);
                  signOn = home.create();
              } catch (ServiceLocatorException  slx) {
                  throw new DuplicateAccountException("Failed to Create SignOn EJB: caught " + slx);
              }
              try {
                  signOn.createUser(userName, password);
                  ShoppingClientFacadeLocal scf = null;
                  scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
                  scf.setUserId(userName);
              } catch (CreateException ce) {
                  throw new DuplicateAccountException("Bad UserName or password");
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 80
        line_end: 96
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              CustomerEvent ce = (CustomerEvent)e;
              scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
              switch (ce.getActionType()) {
                  case CustomerEvent.CREATE : {
                    String userId = scf.getUserId();
                    scf.createCustomer(userId);
                    updateCustomer(ce);
                    break;
                  }
                  case CustomerEvent.UPDATE : {
                    updateCustomer(ce);
                    break;
                  }
              }
              return null;
          }
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
