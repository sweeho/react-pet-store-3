records:
  - record_key: SERVICELOCATOR-BR-0001
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      The system SHALL support exception wrapping where a ServiceLocatorException
      can wrap a lower-level exception (NamingException, general Exception) to provide
      a unified exception type for service location failures.
    confidence: high
    confidence_basis: >
      Both passes will identify this from the ServiceLocatorException class constructor
      signatures and the getException()/getRootCause() methods. The pattern is explicit
      and enforced in code.
    risk_class: operational
    basis: >
      ServiceLocatorException class provides multiple constructors allowing creation
      with message only, wrapped exception only, or both. The getRootCause() method
      recursively unwraps nested ServiceLocatorExceptions to find the root cause.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 46
        line_end: 105
        excerpt: |
          public class ServiceLocatorException extends Exception {
            private Exception exception;
            public ServiceLocatorException(String message, Exception exception) {
              super(message);
              this.exception = exception;
            }
            public ServiceLocatorException(String message) {
              this(message, null);
            }
            public ServiceLocatorException(Exception exception) {
              this(null, exception);
            }
            public Exception getException() {
              return exception;
            }
            public Exception getRootCause() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).getRootCause();
              }
              return exception == null ? this : exception;
            }
          }
    stack_metadata:
      framework: j2ee

  - record_key: SERVICELOCATOR-BR-0002
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      The system SHALL provide JNDI InitialContext initialization capability,
      catching and wrapping NamingException and general Exception as ServiceLocatorException.
    confidence: high
    confidence_basis: >
      Both passes will see the explicit try-catch blocks in constructors of both
      ServiceLocator implementations (EJB and Web). The pattern is identical and consistent.
    risk_class: operational
    basis: >
      Both ServiceLocator implementations (ejb and web packages) initialize an
      InitialContext in their constructors with identical exception handling patterns.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 66
        line_end: 74
        excerpt: |
          public ServiceLocator() throws ServiceLocatorException {
            try {
              ic = new InitialContext();
            } catch (NamingException ne) {
              throw new ServiceLocatorException(ne);
            } catch (Exception e) {
              throw new ServiceLocatorException(e);
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 83
        line_end: 92
        excerpt: |
          private ServiceLocator() throws ServiceLocatorException {
            try {
              ic = new InitialContext();
              cache = Collections.synchronizedMap(new HashMap());
            } catch (NamingException ne) {
              throw new ServiceLocatorException(ne);
            } catch (Exception e) {
              throw new ServiceLocatorException(e);
            }
          }
