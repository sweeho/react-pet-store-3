  - record_key: SC-REQUIREMENT-0007
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL retrieve cart item details from the Catalog component,
      mapping each cart entry (itemID, quantity) to full product information
      including product name, category, attribute, and list price.
    confidence: high
    confidence_basis: >
      The getItems() method in ShoppingCartLocalEJB explicitly calls CatalogHelper
      to enrich cart data. The CartItem constructor receives Catalog Item data as
      arguments. This two-tier lookup (cart quantity + catalog details) is enforced
      by the code structure.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB.getItems() constructs a CatalogHelper and loops through
      cart.keySet(), calling catalog.getItem(key, locale) for each itemID.
      It then constructs CartItem objects with data from the catalog response.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
          public Collection getItems() {
              // get a catalog helper using local EJB Access
              CatalogHelper catalog = new CatalogHelper(false);
              HashMap map = getDetails();
              ArrayList items = new ArrayList();
              Iterator it = map.keySet().iterator();
              while (it.hasNext()) {
                  String key = (String)it.next();
                  Integer value = (Integer)map.get(key);
                  Item item = null;
                  try {
                      item = catalog.getItem(key, locale);
                      // convert catalog item to cart item
                      CartItem ci = new CartItem(item.getItemId(),
                                             item.getProductId(),
                                             item.getCategory(),
                                             item.getProductName(),
                                             item.getAttribute(),
                                             value.intValue(),
                                             item.getListCost());
                      items.add(ci);
                  } catch (CatalogException cce) {
                      System.out.println("ShoppingCartEJB caught: " + cce);
                  }
              }
              return items;

