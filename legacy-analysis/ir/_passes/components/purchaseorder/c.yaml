  - record_key: order-workflow-orderdate-0001
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      PurchaseOrder date SHALL be stored and retrieved as milliseconds since epoch
      (Unix timestamp in long format).
    confidence: high
    confidence_basis: >
      PurchaseOrderEJB declares poDate as abstract getter/setter for long type; ejbCreate
      converts Date to long via getTime(); getData converts back to Date for XML
      serialization. Multiple consistent enforcement points in code.
    risk_class: operational
    basis: >
      PurchaseOrderEJB.java lines 115-121 show abstract methods for long-typed poDate;
      lines 201 and 264 show conversion to/from long via Date.getTime() and new Date(long).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 115
        line_end: 121
        excerpt: |
          /**
           * Accessor method for Purchasr Order date
           * @return long   PO date - time form epoch
           */
          public abstract long getPoDate();
          public abstract void setPoDate(long orderDate);
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 197
        line_end: 204
        excerpt: |
          public String ejbCreate(PurchaseOrder purchaseOrder) throws CreateException {
            setPoId(purchaseOrder.getOrderId());
            setPoUserId(purchaseOrder.getUserId());
            setPoEmailId(purchaseOrder.getEmailId());
            setPoDate(purchaseOrder.getOrderDate().getTime());
            setPoLocale(purchaseOrder.getLocale().toString());
            setPoValue(purchaseOrder.getTotalPrice());
            return null;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      ejb.persistence: Container Managed

