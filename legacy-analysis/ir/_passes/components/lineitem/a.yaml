  - record_key: LI-LIFECYCLE-0009
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL enforce transactional boundaries on all LineItem EJB methods
      with transaction attribute Required, meaning each invocation either commits
      within an existing transaction or creates a new one.
    confidence: high
    confidence_basis: >
      All container-transaction declarations in ejb-jar.xml explicitly set trans-attribute
      to Required for every method. This is declaratively enforced by the container.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor contains 10 container-transaction entries
      (lines 93-204) covering all LineItem methods: get/setCategoryId, get/setProductId,
      get/setItemId, get/setLineNumber, get/setQuantity, get/setUnitPrice,
      get/setQuantityShipped, create (2 overloads), and getData. All specify
      trans-attribute=Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 93
        line_end: 110
        excerpt: |
          <container-transaction>
           <method>
             <ejb-name>LineItemEJB</ejb-name>
             <method-intf>Local</method-intf>
             <method-name>getCategoryId</method-name>
             <method-params />
           </method>
           <trans-attribute>Required</trans-attribute>
          </container-transaction>
          <container-transaction>
           <method>
             <ejb-name>LineItemEJB</ejb-name>
             <method-intf>Local</method-intf>
             <method-name>getProductId</method-name>
             <method-params />
           </method>
           <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
