  - record_key: CUST-COMM-REQ-0005
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL manage message transmission within a JMS transaction
      using Container-managed transactions with Required transaction attribute.
    confidence: high
    confidence_basis: >
      Both ejb-jar.xml container-transaction element and code confirm this:
      transaction-type=Container in session bean declaration, and sendAMessage
      creates a QueueSession with transacted=true (second parameter=0 is
      acknowledgement mode, first parameter=true confirms transacted session).
    risk_class: operational
    basis: >
      ejb-jar.xml declares transaction-type=Container and specifies container-transaction
      with trans-attribute=Required for sendAMessage method. The implementation creates
      a transacted QueueSession with session = qConnect.createQueueSession(true, 0).
