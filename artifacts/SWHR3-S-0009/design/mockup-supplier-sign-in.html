<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign in · Pet Store Supplier</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.87 0 0);
  --radius: 0.625rem;
  --radius-sm: calc(var(--radius) - 4px);
  --radius-md: calc(var(--radius) - 2px);
  --radius-lg: var(--radius);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--muted);color:var(--foreground);
  font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap;
  border-radius:var(--radius-md);font-size:14px;font-weight:500;line-height:1;height:40px;padding:0 16px;
  border:0;cursor:pointer;font-family:inherit;}
.btn-default{background:var(--primary);color:var(--primary-foreground);}
.btn-block{width:100%;}
.input{display:block;width:100%;height:40px;border:1px solid var(--input);border-radius:var(--radius-md);
  background:var(--background);color:var(--foreground);padding:0 12px;font:inherit;font-size:14px;outline:none;}
.input::placeholder{color:var(--muted-foreground);}
.input-ring{border-color:var(--ring);box-shadow:0 0 0 2px oklch(0.87 0 0 / .5);}
.label{display:block;font-size:14px;font-weight:500;margin-bottom:8px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:0 1px 2px 0 oklch(0.145 0 0 / .05);}
.muted{color:var(--muted-foreground);}

.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;}
.col{width:384px;}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:28px;}
.mark{width:44px;height:44px;border-radius:var(--radius-lg);background:var(--primary);
  display:flex;align-items:center;justify-content:center;color:var(--primary-foreground);}
.title{font-size:22px;font-weight:700;letter-spacing:-0.02em;text-align:center;}
.sub{font-size:14px;text-align:center;margin-top:4px;}
.field + .field{margin-top:18px;}
.foot{margin-top:20px;text-align:center;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="col">
      <div class="brand">
        <div class="mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7.5 4.27 9 5.15"/>
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
            <path d="m3.3 7 8.7 5 8.7-5"/>
            <path d="M12 22V12"/>
          </svg>
        </div>
        <div>
          <div class="title">Pet Store Supplier</div>
          <div class="sub muted">Sign in to manage inventory.</div>
        </div>
      </div>

      <div class="card" style="padding:28px;">
        <div class="field">
          <label class="label" for="u">Username</label>
          <input class="input" id="u" type="text" value="d.okafor" />
        </div>
        <div class="field">
          <label class="label" for="p">Password</label>
          <input class="input input-ring" id="p" type="password" value="supplier2026" />
        </div>
        <div style="margin-top:26px;">
          <button class="btn btn-default btn-block">Sign in</button>
        </div>
      </div>

      <p class="foot muted">Supplier accounts are issued by the store administrator.</p>
    </div>
  </div>
</body>
</html>
