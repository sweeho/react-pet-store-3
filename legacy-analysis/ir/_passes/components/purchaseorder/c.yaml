    requirement: >
      Every PurchaseOrder SHALL have exactly one ContactInfo and one CreditCard
      associated with it. When a PurchaseOrder is deleted, its associated ContactInfo
      and CreditCard SHALL be cascade-deleted.
    confidence: high
    confidence_basis: >
      Relationships are declared in ejb-jar.xml with explicit cascade-delete tags on
      both sides of the relationships. The bidirectional declaration with cascade delete
      is enforced at the container level.
    risk_class: operational
    basis: >
      ejb-jar.xml defines one-to-one relationships with cascade-delete at lines 286-310
      for ContactInfo and lines 342-366 for CreditCard.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 286
        line_end: 310
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>PurchaseOrder-ContactInfo</ejb-relation-name>
            <ejb-relationship-role>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>PurchaseOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>contactInfo</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <multiplicity>One</multiplicity>
              <cascade-delete />
              <relationship-role-source>
                <ejb-name>ContactInfoEJB</ejb-name>
              </relationship-role-source>
            </ejb-relationship-role>
          </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 342
        line_end: 366
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>PurchaseOrder-Card</ejb-relation-name>
            <ejb-relationship-role>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>PurchaseOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>creditCard</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <multiplicity>One</multiplicity>
              <cascade-delete />
              <relationship-role-source>
                <ejb-name>CreditCardEJB</ejb-name>
              </relationship-role-source>
            </ejb-relationship-role>
          </ejb-relation>
    stack_metadata:
      ejb.bean: PurchaseOrderEJB

