      Workflow implemented across three message-driven beans (PurchaseOrderMDB,
      OrderApprovalMDB, InvoiceMDB) with explicit state constants in
      OrderStatusNames. State transitions triggered by JMS messages. Both passes
      would identify identical MDB structure and state handling.
    risk_class: operational
    basis: >
      OrderStatusNames enum and process manager track states. PurchaseOrderMDB
      creates PENDING orders, OrderApprovalMDB transitions to APPROVED/DENIED,
      InvoiceMDB transitions to SHIPPED_PART or COMPLETED.
