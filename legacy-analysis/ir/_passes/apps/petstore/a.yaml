      OrderHTMLAction.extractContactInfo() validates all address fields as mandatory
      except address line 2. Same extraction logic is used in CustomerHTMLAction.
      Screen definitions show enter_order_information screen for collecting this data.
    risk_class: operational
    basis: >
      OrderHTMLAction extracts and validates contact info with fields: family_name,
      given_name, address_1, address_2 (optional), city, state_or_province, postal_code,
      country, telephone_number, email. Missing required fields raise MissingFormDataException.
