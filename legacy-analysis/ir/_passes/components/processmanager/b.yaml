  - record_key: OWF-OP-0004
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL provide a getOrdersByStatus operation that accepts a status
      value and returns a Collection of all order records with that status. The operation
      is used for admin dashboard queries to retrieve orders by their current state.
    confidence: high
    confidence_basis: >
      Declaratively defined in ejb-jar.xml as a session bean method with Required
      transaction attribute. Implementation delegates to ManagerLocalHome.findOrdersByStatus(),
      which is a CMP finder method declared in ejb-jar.xml with EJB-QL: SELECT DISTINCT
      OBJECT(a) FROM Manager a WHERE a.status = ?1. Reachable from admin facade.
    risk_class: operational
    basis: >
      EJB QL query definition in ejb-jar.xml for the ManagerEJB entity bean, referenced
      by ProcessManagerEJB session bean method.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 86
        line_end: 91
        excerpt: |
          /**
           * Business method to get all orders of given status for the admin
           */
          public Collection getOrdersByStatus(String status) throws FinderException {
              return mlh.findOrdersByStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 70
        line_end: 79
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findOrdersByStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </query-method>
            <ejb-ql>SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1</ejb-ql>
          </query>
    stack_metadata:
