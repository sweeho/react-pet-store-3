    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL provide a Category entity with three attributes: id, name,
      and description. Categories form the top level of the product hierarchy.
    confidence: high
    confidence_basis: >
      The Category class is fully implemented and used consistently across catalog
      queries. The entity is declared in the EJB configuration and enforced by
      the DAO layer.
    risk_class: operational
    basis: >
      Category.java (lines 50-74) defines a serializable entity with three private
      fields (id, name, description) and getter methods. The category is retrieved
      from the database via getCategory() in GenericCatalogDAO (lines 159-180) and
      used in getCategories() pagination (lines 182-210).
