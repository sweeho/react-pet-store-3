records:
  - record_key: SUPP-ENTITY-0001
    kind: entity
    capability_key: supplier-integration
    requirement: >
      The system SHALL maintain Inventory entities with itemId (String) as a unique
      identifier and quantity (int) as a mutable numeric field representing available
      stock units.
    confidence: high
    confidence_basis: >
      The InventoryEJB is declared in ejb-jar.xml as a CMP Entity bean with explicit
      persistence-type Container and cmp-version 2.x. The source class defines abstract
      accessors getItemId/setItemId and getQuantity/setQuantity. The ejbCreate method
      signature (String itemId, int quantity) is explicit. All accessor methods in
      ejb-jar.xml are declared with trans-attribute Required. Declarative config and
      code are consistent.
    risk_class: operational
    basis: >
      InventoryEJB (lines 49-122) declares abstract getter/setter methods for itemId
      (String) and quantity (int). ejbCreate at line 104 shows creation with both fields.
      reduceQuantity (lines 82-85) subtracts from quantity. ejb-jar.xml lines 49-81
      declare InventoryEJB as entity with prim-key-class java.lang.String, itemId as
      primkey-field, and two cmp-fields: itemId and quantity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 49
        line_end: 81
        excerpt: |
          <entity>
            <description>Inventory CMP EJB</description>
            <ejb-name>InventoryEJB</ejb-name>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Inventory</abstract-schema-name>
            <cmp-field>
              <field-name>itemId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>quantity</field-name>
            </cmp-field>
            <primkey-field>itemId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 49
        line_end: 85
        excerpt: |
          public abstract class InventoryEJB implements EntityBean {
            public abstract String getItemId();
            public abstract void setItemId(String itemId);
            public abstract int getQuantity();
            public abstract void setQuantity(int quantity);
            public void reduceQuantity(int quantity) {
              int q = this.getQuantity();
              setQuantity(q-quantity);
            }
    stack_metadata:
      ejb.bean: InventoryEJB
      persistence: cmp2
      db.object: Inventory

  - record_key: SUPP-ENTITY-0002
    kind: entity
    capability_key: supplier-integration
    requirement: >
      The system SHALL maintain SupplierOrder entities that represent purchase orders
      received from an external order processing center, with attributes including
      poId (identifier), lineItems (collection), poStatus (workflow state), and poDate
      (timestamp).
    confidence: medium
    confidence_basis: >
      SupplierOrderEJB is referenced in OrderFulfillmentFacadeEJB via ejb-local-ref at
      ejb-jar.xml lines 168-174 and used in processPO (line 233). The source code calls
      po.getPoId(), po.getLineItems(), po.setPoStatus(), and po.getPoDate(). However, the
      actual SupplierOrderEJB class is in a different package (supplierpo) and not visible
      in the supplier module itself. The data model is inferred from method calls.
    risk_class: operational
    basis: >
      ejb-jar.xml defines ejb-local-ref for SupplierOrderEJB at lines 168-174 with
      local-home pointing to com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderLocalHome.
      OrderFulfillmentFacadeEJB.processPO (line 233) calls
      supplierOrderLocalHome.create(supplierOrder). In processAnOrder, the code calls
      po.getPoId(), po.getLineItems(), po.getPoDate(), and po.setPoStatus(). The entity
      is persisted in database but class definition is external to this module.
    traces:
