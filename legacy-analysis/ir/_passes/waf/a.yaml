  - record_key: waf-ejb-0001
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL manage event processing through a stateful session
      bean that maintains conversational state across multiple client calls
      and executes all event processing methods within a Required container-managed
      transaction.
    confidence: high
    confidence_basis: >
      ejb-jar.xml declares the EJBController as Stateful with container
      transaction type Required. This is the only declaration of transaction
      management for this critical component. Code implementation in
      EJBControllerLocalEJB shows no application-managed transaction, confirming
      reliance on container management.
    risk_class: operational
    basis: >
      ejb-jar.xml specifies session type as Stateful and container-transaction
      for the processEvent method with Required attribute.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/ejb-jar.xml
        line_start: 50
        line_end: 74
        excerpt: |
          <session>
            <display-name>EJBController</display-name>
            <ejb-name>EJBController</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.waf.controller.ejb.EJBControllerLocalEJB</ejb-class>
            <session-type>Stateful</session-type>
            <transaction-type>Container</transaction-type>
          </session>
          ...
          <container-transaction>
            <method>
              <ejb-name>EJBController</ejb-name>
              <method-name>processEvent</method-name>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>

  - record_key: waf-request-0001
    kind: workflow
    capability_key: catalog-browsing
    requirement: >
      GIVEN an incoming HTTP request to a .do URL,
      WHEN the MainServlet receives the request,
      THEN the RequestProcessor SHALL invoke the mapped HTMLAction.doStart(),
      followed by HTMLAction.perform() to generate an Event, and then
      HTMLAction.doEnd() with the EventResponse.
    confidence: high
    confidence_basis: >
      RequestProcessor.processRequest() explicitly calls these three methods
      in sequence on the action object. The method exists in the codebase
      and is the core of request processing. This is the definitive implementation
      of request flow.
    risk_class: operational
    basis: >
      RequestProcessor.processRequest() shows the exact sequence: doStart(),
      perform(), and doEnd() method calls on the HTMLAction.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/RequestProcessor.java
        line_start: 127
        line_end: 144
        excerpt: |
          URLMapping urlMapping = getURLMapping(selectedURL);
          HTMLAction action = getAction(urlMapping);
          if (action != null) {
              action.setServletContext(request.getSession().getServletContext());
              action.doStart(request);
              ev = action.perform(request);
              EventResponse eventResponse = null;
              if (ev != null) {
                 EventMapping eventMapping = getEventMapping(ev);
                 if (eventMapping != null) {
                         ev.setEJBActionClassName(eventMapping.getEJBActionClassName());
                 }
                 ComponentManager sl = (ComponentManager)request.getSession().getAttribute(WebKeys.COMPONENT_MANAGER);
                 WebController wcc = sl.getWebController(request.getSession());
                 eventResponse = wcc.handleEvent(ev, request.getSession());
             }
             action.doEnd(request, eventResponse);
          }

  - record_key: waf-mapping-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support URL-to-screen mappings that associate HTTP
      request URLs with specific HTMLAction handlers and target screen names,
      loaded from mappings.xml at application startup.
    confidence: high
    confidence_basis: >
      MainServlet.init() explicitly loads URL mappings via URLMappingsXmlDAO.
      mappings.xml contains url-mapping entries with web-action-class and
      screen attributes. Both source and configuration present this pattern.
    risk_class: operational
    basis: >
      mappings.xml defines URL patterns with associated action classes and
      screens. MainServlet loads these mappings into a HashMap at startup.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 41
        line_end: 59
        excerpt: |
          <mappings>
              <event-mapping>
                  <event-class>com.sun.j2ee.blueprints.waf.event.events.ChangeLocaleEvent</event-class>
                  <ejb-action-class>com.sun.j2ee.blueprints.waf.controller.ejb.action.actions.ChangeLocaleEJBAction</ejb-action-class>
              </event-mapping>
              <url-mapping url="changelocale.do" screen="locale_change_success.screen">
                  <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>
              </url-mapping>
              <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.GeneralFailureException" screen="error.screen"/>
          </mappings>

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/web.xml
    description: >
      Lines 109-122 in web.xml reference env-entry values that are marked
      as REDACTED:secret-finding-73 and REDACTED:secret-finding-74. These
      appear to be the implementation class names for ComponentManager and
      WebController respectively. The actual class names are not visible,
      making it impossible to determine if these are using factory patterns,
      reflection, or direct instantiation. A human should verify what the
      actual implementation classes are.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/ScreenFlowManager.java
    description: >
      The ScreenFlowManager class is referenced throughout but the file
      was not fully examined. It manages exception-to-screen mapping and
      handles forwarding to the next screen. The complete implementation
      would clarify how flow control decisions are made.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
    description: >
      The configuration parameter cache_previous_screen_attributes can be
      set to true/false via init-param, but both web.xml entries show it set
      to false. It is unclear whether this feature is used elsewhere or
      deprecated. The purpose and implications of caching previous screen
      attributes are not documented in the code.
