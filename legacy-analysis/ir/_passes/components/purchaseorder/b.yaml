  - record_key: order-workflow-shipment-tracking-0001
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      The system SHALL track the quantity shipped for each line item in a Purchase Order.
      GIVEN a line item is received from a supplier invoice, WHEN the invoice processes,
      THEN the system SHALL update the quantityShipped field for that line item.
      GIVEN all line items in a Purchase Order have been fully shipped (quantity equals
      quantityShipped for all items), WHEN the system checks fulfillment status,
      THEN the system SHALL mark the order as completely fulfilled.
    confidence: high
    confidence_basis: >
      PurchaseOrderHelper.java processInvoice() method (lines 80-103) implements the
      exact business logic for updating quantityShipped and checking fulfillment status.
      The method is called during invoice processing from supplier integration. Both the
      logic and the LineItem CMP field quantityShipped (ejb-jar.xml line 270) are present
      and active.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.processInvoice() (lines 80-103) updates quantityShipped by
      adding shipped quantities from a map (line 89), then loops through all line items
      to verify complete fulfillment (lines 93-101). Returns true only when all line items
      have quantity == quantityShipped. The quantityShipped CMP field is defined in
      ejb-jar.xml line 270 for LineItemEJB.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 103
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
              }
            }
            liColl = po.getLineItems();
            liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(li.getQuantity() != li.getQuantityShipped()) {
                return false;
              }
            }
            return true;
          }
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 270
        line_end: 271
        excerpt: |
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
    stack_metadata:
      ejb.bean: PurchaseOrderHelper
      method: processInvoice

