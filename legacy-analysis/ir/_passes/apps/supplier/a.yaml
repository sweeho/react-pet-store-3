  - record_key: SUPP-REQ-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL validate that the quantity available in inventory is sufficient
      to fulfill each line item in a purchase order before deducting from inventory.
    confidence: high
    confidence_basis: >
      The checkInventory method is called for every line item that hasn't been shipped.
      The logic compares inv.getQuantity() against item.getQuantity(). Both the
      inventory check and the subsequent reduction are visible in the same code path.
      This is enforced at the business logic layer.
    risk_class: operational
    basis: >
      In OrderFulfillmentFacadeEJB.checkInventory(), the method retrieves the
      Inventory entity by itemId and compares the current quantity against the
      line item quantity. If insufficient, it returns false and the item is not
      deducted. If sufficient, reduceQuantity is called.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item) {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
    stack_metadata:
      framework: ejb
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

