  - record_key: CUST-VAL-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL reject user creation when username exceeds 25 characters.
    confidence: high
    confidence_basis: >
      The rule is enforced at creation time with a thrown CreateException and is
      defined as a public constant, making it both discoverable and enforced.
    risk_class: operational
    basis: >
      UserEJB.ejbCreate() validates userName.length() against
      UserLocal.MAX_USERID_LENGTH (25) and throws CreateException with message if
      exceeded. The constant is defined in UserLocal interface.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 64
        line_end: 67
        excerpt: |
          if(userName.length() > UserLocal.MAX_USERID_LENGTH) {
              throw new CreateException("User ID cant be more than " +
              UserLocal.MAX_USERID_LENGTH + " chars long");
          }

