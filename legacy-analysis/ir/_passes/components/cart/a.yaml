  - record_key: SC-WORKFLOW-0001
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      The shopping cart workflow SHALL support the following user actions in sequence:
      (1) browse catalog and add items (purchase action), (2) view cart, (3) remove items
      (remove action), (4) modify quantities (update action), and (5) proceed to checkout
      (provided cart is not empty).
    confidence: high
    confidence_basis: >
      CartHTMLAction parses and routes all four actions explicitly. The cart.jsp provides
      UI controls for all operations. The workflow is enforced end-to-end from controller
      to view.
    risk_class: operational
    basis: >
      CartHTMLAction handles actions: "purchase" (add), "remove" (delete), "update" (updateItemQuantity),
      and implicitly "empty" via CartEvent. cart.jsp provides forms and links for these actions.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 82
        line_end: 123
        excerpt: |
          public Event perform(HttpServletRequest request)
              throws HTMLActionException {
              String actionType= (String)request.getParameter("action");
              HttpSession session = request.getSession();
              CartEvent event = null;
              if (actionType == null) return null;
              if (actionType.equals("purchase")) {
                  String itemId = request.getParameter("itemId");
                  event = new CartEvent(CartEvent.ADD_ITEM, itemId);
              }
              else if (actionType.equals("remove")) {
                  String itemId = request.getParameter("itemId");
                  event = new CartEvent(CartEvent.DELETE_ITEM, itemId);
              }
              else if (actionType.equals("update")) {
                  /* ... update logic ... */
              }
              return event;
          }

