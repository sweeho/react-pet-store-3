  # Order Entity
  - record_key: OWF-ENT-0001
    kind: entity
    capability_key: order-workflow
    requirement: >
      The system SHALL maintain purchase order entities with the following data:
      Order ID (primary key, VARCHAR), User ID, Order Date (LONGINT), Email ID, Locale, Total Value (REAL),
      Contact Info (nested), Credit Card (nested), and Line Items (one-to-many collection).
    confidence: high
    confidence_basis: >
      PurchaseOrderEJB is mapped to PurchaseOrderEJBTable with explicit SQL DDL in deployment descriptor.
      All fields are declared in the schema with types specified. Contact Info, Credit Card, and Line Items
      are defined as persistent CMP fields and relationships. The schema shows NOT NULL constraints on
      poDate and poValue, indicating these are mandatory.
    risk_class: operational
    basis: >
      sun-j2ee-ri.xml defines PurchaseOrderEJB CMP mapping with CREATE TABLE statement specifying all fields.
      poId (VARCHAR, PRIMARY KEY), poDate (LONGINT NOT NULL), poValue (REAL NOT NULL), and foreign keys to
      ContactInfo and CreditCard. LineItems are managed via join table PurchaseOrderEJB_lineItems_LineItemEJB_Table.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml
        line_start: 624
        line_end: 654
        excerpt: |
          <sql-statement>
            <operation>createTable</operation>
            <sql>CREATE TABLE "PurchaseOrderEJBTable" ("_contactInfo___PMPrimaryKey" LONGINT , "_creditCard___PMPrimaryKey" LONGINT , "poDate" LONGINT NOT NULL , "poEmailId" VARCHAR(255) , "poId" VARCHAR(255) , "poLocale" VARCHAR(255) , "poUserId" VARCHAR(255) , "poValue" REAL NOT NULL, CONSTRAINT "pk_PurchaseOrderEJBTabl" PRIMARY KEY ("poId") )</sql>
          </sql-statement>
    stack_metadata:
      db.object: PurchaseOrderEJBTable
      ejb.bean: PurchaseOrderEJB

  # Line Item Entity
  - record_key: OWF-ENT-0002
    kind: entity
    capability_key: order-workflow
    requirement: >
      The system SHALL maintain line item records for each product in an order with the following data:
      Line Item ID (primary key, LONGINT), Order ID (foreign key), Category ID, Item ID, Product ID,
      Unit Price (REAL), Quantity (INTEGER), and Quantity Shipped (INTEGER).
      The system SHALL track partially shipped items, where Quantity Shipped < Quantity indicates partial fulfillment.
    confidence: high
    confidence_basis: >
      LineItemEJB is mapped to LineItemEJBTable with explicit schema showing all fields. Both Quantity
      and QuantityShipped are INTEGER NOT NULL, allowing tracking of partial shipments. The schema is
      auto-generated from CMP metadata in deployment descriptor.
    risk_class: operational
    basis: >
      sun-j2ee-ri.xml LineItemEJB defines table with columns: quantity (INTEGER NOT NULL),
      quantityShipped (INTEGER NOT NULL), unitPrice (REAL NOT NULL). InvoiceMDB.doWork() processes
      invoices by updating line items, and PurchaseOrderHelper.processInvoice() compares shipment
      totals against quantities to determine if order is complete.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml
        line_start: 700
        line_end: 703
        excerpt: |
          <sql>CREATE TABLE "LineItemEJBTable" ("__PMPrimaryKey" LONGINT , "categoryId" VARCHAR(255) , "itemId" VARCHAR(255) , "lineNumber" VARCHAR(255) , "productId" VARCHAR(255) , "quantity" INTEGER NOT NULL , "quantityShipped" INTEGER NOT NULL , "unitPrice" REAL NOT NULL, CONSTRAINT "pk_LineItemEJBTabl" PRIMARY KEY ("__PMPrimaryKey") )</sql>
    stack_metadata:
      db.object: LineItemEJBTable
      ejb.bean: LineItemEJB

  # Credit Card Entity
  - record_key: OWF-ENT-0003
    kind: entity
    capability_key: order-workflow
    requirement: >
      The system SHALL maintain credit card records with Card Type, Card Number, and Expiry Date.
      Each purchase order has exactly one associated credit card.
