  - record_key: UIDGEN-REQ-0003
    kind: requirement
    capability_key: order-workflow
    requirement: >
      When a request for a unique ID with a new prefix is received, the system SHALL
      automatically create a new counter entity for that prefix if one does not already exist.
    confidence: high
    confidence_basis: >
      The counter creation logic is explicit in the session bean's getCounter method,
      which catches FinderException and creates a new counter. This pattern is code-enforced
      and will be exercised on every unique prefix encountered.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.getCounter(String name) attempts to find an existing counter
      by primary key. If a FinderException occurs (entity not found), it immediately
      creates a new counter with clh.create(name). This auto-creation pattern ensures
      all prefixes are usable on first request.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 74
        line_end: 86
        excerpt: |
          private CounterLocal getCounter(String name) {
              try {
                  CounterLocal counter = null;
                  try {
                      counter = clh.findByPrimaryKey(name);
                  } catch (FinderException fe) {
                      counter = clh.create(name);
                  }
                  return counter;
              } catch (CreateException ce) {
                  throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
              }
          }

  - record_key: UIDGEN-REQ-0004
    kind: requirement
    capability_key: order-workflow
    requirement: >
      Each newly created counter SHALL be initialized with a value of zero.
    confidence: high
    confidence_basis: >
      Counter initialization occurs in the CounterEJB.ejbCreate method, which is
      guaranteed to be called by the container on entity creation. No alternative
      initialization path exists; this is the only place where setCounter is called
      during entity creation.
    risk_class: operational
    basis: >
      The CounterEJB.ejbCreate(String name) method explicitly calls setCounter(0)
      to initialize the counter field. The EJB container guarantees this method is
      called exactly once during entity creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 56
        line_end: 63
        excerpt: |
          // EJB create method
          //===================
          public String ejbCreate(String name) throws CreateException {
              setName(name);
              setCounter(0);
              return null;
          }

  - record_key: UIDGEN-BIZ-0001
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      When getNextValue() is invoked on a Counter entity, the counter value SHALL be
      incremented by exactly 1 before returning.
    confidence: high
    confidence_basis: >
      The increment operation is explicit: getCounter() + 1, assigned back via setCounter().
      This is the only place in the code where counter is modified, and the operation
      is enforced at the entity level with Required transaction isolation.
    risk_class: operational
    basis: >
      CounterEJB.getNextValue() atomically retrieves the current value, increments by 1,
      persists it, and returns the new value. The transaction attribute Required ensures
      isolation from concurrent requests.
