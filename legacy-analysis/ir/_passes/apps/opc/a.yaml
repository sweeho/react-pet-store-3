records:
  # Order Workflow
  - record_key: OWF-WF-0001
    kind: workflow
    capability_key: order-workflow
    requirement: >
      The system SHALL manage order lifecycle through states: PENDING → APPROVED → SHIPPED_PART → COMPLETED or DENIED.
      GIVEN an order is received from Java Pet Store
      WHEN it passes initial validation
      THEN the system SHALL mark it as PENDING and wait for approval.
      GIVEN an order is approved
      WHEN all line items are shipped and confirmed via supplier invoice
      THEN the system SHALL transition through SHIPPED_PART (partial shipments) to COMPLETED.
      GIVEN an order is denied by administrator
      THEN the system SHALL transition to DENIED and stop fulfillment.
    confidence: high
    confidence_basis: >
      State transitions are hardcoded in OrderStatusNames enum and enforced across ProcessManagerEJB,
      PurchaseOrderMDB, OrderApprovalMDB, and InvoiceMDB. Both Java code (processManager.updateStatus calls)
      and database schema (ManagerEJBTable status field) enforce this invariant. The workflow is implemented
      through declarative state management in the ProcessManager component with explicit status updates at
      each workflow stage.
    risk_class: operational
    basis: >
      PurchaseOrderMDB.doWork() creates order with PENDING status and calls
      processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING).
      OrderApprovalMDB updates status to APPROVED. InvoiceMDB marks SHIPPED_PART or COMPLETED based on invoice.
      ProcessManager entity bean tracks status in ManagerEJBTable with status VARCHAR field.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 164
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            //update process manager to start workflow for this purchase order
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 172
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml
        line_start: 470
        line_end: 472
        excerpt: |
          <sql>CREATE TABLE "ManagerEJBTable" ("orderId" VARCHAR(255) , "status" VARCHAR(255), CONSTRAINT "pk_ManagerEJBTabl" PRIMARY KEY ("orderId") )</sql>
    stack_metadata:
      ejb.bean: ProcessManagerEJB, PurchaseOrderMDB, OrderApprovalMDB, InvoiceMDB
      ejb.transaction: Required (all MDB onMessage handlers)

  # Order Approval - Auto-approval for small orders
  - record_key: OAP-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve orders that meet currency-based thresholds without requiring
      administrator review.
      GIVEN an order is received
      WHEN the order locale is US and total price is less than USD 500
      THEN the system SHALL automatically approve and advance to next state.
      GIVEN an order is received
      WHEN the order locale is Japan and total price is less than JPY 50,000
      THEN the system SHALL automatically approve and advance to next state.
      GIVEN an order does not meet threshold criteria
      THEN the system SHALL hold it in PENDING state pending administrator review.
    confidence: high
    confidence_basis: >
      Auto-approval logic is explicitly implemented in canIApprove() method with hardcoded thresholds.
      Locale checking and price comparison are straightforward. Both the code and deployment descriptor
      confirm this rule is active (env-entry for XML validation exists but threshold values are in code).
    risk_class: operational
    basis: >
      PurchaseOrderMDB.canIApprove() method checks order locale and total price against fixed thresholds.
      For US orders: price < 500 returns true. For Japan orders: price < 50000 returns true.
      If auto-approved, doWork() immediately creates OrderApproval message.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB

  # Order Approval - Administrator approval/denial
  - record_key: OAP-WF-0002
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL receive administrator approval or denial decisions for orders held in PENDING state.
      GIVEN an order is in PENDING state
      WHEN administrator approves the order
      THEN the system SHALL transition order to APPROVED and generate purchase order for supplier.
      GIVEN an order is in PENDING state
      WHEN administrator denies the order
      THEN the system SHALL transition order to DENIED and halt fulfillment.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB explicitly processes OrderApproval messages from admin with ChangedOrder objects
      containing status values. The doWork() method iterates through orders and applies status changes
      (APPROVED/DENIED). All approved orders trigger supplier purchase order generation and mail notifications.
    risk_class: operational
    basis: >
      OrderApprovalMDB.onMessage() receives TextMessage containing OrderApproval XML with list of
      ChangedOrder objects. Each ChangedOrder has orderId and status. For APPROVED orders, supplier
      purchase orders are generated via TPASupplierOrderXDE. For DENIED orders, status is updated.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 139
        line_end: 165
        excerpt: |
          public void onMessage(Message recvMsg) {
            TextMessage recdTM = null;
            String recdText = null;
            WorkResult result = null;
            try {
              recdTM = (TextMessage)recvMsg;
              recdText = recdTM.getText();
              result  = doWork(recdText);
              doTransition(result.supplierPoList, result.xmlMailOrderApprovals);
            } catch(TransitionException te) {
              throw new EJBException(te);
            } catch(XMLDocumentException xde) {
              throw new EJBException(xde);
            }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 297
        line_end: 399
        excerpt: |
          <!-- Process recieving a list of OrderApprovals from the Admin Start-->
          <message-driven>
            <description>opc node to process OrderApprovals from the Admin</description>
            <display-name>OrderApprovalMDB</display-name>
            <ejb-name>OrderApprovalMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.opc.ejb.OrderApprovalMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      jms.queue: jms/OrderApprovalQueue
      ejb.transaction: Required

  # Supplier Integration - Purchase Order Transmission
  - record_key: SUP-INT-0001
    kind: integration
    capability_key: supplier-integration
    requirement: >
      The system SHALL transmit supplier purchase orders for approved orders to the supplier.
      GIVEN an order is approved
      WHEN the approval is processed by OrderApprovalMDB
      THEN the system SHALL generate a TPA (Third-Party Application) format supplier purchase order
      AND transmit it via JMS to the supplier.
      GIVEN an invoice is received from supplier
      WHEN the invoice contains line items shipped
      THEN the system SHALL process the invoice and update order shipping status accordingly.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB explicitly creates TPASupplierOrderXDE objects for approved orders and adds them
      to supplierPoList. The doTransition() method sends these to supplier queue. InvoiceMDB receives
      TPAInvoiceXDE messages from supplier topic and processes line item shipments. Both XML document
      handlers are configured in ejb-jar.xml with validation enabled.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() calls TPASupplierOrderXDE to generate supplier purchase order for each
      approved order, adding to supplierPoList. InvoiceMDB receives invoice on Topic, parses via
      TPAInvoiceXDE, extracts line item IDs and processes shipment via PurchaseOrderHelper.
    traces:
