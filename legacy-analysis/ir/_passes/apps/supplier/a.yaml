  - record_key: SUPP-WORKFLOW-0001
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      GIVEN a purchase order is received via JMS from the order processing center,
      WHEN the supplier system receives the message, THEN the system SHALL parse the
      XML, persist it to the database, check inventory, deduct items that can be shipped,
      generate an invoice for shipped items, and send the invoice back via JMS.
    confidence: high
    confidence_basis: >
      The entire workflow is implemented across SupplierOrderMDB and
      OrderFulfillmentFacadeEJB. The MDB receives the message, calls doWork which
      calls processPO, and if an invoice is generated, calls doTransition to send it.
      The processPO method persists the order and calls processAnOrder.
    risk_class: operational
    basis: >
      SupplierOrderMDB.onMessage() receives a JMS message with XML text. It calls
      doWork which calls poProcessor.processPO(xmlMessage). OrderFulfillmentFacadeEJB.processPO()
      parses the XML to a SupplierOrder object, creates the entity via
      supplierOrderLocalHome.create(), and calls processAnOrder to process inventory.
      processAnOrder calls checkInventory for each item, sets quantityShipped, marks
      items as COMPLETED, and calls createInvoice. If invoiceReqd is true, an invoice
      is returned and sent via JMS.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 143
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
              String invoice = doWork(recdText);
              if(invoice!=null) {
                doTransition(invoice);
              }
            }
          }
          private String doWork(String xmlMessage) throws
                                                CreateException, XMLDocumentException {
            String invoice = null;
            invoice = poProcessor.processPO(xmlMessage);
            return invoice;
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            order = supplierOrderLocalHome.create(supplierOrder);
            invoiceXml = processAnOrder(order);
            return invoiceXml;
