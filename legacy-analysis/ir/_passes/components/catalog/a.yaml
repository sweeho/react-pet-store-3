  - record_key: CAT-REQUIREMENT-0008
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support full-text search on Item fields (description, name, attributes)
      via searchItems(searchQuery, start, count, locale). Search queries are tokenized on
      whitespace and each token is matched as a substring against item descriptions, names,
      and attributes using SQL LIKE patterns with wildcards.
    confidence: high
    confidence_basis: >
      The searchItems() implementation explicitly tokenizes the search query and applies
      wildcard LIKE matching for each token across three fields. The SQL construction
      with parameterized queries confirms the search logic.
    risk_class: operational
    basis: >
      GenericCatalogDAO.searchItems() (lines 343-398) tokenizes the searchQuery on
      whitespace using StringTokenizer (line 346). For each keyword, it creates LIKE
      patterns with wildcards (lines 362-365): "%" + keyword + "%" applied to three
      fields. The SQL is parameterized to prevent injection.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 369
        excerpt: |
          public Page searchItems(String searchQuery, int start, int count, Locale locale)
            throws CatalogDAOSysException {
              Collection keywordSet = new HashSet();
              StringTokenizer tokenizer = new StringTokenizer(searchQuery);
              while (tokenizer.hasMoreTokens()) {
                keywordSet.add(tokenizer.nextToken());
              }
              if (keywordSet.isEmpty()) {
                return Page.EMPTY_PAGE;
              }
              String[] keywords = (String[]) keywordSet.toArray(new String[0]);
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[1 + (keywords.length * 3)];
                  parameterValues[0] = locale.toString();
                  for (int i = 0; i < keywords.length; i++) {
                    parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
                    parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
                    parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
                  }
    stack_metadata:
      dao: GenericCatalogDAO
      search.type: substring (LIKE %pattern%)

