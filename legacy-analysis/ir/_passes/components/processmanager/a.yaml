      The system SHALL maintain persistent order management records with at
      minimum an orderId primary key and a status field.
    confidence: high
    confidence_basis: >
      The ManagerEJB is a CMP 2.x entity bean with abstract schema name
      "Manager". The ejb-jar.xml declaratively defines both orderId and
      status as CMP fields, with orderId as the primary key. The
      corresponding database table is implicitly created during deployment
      to store these fields.
