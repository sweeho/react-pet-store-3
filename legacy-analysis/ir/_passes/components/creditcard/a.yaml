  - record_key: CC-FIELD-0003
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL accept and store a card type as a string field. Valid card
      types include: Java(TM) Card, Duke Express, and Meow Card.
    confidence: medium
    confidence_basis: >
      The card type field is defined in the schema and the valid values are explicitly
      enumerated in the create_customer.jsp form. However, no database constraint
      enforces these values, so they are application-level constraints only.
    risk_class: operational
    basis: >
      cardType is a CMP field in CreditCardEJB. The create_customer.jsp form shows
      three hardcoded select options for card type. The populate data also uses these
      card types. No schema validation (CHECK constraint or similar) enforces this set.
    traces:
