      The system SHALL process supplier invoices that indicate partial or
      complete shipments. For partial shipments, the order status SHALL be
      updated to SHIPPED_PART. When all line items have been shipped, the
      order status SHALL transition to COMPLETED and a completion notification
      SHALL be sent to customer relations.
    confidence: high
    confidence_basis: >
      InvoiceMDB is dedicated message-driven bean for invoice processing with
      clear logic for determining partial vs. complete shipment states.
      Configuration and code are consistent and straightforward. Single source
      but comprehensive for invoice workflow.
    risk_class: operational
    basis: >
      InvoiceMDB.onMessage() receives supplier invoice as TextMessage. doWork()
      parses invoice XML, checks shipped items against order line items, and
      determines if order is fully or partially shipped. Updates purchase order
      and process manager state accordingly. If all items shipped, sends join
      message to completion workflow.
