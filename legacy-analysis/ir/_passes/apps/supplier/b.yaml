  - record_key: SUPINT-REQUIREMENT-0004
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL generate an XML invoice document for each shipment that
      includes all line items that were fulfilled from inventory, with itemId,
      quantity, unit price, and other line item details.
    confidence: high
    confidence_basis: >
      createInvoice method in OrderFulfillmentFacadeEJB (lines 145-171) iterates through
      line items from PO and adds only those items present in the newLis HashMap
      (which contains fulfilled items) to the invoice using invoiceXDE.addLineItem()
      method with specific fields.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.createInvoice builds TPAInvoiceXDE document by calling
      setOrderId, setOrderDate, setShippingDate, and iterating line items to add only
      those in newLis HashMap (lines 145-171). processAnOrder populates newLis with
      fulfilled items (line 194) before calling createInvoice.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 171
        excerpt: |
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
                }
              }
              String invDoc = null;
              invDoc = invoiceXDE.getDocumentAsString();
              return(invDoc);
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      xml.object: TPAInvoiceXDE
  - record_key: SUPINT-WORKFLOW-0005
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      When new inventory arrives at the supplier, the system SHALL attempt to
      fulfill all pending purchase orders. For each pending order, it SHALL check
      current inventory availability and generate invoices for any newly fulfillable
      line items. Multiple invoices MAY be generated and sent back to the order
      processing center.
    confidence: high
    confidence_basis: >
      RcvrRequestProcessor.doPost method handles "updateinventory" action by calling
      updateInventory (to set new quantities) then processPendingPO() which returns
      Collection of invoices (lines 179-189). This creates explicit workflow for
      inventory update triggering retry of pending orders.
    risk_class: operational
    basis: >
      RcvrRequestProcessor servlet handles POST requests with currentScreen=updateinventory.
      It calls updateInventory() to process inventory updates (line 185), then calls
      procPO.processPendingPO() (line 186) which returns Collection of invoices.
      OrderFulfillmentFacadeEJB.processPendingPO finds all orders with PENDING status
      and calls processAnOrder for each, collecting generated invoices (lines 247-269).
    traces:
