  - record_key: order-workflow-req-0003
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL calculate order total cost as the sum of line item costs,
      where each line item cost is the product of unit cost and quantity.
    confidence: high
    confidence_basis: >
      OrderEJBAction iterates over cart items, multiplying item.getUnitCost() by
      item.getQuantity() and accumulating into totalCost. This floating-point
      calculation is used directly.
    risk_class: financial
    basis: >
      OrderEJBAction computes totalCost by iterating over cart items and calculating
      cost = unitCost * quantity for each, accumulating the sum. This is used as
      the final order total.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 133
        line_end: 146
        excerpt: |
          Iterator it = items.iterator();
          while (it.hasNext()) {
              CartItem item = (CartItem)it.next();
              float cost = new Float(item.getUnitCost()).floatValue();
              totalCost += (cost*item.getQuantity());
              purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                     item.getProductId(),
                                                     item.getItemId(),
                                                     (lineItemCount++) + "",
                                                     item.getQuantity(),
                                                     cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

