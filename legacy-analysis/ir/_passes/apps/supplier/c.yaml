  - record_key: SUPP-WORKFLOW-0001
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      GIVEN a purchase order XML message is received via JMS Queue from the Order
      Processing Center, WHEN the supplier system receives and processes the message,
      THEN the system SHALL parse the XML, persist the order, check inventory for each
      line item, reduce inventory for items that can be fulfilled, generate an invoice
      for shipped items, and send the invoice back via JMS Topic to notify the OPC.
    confidence: high
    confidence_basis: >
      The complete workflow is implemented across SupplierOrderMDB and
      OrderFulfillmentFacadeEJB with clear method invocations. SupplierOrderMDB.onMessage
      receives Message, extracts XML text, calls doWork (which calls processPO),
      and if invoice is returned, calls doTransition to send it. processPO parses XML
      and persists order, then calls processAnOrder which checks inventory and
      generates invoice. The sequence is explicit and deterministic.
    risk_class: operational
    basis: >
      SupplierOrderMDB.onMessage (lines 101-123) receives JMS Message, casts to
      TextMessage, extracts XML text (line 105), calls doWork (line 108). doWork
      calls poProcessor.processPO(xmlMessage) (line 141). processPO parses XML via
      supplierOrderXDE.setDocument and getSupplierOrder (lines 230-231), persists via
      supplierOrderLocalHome.create (line 233), then calls processAnOrder (line 235).
      processAnOrder checks inventory via checkInventory, reduces quantity, and calls
      createInvoice. If invoice is returned to onMessage (line 111), doTransition is
      called (line 112) to send via TransitionDelegate.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 154
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
              String invoice = doWork(recdText);
              if(invoice!=null) {
                doTransition(invoice);
              }
            }
          }
          private String doWork(String xmlMessage) throws
                                                CreateException, XMLDocumentException  {
            String invoice = null;
            invoice = poProcessor.processPO(xmlMessage);
            return invoice;
          }
          private void doTransition(String xmlMessage) throws TransitionException  {
            TransitionInfo info = new TransitionInfo(xmlMessage);
            transitionDelegate.doTransition(info);
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 210
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            order = supplierOrderLocalHome.create(supplierOrder);
            invoiceXml = processAnOrder(order);
            return invoiceXml;
          }
