records:
  - record_key: CUST-COMM-REQ-0001
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL provide a stateless session bean that accepts message strings
      and transmits them asynchronously to a JMS queue for background processing.
    confidence: high
    confidence_basis: >
      The component is declared as a Stateless session bean in ejb-jar.xml with a
      single sendAMessage(String) method. The method is called from OrderEJBAction
      with serialized purchase order data, and the implementation confirms JMS queue
      transmission via QueueSender.send(). Container-managed transactions enforce
      delivery reliability with Required attribute.
    risk_class: operational
    basis: >
      AsyncSenderEJB is declared as a stateless SessionBean in ejb-jar.xml and
      implements the AsyncSender local interface. The sendAMessage method accepts
      a String parameter containing message data (used in OrderEJBAction line 153
      with purchaseOrder.toXML()). The implementation creates a QueueConnection
      and transmits the message as a JMS TextMessage.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 46
        line_end: 57
        excerpt: |
          <session>
            <display-name>AsyncSenderJAR</display-name>
            <ejb-name>AsyncSenderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender</local>
            <ejb-class>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSender.java
        line_start: 44
        line_end: 47
        excerpt: |
          public interface AsyncSender extends EJBLocalObject {
              public void sendAMessage(String message);
          }
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;
            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
    stack_metadata:
      ejb.bean: session
      ejb.transaction: Required
      jms.queue: true

  - record_key: CUST-COMM-REQ-0002
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL use a named JMS QueueConnectionFactory looked up via JNDI
      at java:comp/env/jms/QueueConnectionFactory for establishing queue connections.
    confidence: high
    confidence_basis: >
      The QueueConnectionFactory is declared in ejb-jar.xml as a resource-ref with
      exact JNDI name and type. The ServiceLocator in ejbCreate retrieves this factory
      by the same JNDI name. This is declarative and programmatically enforced.
    risk_class: operational
    basis: >
      ejb-jar.xml declares a resource-ref with res-ref-name=jms/QueueConnectionFactory
      and res-type=javax.jms.QueueConnectionFactory. AsyncSenderEJB.ejbCreate calls
      ServiceLocator.getQueueConnectionFactory with JNDINames.QUEUE_CONNECTION_FACTORY
      which resolves to java:comp/env/jms/QueueConnectionFactory.
    traces:
