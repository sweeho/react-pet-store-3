  - record_key: CAT-REQUIREMENT-0007
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support pagination for all multi-result operations (getCategories,
      getProducts, getItems, searchItems) using start index and count parameters.
      Pagination includes bidirectional navigation: forward via getStartOfNextPage()
      and backward via getStartOfPreviousPage().
    confidence: high
    confidence_basis: >
      All DAO methods use identical pagination logic with ResultSet.absolute(start+1)
      positioning and count-based row limiting. The Page object provides both
      forward and backward navigation methods.
    risk_class: operational
    basis: >
      GenericCatalogDAO implements pagination consistently across all methods
      (lines 182-210, 236-264, 302-341, 343-398). Each uses ResultSet.absolute()
      to position to the start index and iterates while count > 0. Page.java
      provides isPreviousPageAvailable(), isNextPageAvailable(), getStartOfNextPage(),
      and getStartOfPreviousPage() for bidirectional navigation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[] { locale.toString() };
                  statement = buildSQLStatement(connection, sqlStatements, XML_GET_CATEGORIES, parameterValues);
                  resultSet = statement.executeQuery();
                  if (start >= 0 && resultSet.absolute(start + 1)) {
                      boolean hasNext = false;
                      List categories = new ArrayList();
                      do {
                          categories.add(new Category(resultSet.getString(1).trim(),
                                                      resultSet.getString(2),
                                                      resultSet.getString(3)));
                      } while ((hasNext = resultSet.next()) && (--count > 0));
                      return new Page(categories, start, hasNext);
                  }
