  - record_key: XMLDOC-ENTITY-0001
    kind: entity
    capability_key: supplier-integration
    requirement: >
      The system SHALL provide an OrderApproval entity that encapsulates a collection
      of ChangedOrder items, each containing an OrderId and OrderStatus. The entity
      supports serialization to and from XML with DTD validation.
    confidence: high
    confidence_basis: >
      OrderApproval.java directly implements the entity with an ArrayList of ChangedOrder
      objects and methods for both programmatic addition and XML serialization. The DTD
      is defined with PUBLIC and SYSTEM IDs, and toXML() methods demonstrate consistent
      serialization pattern across the codebase.
    risk_class: operational
    basis: >
      OrderApproval.java (lines 66-102) defines the OrderApproval class with a
      private ArrayList orderList, addOrder() method, and getOrdersList() method.
      Constants define DTD_PUBLIC_ID ("-//Sun Microsystems, Inc. - J2EE Blueprints
      Group//DTD Order Approval 1.0//EN") and DTD_SYSTEM_ID ("OrderApproval.dtd").
      The toXML() methods at lines 89-102 implement serialization with optional
      entity catalog URL parameter.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 66
        line_end: 102
        excerpt: |
          public class OrderApproval {
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Order Approval 1.0//EN";
            public static final String DTD_SYSTEM_ID = "OrderApproval.dtd";
            public static final boolean VALIDATING = true;
            public static final String XML_ORDERAPPROVAL = "OrderApproval";
            private ArrayList orderList = new ArrayList();

            public OrderApproval() {}

            public void addOrder(ChangedOrder order) {
              orderList.add(order);
            }

            public Collection getOrdersList() {
              return orderList;
            }

            public void toXML(Result result) throws XMLDocumentException {
              toXML(result, null);
            }

            public String toXML() throws XMLDocumentException {
              return toXML((URL) null);
            }

            public void toXML(Result result, URL entityCatalogURL) throws XMLDocumentException {
              if (entityCatalogURL != null) {
                XMLDocumentUtils.toXML(toDOM(), DTD_PUBLIC_ID, entityCatalogURL,
                  XMLDocumentUtils.DEFAULT_ENCODING, result);
    stack_metadata:
      framework: JAXP (XML serialization)
      declarative_validator: DTD (OrderApproval.dtd)

  - record_key: XMLDOC-ENTITY-0002
    kind: entity
    capability_key: supplier-integration
    requirement: >
      The system SHALL provide a ChangedOrder entity with two attributes: orderId (String)
      and orderStatus (String). The entity supports bidirectional XML DOM conversion.
    confidence: high
    confidence_basis: >
      ChangedOrder.java implements a complete POJO with getter methods, and both
      toDOM() and fromDOM() factory methods that demonstrate consistent XML marshalling
      and unmarshalling patterns.
    risk_class: operational
    basis: >
      ChangedOrder.java (lines 44-91) defines the ChangedOrder class with private
      String fields orderId and orderStatus. The constructor accepts both parameters
      (lines 51-54). toDOM(Document document) method creates an Order element with
      OrderId and OrderStatus children (lines 73-78). fromDOM(Node node) factory
      method (lines 80-90) unmarshalls the DOM node back to a ChangedOrder object.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 44
        line_end: 91
        excerpt: |
          public class ChangedOrder {
            public static final String XML_ORDER = "Order";
            public static final String XML_ORDERID = "OrderId";
            public static final String XML_ORDERSTATUS = "OrderStatus";
            private String orderId;
            private String orderStatus;

            public ChangedOrder(String id, String stat) {
              orderId = id;
              orderStatus = stat;
            }

            private ChangedOrder() {}

            public String getOrderId() {
              return(orderId);
            }

            public String getOrderStatus() {
              return orderStatus;
            }

            public Node toDOM(Document document) {
              Element root = document.createElement(XML_ORDER);
              XMLDocumentUtils.appendChild(document, root, XML_ORDERID, orderId);
              XMLDocumentUtils.appendChild(document, root, XML_ORDERSTATUS, orderStatus);
              return root;
            }

            public static ChangedOrder fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE &&
                  (element = ((Element) node)).getTagName().equals(XML_ORDER)) {
                Element child;
                ChangedOrder changedOrder = new ChangedOrder();
                changedOrder.orderId = XMLDocumentUtils.getContentAsString(
                  child = XMLDocumentUtils.getFirstChild(element, XML_ORDERID, false), false);
                changedOrder.orderStatus = XMLDocumentUtils.getContentAsString(
                  child = XMLDocumentUtils.getNextSibling(child, XML_ORDERSTATUS, false), false);
                return changedOrder;
              }
              throw new XMLDocumentException(XML_ORDER + " element expected.");
            }
    stack_metadata:
      framework: JAXP (DOM marshalling/unmarshalling)

  - record_key: XMLDOC-SCHEMA-0003
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The Invoice document SHALL define a container for order invoice information with
      attributes: OrderId, UserId, OrderDate, ShippingDate, and one or more LineItem
      elements. The Invoice element SHALL support a locale attribute with default value
      "en_US".
    confidence: high
    confidence_basis: >
      Invoice.dtd is the declarative source for this structure. The locale attribute
      is explicitly defined with a CDATA default value, demonstrating this is a required
      presentational aspect of invoices.
    risk_class: operational
    basis: >
      Invoice.dtd (lines 38-53) defines the Invoice element as a container with
      mandatory OrderId, UserId, OrderDate, ShippingDate, and one or more LineItem
      children. The Invoice element has an ATTLIST declaration with locale attribute
      defaulting to "en_US" (line 44).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/Invoice.dtd
        line_start: 38
        line_end: 53
        excerpt: |
          <!ENTITY % LineItem PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Line Item 1.0//EN" "LineItem.dtd">
          %LineItem;

          <!ELEMENT Invoice (OrderId, UserId, OrderDate, ShippingDate, LineItem+)>

          <!ATTLIST Invoice
          	locale CDATA "en_US"
          >

          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT UserId (#PCDATA)>
          <!ELEMENT OrderDate (#PCDATA)>
          <!ELEMENT ShippingDate (#PCDATA)>
    stack_metadata:
      declarative_validator: DTD (Invoice.dtd)

  - record_key: XMLDOC-SCHEMA-0004
    kind: business-rule
    capability_key: order-checkout
    requirement: >
      The PurchaseOrder document SHALL define a container for purchase order information
      with attributes: OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress,
      TotalPrice, CreditCard (with CardNumber, ExpiryDate, CardType), and one or more
      LineItem elements. The PurchaseOrder element SHALL support a locale attribute with
      default value "en_US".
    confidence: high
    confidence_basis: >
      PurchaseOrder.dtd is the authoritative declarative schema. The credit card structure
      is explicitly modeled as a nested element with three required fields, indicating
      financial sensitivity. The locale attribute mirrors the Invoice structure.
    risk_class: financial
    basis: >
      PurchaseOrder.dtd (lines 38-83) defines the PurchaseOrder element with OrderId,
      UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard,
      and one or more LineItem elements. CreditCard is a nested element (lines 74-80)
      with CardNumber, ExpiryDate, and CardType children. PurchaseOrder has a locale
      attribute defaulting to "en_US" (lines 40-42). Address content is defined via
      parameter entity (line 52) and reused in ShipAddress and BillAddress elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 83
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>

          <!ATTLIST PurchaseOrder
          	locale CDATA "en_US"
          >

          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT UserId (#PCDATA)>
          <!ELEMENT EmailId (#PCDATA)>
          <!ELEMENT OrderDate (#PCDATA)>

          <!ENTITY % Address "FirstName, LastName, Street, City, State, Country, ZipCode">

          <!ELEMENT FirstName (#PCDATA)>
          <!ELEMENT LastName (#PCDATA)>
          <!ELEMENT Street (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
