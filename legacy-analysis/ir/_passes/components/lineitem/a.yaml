      ejb-jar.xml declares LineItemEJB as a CMP entity with persistence-type=Container
      and cmp-version=2.x, with seven declared CMP fields: categoryId, productId, itemId,
      lineNumber, quantity, unitPrice, quantityShipped.
      LineItemEJB.java lines 58-136 define abstract getter/setter methods for these fields.
