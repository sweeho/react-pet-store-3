  - record_key: customer-communications-req-0002
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL encode email message content as UTF-8 when converting from String
      to byte array format for mail transmission.
    confidence: medium
    confidence_basis: >
      ByteArrayDataSource explicitly converts String to UTF-8 bytes with a try-catch block
      for UnsupportedEncodingException. However, the exception is silently caught without
      propagation, so failure handling is unclear. Single source location makes this
      medium confidence.
    risk_class: operational
    basis: >
      ByteArrayDataSource constructor explicitly calls data.getBytes("UTF-8") to encode
      mail content. This is the sole encoding point before transmission.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/ByteArrayDataSource.java
        line_start: 64
        line_end: 69
        excerpt: |
          ByteArrayDataSource(String data, String type) {
              try {
                 this.data = data.getBytes("UTF-8");
              } catch (UnsupportedEncodingException uex) { }
              this.type = type;
          }

  - record_key: customer-communications-req-0003
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL send emails with content type set to "text/html", indicating HTML-
      formatted email body content.
    confidence: high
    confidence_basis: >
      MailHelper.createAndSendMail() explicitly sets contentType = "text/html" as a string
      constant before creating ByteArrayDataSource. This is the sole and consistent approach
      for all emails, confirmed in a single location.
    risk_class: presentational
    basis: >
      MailHelper.createAndSendMail() hardcodes String contentType = "text/html" and passes
