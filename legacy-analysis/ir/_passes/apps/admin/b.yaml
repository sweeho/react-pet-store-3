                  AdminRequestBD bd = new AdminRequestBD();
                  bd.updateOrders(oa);
                  return replyHeader + "<Type>UPDATEORDERS</Type>\n"

  - record_key: order-approval-0003
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL restrict access to the order approval interface to
      users with the administrator role. Any request to the order management
      functionality (ApplRequestProcessor) from a user without an active
      administrator session SHALL be rejected with a session timeout error.
    confidence: high
    confidence_basis: >
      web.xml defines <security-constraint> on AdminRequestProcessor servlet
      with auth-constraint role-name=administrator. Form-based login is
      configured with login/error JSP pages. ApplRequestProcessor checks
      session existence and returns error if null. Both configuration and
      code implement this consistently.
    risk_class: operational
    basis: >
      web.xml declares security-constraint with url-pattern /AdminRequestProcessor
      restricted to administrator role. Form-based login configured with
      form-login-page /login.jsp and form-error-page /error.jsp. login.jsp
      submits to j_security_check with credentials. ApplRequestProcessor.doPost()
      retrieves session with req.getSession(false) and returns error message
      "Session Timed Out; Please exit and login as admin from the login page"
      if session is null.
