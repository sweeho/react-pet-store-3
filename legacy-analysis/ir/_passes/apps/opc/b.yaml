  - record_key: integration-0001
    kind: integration
    capability_key: order-workflow
    requirement: >
      The system SHALL use JMS queues and topics for asynchronous message-driven
      processing of orders, approvals, invoices, and customer notifications. Order
      processing SHALL be transactional with Container-managed transactions and
      Required transaction attribute on all onMessage() methods.
    confidence: high
    confidence_basis: >
      JMS configuration is declared in ejb-jar.xml with explicit transaction
      attributes. Five message-driven beans configured with Container
      transaction type and Required trans-attribute on onMessage(). Pattern
      is consistent and unambiguous across all MDBs.
    risk_class: operational
    basis: >
      ejb-jar.xml declares message-driven-destination for each MDB:
      PurchaseOrderMDB and OrderApprovalMDB use Queue, InvoiceMDB uses Topic,
      MailInvoiceMDB/MailOrderApprovalMDB/MailCompletedOrderMDB use Queue.
      assembly-descriptor specifies Required transaction attribute for all
      MDB onMessage() methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 708
        line_end: 773
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>PurchaseOrderMDB</ejb-name>
              <method-name>onMessage</method-name>
              <method-params>
                <method-param>javax.jms.Message</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>

