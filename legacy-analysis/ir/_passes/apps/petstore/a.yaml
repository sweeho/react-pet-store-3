  - record_key: creditcard-validation-req-0001
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL collect credit card number, card type, and expiry date
      (month and year) during customer account setup and order placement.
    confidence: high
    confidence_basis: >
      CustomerHTMLAction.extractCreditCard() validates credit card fields as mandatory.
      CreditCard object constructor takes cardNumber, cardType, and expiryDate.
      Profile forms request credit_card_number, credit_card_type, credit_card_expiry_month,
      credit_card_expiry_year parameters.
    risk_class: financial
    basis: >
      CustomerHTMLAction validates creditCardNumber, creditCardType, creditCardExpiryMonth,
      creditCardExpiryYear as required fields. Expiry date is formatted as "month/year"
      string. CreditCard entity stores these three pieces of information.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 140
        line_end: 179
        excerpt: |
          private CreditCard extractCreditCard(HttpServletRequest request)
              throws HTMLActionException {
              ArrayList missingFields = null;
              String creditCardNumber =  request.getParameter("credit_card_number").trim();
              if (creditCardNumber.equals("")) {
                  if (missingFields == null) {
                      missingFields = new ArrayList();
                  }
                  missingFields.add("Credit Card");
              }
              String creditCardType =  request.getParameter("credit_card_type").trim();
              String creditCardExpiryMonth =  request.getParameter("credit_card_expiry_month").trim();
