      ejb.bean: ProcessManagerEJB

  - record_key: OWF-TRANS-0001
    kind: requirement
    capability_key: order-workflow
    requirement: >
      All ProcessManager session bean operations that modify or query order state
      (createManager, updateStatus, getStatus, getOrdersByStatus) SHALL execute within
      a Required container-managed transaction. A transaction SHALL be started before
      the method executes; if the caller is already in a transaction, the existing
      transaction SHALL be reused. If the method completes normally, the transaction
      SHALL commit. If the method raises an exception, the transaction SHALL roll back.
    confidence: high
    confidence_basis: >
      Container transaction attributes are declaratively defined in ejb-jar.xml for each
      method on both ProcessManagerEJB and ManagerEJB entity bean. All methods carry
      <trans-attribute>Required</trans-attribute>. This is enforced at the EJB container
      level and is not overrideable by application code.
    risk_class: financial
    basis: >
      EJB declarative transaction management in ejb-jar.xml assembly descriptor,
      covering create, update, query, and remove operations.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 262
        line_end: 390
        excerpt: |
          <assembly-descriptor>
            ...
            <container-transaction>
              <method>
                <ejb-name>ProcessManagerEJB</ejb-name>
                <method-intf>Local</method-intf>
                <method-name>createManager</method-name>
                <method-params>
                  <method-param>java.lang.String</method-param>
                  <method-param>java.lang.String</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
            </container-transaction>
            ...
    stack_metadata:
      ejb.transaction: Required

  - record_key: OWF-SECURITY-0001
    kind: requirement
    capability_key: order-workflow
    requirement: >
      All ProcessManager and Manager EJB methods (both session and entity bean methods)
      SHALL be accessible without authentication. No role-based access control is
      enforced; all callers have permission to invoke all methods.
    confidence: high
    confidence_basis: >
      All methods in ejb-jar.xml assembly descriptor use <unchecked /> method permission,
      which means no authentication is required. No role-based restrictions are declared
      for any method. The session bean uses <use-caller-identity></use-caller-identity>
      which means the caller's security context is preserved but not checked.
    risk_class: operational
    basis: >
      Declarative security configuration in ejb-jar.xml assembly descriptor with
      unchecked method permissions for all ProcessManagerEJB and ManagerEJB methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 103
        line_end: 110
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
               <method>
    stack_metadata:
      ejb.bean: ProcessManagerEJB

  - record_key: OWF-INIT-0001
    kind: requirement
    capability_key: order-workflow
    requirement: >
      When ProcessManagerEJB is instantiated, it SHALL look up the ManagerLocalHome
      interface from JNDI at java:comp/env/ejb/Manager. If the lookup fails with a
      NamingException, an EJBException SHALL be raised with the naming error message.
    confidence: high
    confidence_basis: >
      JNDI lookup is performed in ProcessManagerEJB.ejbCreate() and is visible in the
      code. The JNDI binding is declared in ejb-jar.xml as an ejb-local-ref with
      ejb-link to ManagerEJB. If lookup fails, the code explicitly catches NamingException
      and wraps it in EJBException.
    risk_class: operational
    basis: >
      Declarative ejb-local-ref in ejb-jar.xml combined with programmatic lookup in
      ProcessManagerEJB.ejbCreate().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 93
        line_end: 100
        excerpt: |
          public void ejbCreate() throws CreateException {
            try {
               ic = new InitialContext();
               mlh = (ManagerLocalHome) ic.lookup(MANAGER_HOME_ENV_NAME);
            } catch (NamingException ne) {
               throw new EJBException("Got naming exception! " + ne.getMessage());
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 89
        line_end: 95
        excerpt: |
          <ejb-local-ref>
            <ejb-ref-name>ejb/Manager</ejb-ref-name>
            <ejb-ref-type>Entity</ejb-ref-type>
            <local-home>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocal</local>
            <ejb-link>ManagerEJB</ejb-link>
          </ejb-local-ref>
    stack_metadata:
      ejb.bean: ProcessManagerEJB

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
    description: >
      No transition validation is present in the ProcessManagerEJB.updateStatus() or
      ManagerEJB.setStatus() methods. The workflow state machine documented in
      OrderStatusNames.java is enforced only by callers (MDBs in the opc component).
      It is not clear whether invalid status transitions (e.g., DENIED → COMPLETED)
      would be rejected or silently accepted. A future requirement should clarify
      whether the system SHALL validate transitions or allow any status value.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
    description: >
      ProcessManagerEJB is a stateless session bean that initializes ManagerLocalHome
      in ejbCreate(). For a stateless bean, ejbCreate() is called once per bean instance,
      not per method invocation. However, the pattern of looking up the home in ejbCreate()
      is typical and suggests the home is cached for the bean instance's lifetime. It
      is not clear whether new instances are created per client or pooled, and whether
      the home reference is stable across multiple method invocations on the same bean
      instance.
