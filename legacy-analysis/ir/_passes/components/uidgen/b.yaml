  - record_key: UIDGEN-WF-0001
    kind: workflow
    capability_key: order-workflow
    requirement: >
      GIVEN a request to getUniqueId with a prefix that has no existing counter,
      WHEN the prefix is first requested,
      THEN the system SHALL create a new Counter entity and return an ID with value {prefix}1.
    confidence: medium
    confidence_basis: >
      The auto-creation behavior is observable from the code (FinderException → create),
      but the exact initial value (1 vs 0) depends on implementation detail: increment
      happens before return in getNextValue(). Both passes must agree on this flow for
      confidence to be marked high. Medium reflects single-source observation.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.getCounter() tries findByPrimaryKey; on FinderException,
      calls clh.create(name). CounterEJB.ejbCreate() sets counter to 0. CounterLocal.getNextValue()
      increments and returns. The first ID is therefore {name}1. No alternative path exists.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 56
        line_end: 86
        excerpt: |
          public void ejbCreate() {
            try {
              ic = new InitialContext();
              clh = (CounterLocalHome) ic.lookup("java:comp/env/ejb/Counter");
            } catch (NamingException ne) {
               throw new EJBException("UniqueIdGeneratorEJB Got naming exception! " + ne.getMessage());
            }
          }

          public String getUniqueId(String idPrefix) {
              return getCounter(idPrefix).getNextValue();
          }

          private CounterLocal getCounter(String name) {
              try {
                  CounterLocal counter = null;
                  try {
                      counter = clh.findByPrimaryKey(name);
                  } catch (FinderException fe) {
                      counter = clh.create(name);
                  }
                  return counter;
              } catch (CreateException ce) {
                  throw new EJBException("Could not create counter " + name + ". Error: " + ce.getMessage());
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 56
        line_end: 71
        excerpt: |
          public String ejbCreate(String name) throws CreateException {
              setName(name);
              setCounter(0);
              return null;
          }

          public String getNextValue() {
              int count = getCounter() + 1;
              setCounter(count);
              return getName() + String.valueOf(count);
          }

findings:
