  - record_key: CAT-ENTITY-0004
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL provide a Page entity to represent a paginated result set,
      with attributes: objects (List of results), start (starting index), and hasNext
      (boolean indicating more results). Page supports both forward and backward navigation.
    confidence: high
    confidence_basis: >
      The Page class is fully implemented with methods to check pagination state
      and calculate next/previous page offsets. It is used consistently in all DAO
      methods that return collections.
    risk_class: operational
    basis: >
      Page.java (lines 45-94) defines the pagination container with List objects,
      int start, and boolean hasNext. Methods isNextPageAvailable() and
      isPreviousPageAvailable() determine navigation availability. Methods
      getStartOfNextPage() and getStartOfPreviousPage() calculate offsets.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 94
        excerpt: |
          public class Page implements Serializable {
              public static final Page EMPTY_PAGE =
                  new Page(Collections.EMPTY_LIST, 0, false);

              List objects;
              int start;
              boolean hasNext;

              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }

              public List getList() { return objects; }
              public boolean isNextPageAvailable() { return hasNext; }
              public boolean isPreviousPageAvailable() { return start > 0; }
              public int getStartOfNextPage() { return start + objects.size(); }
              public int getStartOfPreviousPage() {
                  return Math.max(start-objects.size(), 0);
              }
    stack_metadata:
      framework: java.beans (serializable entity)
      db.object: Page (pagination container)

