records:
  - record_key: customer-management-requirement-0001
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL provide a Debug utility class that enables conditional debug output
      throughout the application, with a static boolean flag that controls whether debug
      messages are printed to the console.
    confidence: high
    confidence_basis: >
      The Debug class is explicitly defined with a static field debuggingOn (line 46) that
      gates all debug output. All public methods check this flag before producing any output.
      The class is imported and used across multiple components (catalog, cart, waf) confirming
      its role as a system-wide debugging utility.
    risk_class: operational
    basis: >
      Debug class provides static methods that check debuggingOn before calling System.err.print()
      or System.err.println(). The flag is visible at lines 46, 49, 54, 69.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/util/tracer/src/com/sun/j2ee/blueprints/util/tracer/Debug.java
        line_start: 44
        line_end: 60
        excerpt: |
          public final class Debug {

              public static final boolean debuggingOn = false;

              public static void print(String msg) {
                  if (debuggingOn) {
                      System.err.print(msg);
                  }
              }

              public static void println(String msg) {
                  if (debuggingOn) {
                      System.err.println(">>" + msg);
                  }
              }
    stack_metadata:
      framework: debug-utility
      output_stream: "System.err"
      class_modifier: final

  - record_key: customer-management-business-rule-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL disable debug output by default in the petstore application by setting
      the Debug.debuggingOn flag to false, ensuring that diagnostic messages do not appear
      in production logs unless explicitly enabled.
    confidence: high
    confidence_basis: >
      The debuggingOn field is declared as a public static final boolean with literal value false
      (line 46). This is the default configuration, and all print methods guard on this flag.
      No configuration mechanism is present to enable debugging at runtime.
    risk_class: operational
    basis: >
      The static field debuggingOn is explicitly hardcoded to false on line 46, and all output
      methods (print, println) gate their output on this flag. This ensures debug statements
      scattered throughout the codebase produce no output unless the flag is changed and rebuilt.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/util/tracer/src/com/sun/j2ee/blueprints/util/tracer/Debug.java
        line_start: 46
        line_end: 52
        excerpt: |
          public static final boolean debuggingOn = false;

          public static void print(String msg) {
              if (debuggingOn) {
                  System.err.print(msg);
              }
          }

