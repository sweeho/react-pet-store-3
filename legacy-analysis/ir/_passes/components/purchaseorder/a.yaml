  - record_key: ORDER-CHECKOUT-0001
    kind: entity
    capability_key: order-checkout
    requirement: >
      A PurchaseOrder SHALL comprise OrderId, UserId, EmailId, OrderDate, ShippingInfo
      (ContactInfo), BillingInfo (ContactInfo), TotalPrice, CreditCard, and one or more
      LineItems.
    confidence: high
    confidence_basis: >
      The DTD schema at legacy-source/.../PurchaseOrder.dtd declaratively specifies the
      XML structure; the ejb-jar.xml defines corresponding persistent CMP fields; and the
      PurchaseOrder value object class implements both serialization and field storage. The
      structure is enforced in three independent places (DTD, EJB declarative, and Java
      class).
    risk_class: operational
    basis: >
      PurchaseOrder.dtd line 38 defines the element content model; PurchaseOrderEJB.java
      lines 62-83 define the CMP fields; PurchaseOrder.java lines 59-83 define the value
      object state.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 68
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShippingInfo, BillingInfo, TotalPrice, CreditCard, LineItem+)>
          <!ATTLIST PurchaseOrder
            locale CDATA "en_US"
          >
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 60
        line_end: 83
        excerpt: |
          <cmp-field>
            <field-name>poId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poUserId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poEmailId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poDate</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poLocale</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poValue</field-name>
          </cmp-field>
