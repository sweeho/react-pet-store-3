  - record_key: SUPINT-WORKFLOW-0001
    kind: workflow
    capability_key: supplier-integration
    requirement: >
      The system SHALL receive purchase orders from the order processing center
      via JMS message queue and process them through the following workflow:
      receive PO XML → validate PO structure → check inventory availability →
      deduct quantities from inventory for fulfilled items → generate invoice
      for shipped items → send invoice back via transition delegate.
    confidence: high
    confidence_basis: >
      Both the ejb-jar.xml and SupplierOrderMDB.java clearly define MDB listening
      to javax.jms.Queue with onMessage handler (lines 85-156). OrderFulfillmentFacadeEJB
      implements complete workflow with checkInventory, processAnOrder, and createInvoice
      methods (lines 126-210). The processPO and processPendingPO methods are marked
      with container-managed transactions Required (ejb-jar.xml lines 330-347).
    risk_class: operational
    basis: >
      ejb-jar.xml defines SupplierOrderMDB with message-driven-destination type Queue (lines 85-93).
      SupplierOrderMDB.onMessage(Message) calls doWork which invokes OrderFulfillmentFacadeEJB.processPO()
      (lines 101-142 in SupplierOrderMDB.java). OrderFulfillmentFacadeEJB.processPO parses XML PO,
      persists order, calls processAnOrder which iterates line items and checks inventory
      (OrderFulfillmentFacadeEJB.java lines 223-237).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 85
        line_end: 93
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>SupplierOrderMDB</display-name>
            <ejb-name>SupplierOrderMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.supplier.processpo.ejb.SupplierOrderMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
              // Do processing work on received message
              String invoice = doWork(recdText);
              // If orders were shipped, do the transition
              if(invoice!=null) {
                doTransition(invoice);
              }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;
            // Convert Po in XML to PO as Java Obj
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            //persist order
            order = supplierOrderLocalHome.create(supplierOrder);
            //fullfil order
            invoiceXml = processAnOrder(order);
            return invoiceXml;
          }
