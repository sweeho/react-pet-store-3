    kind: entity
    capability_key: customer-management
    requirement: >
      The system SHALL maintain an Account entity for each Customer with a status field.
      Each Account SHALL be associated with exactly one ContactInfo entity and exactly one CreditCard entity.
    confidence: high
    confidence_basis: >
      CMP 2.x entity declared with Container persistence. One-to-one relationships with
      cascade-delete are declaratively enforced in ejb-jar.xml. The relationships are
      created programmatically in AccountEJB.ejbPostCreate.
    risk_class: operational
    basis: >
      Account EJB is a CMP 2.x entity with a status CMP field. ejb-jar.xml declares
      one-to-one relationships with ContactInfo and CreditCard. AccountEJB.ejbPostCreate
      creates default ContactInfo and CreditCard instances when an Account is created.
