records:
  - record_key: order-workflow-req-0001
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL manage order lifecycle transitions through the following
      valid state progression: PENDING → APPROVED → SHIPPED_PART → COMPLETED,
      and PENDING → DENIED. An order starts in PENDING state when a new purchase
      order is received.
    confidence: high
    confidence_basis: >
      Both implementations (code and declarative config) show the same state
      constants defined in OrderStatusNames.java. The documented state transitions
      are explicitly listed in the file comments. The ProcessManagerEJB creates
      new orders in PENDING status via createManager(). The ManagerEJB CMP entity
      persistently stores status in the Manager table.
    risk_class: operational
    basis: >
      OrderStatusNames.java defines five constants (PENDING, APPROVED, DENIED,
      SHIPPED_PART, COMPLETED) with documentation of the allowed transitions.
      ProcessManagerEJB.createManager() initializes orders with the provided
      status, which is PENDING for new orders. ManagerEJB is a CMP 2.0 entity
      bean with status as a persistent CMP field, enforced in ejb-jar.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 40
        line_end: 67
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
          public class OrderStatusNames {

              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";

              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";

              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";

              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";

              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 46
        line_end: 65
        excerpt: |
          <entity>
            <display-name>ManagerEB</display-name>
            <ejb-name>ManagerEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.processmanager.manager.ejb.ManagerEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <reentrant>False</reentrant>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Manager</abstract-schema-name>
            <cmp-field>
              <description>no description</description>
              <field-name>status</field-name>
            </cmp-field>
            <cmp-field>
              <description>no description</description>
              <field-name>orderId</field-name>
            </cmp-field>

  - record_key: order-workflow-req-0002
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL provide a method to create and initialize a new order
      workflow process when a purchase order is received, accepting orderId
      and an initial status as parameters.
    confidence: high
    confidence_basis: >
      ProcessManagerEJB.createManager(String orderId, String status) is
      declared in the ejb-jar.xml configuration with Required transaction
      attribute. The method is also declared in the ProcessManagerLocal
      interface. The implementation creates a ManagerLocal entity via
      mlh.create(orderId, status), which initializes both orderId and status
      CMP fields.
    risk_class: operational
    basis: >
      ProcessManagerEJB implements the createManager business method with
      documentation stating "Business method used for when new purchase orders
      are recieved and want to start the workflow process to fullfil the order".
      The method calls mlh.create(orderId, status) which instantiates a Manager
      entity bean.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 62
        line_end: 68
        excerpt: |
          /**
           * Business method used for when new purchase orders are recieved
           * and want to start the workflow process to fullfil the order
           */
          public void createManager(String orderId, String status) throws CreateException {
            ManagerLocal manager = mlh.create(orderId, status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 346
        line_end: 356
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ProcessManagerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>createManager</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>

  - record_key: order-workflow-req-0003
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL provide a method to update the current status of an
      existing order within the workflow process by orderId.
    confidence: high
    confidence_basis: >
      ProcessManagerEJB.updateStatus(String orderId, String status) is
      declared and documented as a business method for workflow tracking.
      It is defined in both ProcessManagerLocal interface and ejb-jar.xml
      with Required transaction attribute. The implementation locates the
      Manager entity by orderId and calls setStatus(status) to persist the
      change.
    risk_class: operational
    basis: >
      ProcessManagerEJB.updateStatus documentation states "Business method
      used to keep track of an order in the workflow process". It calls
      mlh.findByPrimaryKey(orderId) to retrieve the entity and then
      manager.setStatus(status) to update it.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 76
        excerpt: |
          /**
           * Business method used to keep track of an order in the workflow process
           */
          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 357
        line_end: 368
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>ProcessManagerEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>updateStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>

  - record_key: order-workflow-req-0004
