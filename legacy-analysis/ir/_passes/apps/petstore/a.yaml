records:
  - record_key: catalog-browsing-req-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support product catalog discovery and browsing through
      hierarchical navigation of product categories.
    confidence: high
    confidence_basis: >
      Web.xml declares jdbc/CatalogDB resource and CatalogDAO configuration
      environment entries. Screen definitions include category, product, and item
      browsing screens. Servlet mappings route catalog operations through web tier.
    risk_class: presentational
    basis: >
      The petstore web configuration declares JDBC resources for direct catalog
      access via the Fast Lane Reader pattern, and screen definitions document
      the browsing workflow across multiple hierarchy levels.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 171
        line_end: 182
        excerpt: |
          <resource-ref>
            <description>Allow the Fast Lane Reader Pattern to Read Catalog Data Directly via JDBC in the Web Tier</description>
            <res-ref-name>jdbc/CatalogDB</res-ref-name>
            <res-type>javax.sql.DataSource</res-type>
            <res-auth>Container</res-auth>
          </resource-ref>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/screendefinitions_en_US.xml
        line_start: 65
        line_end: 90
        excerpt: |
          <screen name="category">
            <parameter key="title" value="Items" direct="true"/>
            <parameter key="banner" value="/banner.jsp" />
            <parameter key="sidebar" value="/sidebar.jsp" />
            <parameter key="body" value="/category.jsp" />
          </screen>
          <screen name="product">
            <parameter key="title" value="Product" direct="true"/>
            <parameter key="body" value="/product.jsp" />
          </screen>
          <screen name="item">
            <parameter key="title" value="Item" direct="true"/>
            <parameter key="body" value="/item.jsp" />
          </screen>

  - record_key: shopping-cart-req-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL support adding items to a shopping cart identified by item ID.
    confidence: high
    confidence_basis: >
      Both passes agree on cart ADD_ITEM operation. CartEvent class explicitly
      defines ADD_ITEM action type. CartEJBAction implements cart.addItem(itemId).
      CartHTMLAction extracts itemId from request parameters.
    risk_class: operational
    basis: >
      CartEvent defines actionType=1 for ADD_ITEM. CartEJBAction.perform() calls
      cart.addItem(ce.getItemId()). CartHTMLAction extracts itemId parameter when
      actionType="purchase" is submitted.
