      alh.create(AccountLocalHome.Active), the Account's ejbPostCreate is triggered.
      AccountEJB.ejbPostCreate (lines 80-93) calls cih.create() and cch.create() with
      no parameters, creating default instances. The Create methods in ContactInfoLocalHome
