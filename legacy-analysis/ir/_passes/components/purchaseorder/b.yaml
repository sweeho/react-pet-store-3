      464, 473, 482, 491, 500, 511, 520, 531, 540, 551, 560, 570, 580, 603). This is a
      declarative, container-enforced policy with no exceptions.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor section (lines 401-1222) contains explicit
      <container-transaction> declarations for all PurchaseOrderEJB methods with
      <trans-attribute>Required</trans-attribute> on each (lines 439-603). This covers
      all getPoX, setPoX, getContactInfo, setContactInfo, getCreditCard, setCreditCard,
      getLineItems, addLineItem, getAllItems, getData, create, findByPrimaryKey,
      and findPOBetweenDates methods.
