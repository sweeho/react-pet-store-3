  - record_key: CUST-VAL-0003
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL reject user creation when username contains '%' or '*'
      characters.
    confidence: high
    confidence_basis: >
      The rule is enforced at creation time with an explicit character check and
      thrown CreateException, providing clear evidence of the validation.
    risk_class: operational
