  - record_key: XMLDOC-REQUIREMENT-0011
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      The system SHALL support resolution of external XML entities through a
      CustomEntityResolver that loads entity mappings from an entity catalog properties
      file. The catalog path is "/com/sun/j2ee/blueprints/xmldocuments/rsrc/EntityCatalog.properties".
    confidence: high
    confidence_basis: >
      CustomEntityResolver.java directly implements EntityResolver with a hardcoded
      catalog path constant. The resolver loads the catalog from the classpath and
      uses it to map PUBLIC IDs to system URIs. The pattern is used consistently
      in both TPAInvoiceXDE and TPASupplierOrderXDE.
    risk_class: operational
    basis: >
      CustomEntityResolver.java (lines 47-79) defines ENTITY_CATALOG constant
      ("/com/sun/j2ee/blueprints/xmldocuments/rsrc/EntityCatalog.properties") and
      implements EntityResolver interface. The constructor (lines 60-79) loads the
      catalog from the classpath using getClass().getResourceAsStream(ENTITY_CATALOG)
      and stores it in a Properties object. TPAInvoiceXDE.java (lines 91-93) and
      TPASupplierOrderXDE.java (lines 98-100) both instantiate CustomEntityResolver
      and call mapEntityURI() to resolve entity mappings.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
        line_start: 47
        line_end: 79
        excerpt: |
          public class CustomEntityResolver implements EntityResolver {
            public static final boolean TRACE = false;
            public static final String ENTITY_CATALOG
            = "/com/sun/j2ee/blueprints/xmldocuments/rsrc/EntityCatalog.properties";
            private Properties entityCatalog = null;
            private EntityResolver parentResolver = null;

            public CustomEntityResolver() {
              this((EntityResolver) null);
            }

            public CustomEntityResolver(EntityResolver parentResolver) {
              this.parentResolver = parentResolver;
              entityCatalog = new Properties();
              InputStream stream = getClass().getResourceAsStream(ENTITY_CATALOG);
              if (stream != null) {
                if (TRACE) {
                  System.err.println("Load resource from: " + getClass().getResource(ENTITY_CATALOG));
                }
                try {
                  entityCatalog.load(stream);
                } catch (IOException exception) {
                  System.err.println("Can't load from resource: " + ENTITY_CATALOG + ": " + exception);
                }
              } else {
                if (TRACE) {
                  System.err.println("Can't access resource: " + ENTITY_CATALOG);
                }
              }
            }
    stack_metadata:
      framework: SAX (EntityResolver)

