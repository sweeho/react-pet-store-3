  - record_key: creditcard-validation-workflow-0001
    kind: workflow
    capability_key: creditcard-validation
    requirement: >
      GIVEN a customer signs up or modifies their profile, WHEN credit card information
      is submitted via the web form, THEN the CustomerHTMLAction extracts credit card fields
      and creates a CustomerEvent containing the CreditCard object for downstream processing.
    confidence: high
    confidence_basis: >
      CustomerHTMLAction.perform() method explicitly shows the flow: extract credit card
      via extractCreditCard(), create CustomerEvent with the CreditCard object passed to
      constructor.
    risk_class: operational
    basis: >
      CustomerHTMLAction.perform() line 96 calls extractCreditCard(request) and line 98
      creates CustomerEvent(CustomerEvent.CREATE, info, profileInfo, creditCard). The
      similar flow at line 102-104 handles UPDATE action.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 86
        line_end: 107
        excerpt: |
          public Event perform(HttpServletRequest request)
              throws HTMLActionException {
              String actionType= (String)request.getParameter("action");
              CustomerEvent event = null;
              if (actionType == null) return null;
              if (actionType.equals("create")) {
                  ContactInfo info = extractContactInfo(request, "_a");
                  CreditCard creditCard = extractCreditCard(request);
                  ProfileInfo profileInfo  = extractProfileInfo(request);
                  event = new CustomerEvent(CustomerEvent.CREATE, info, profileInfo, creditCard);
              } else if (actionType.equals("update")) {
                  ContactInfo info = extractContactInfo(request, "_a");
                  CreditCard creditCard = extractCreditCard(request);
                  ProfileInfo profileInfo  = extractProfileInfo(request);
                  event = new CustomerEvent(CustomerEvent.UPDATE, info, profileInfo, creditCard);
              }
              return event;

