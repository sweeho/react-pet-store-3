  - record_key: admin-workflow-0001
    kind: workflow
    capability_key: admin-dashboard
    requirement: >
      GIVEN an authenticated administrator, WHEN selecting "Launch Rich Client"
      from the home page, THEN the system SHALL generate a JNLP file containing
      the session ID and server connection details, and SHALL deliver it to the
      client's browser for Java WebStart to execute.
    confidence: high
    confidence_basis: >
      AdminRequestProcessor.buildJNLP() method is explicitly called when
      currentScreen equals "manageorders", with detailed JNLP XML construction.
      Session ID is embedded in the JNLP file.
    risk_class: operational
    basis: >
      AdminRequestProcessor.doPost() checks for currentScreen="manageorders" and
      calls buildJNLP(req), which constructs an XML JNLP file with PetStoreAdminClient
      as the main class, passes server hostname, port, and session ID as arguments.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 102
        line_end: 119
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
          throws IOException, ServletException {
              String curScreen = req.getParameter("currentScreen");
              if (curScreen == null) {
                  return;
              }
              curScreen = curScreen.trim();
              if(curScreen.equals("logout")) {
                  getServletConfig().getServletContext().getRequestDispatcher("/logout.jsp").forward(req, resp);
              }
              if(curScreen.equals("manageorders")) {
                  resp.setContentType("application/x-java-jnlp-file");
                  ServletOutputStream out = resp.getOutputStream();
                  out.println(buildJNLP(req));
                  out.flush();
                  out.close();
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 63
        line_end: 95
        excerpt: |
          protected String buildJNLP(HttpServletRequest req) throws ServletException {
              String serverName = req.getServerName();
              int serverPort = req.getServerPort();
              StringBuffer jnlp = new StringBuffer();
              jnlp.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n");
              jnlp.append("<jnlp codebase=\"http://").append(serverName).append(":").append(serverPort).append("/admin\">\n");
              // ... information, resources ...
              jnlp.append("<application-desc main-class=\"com.sun.j2ee.blueprints.admin.client.PetStoreAdminClient\">\n");
              jnlp.append("<argument>com.sun.j2ee.blueprints.admin.client.HttpPostPetStoreProxy</argument>\n");
              jnlp.append("<argument>").append(serverName).append("</argument>\n");
              jnlp.append("<argument>").append(serverPort).append("</argument>\n");
              jnlp.append("<argument>").append(req.getSession().getId()).append("</argument>\n");
              jnlp.append("</application-desc>\n</jnlp>\n");
              return(jnlp.toString());
          }
    stack_metadata:
      framework: J2EE Servlet
      jnlp.deployment: Java WebStart

