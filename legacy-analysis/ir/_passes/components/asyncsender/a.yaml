records:
  - record_key: ASYNC-COMP-0001
    kind: entity
    capability_key: customer-communications
    requirement: >
      The AsyncSender component SHALL provide a stateless session EJB that enables asynchronous
      delivery of messages to a JMS queue, decoupling message senders from message consumers.
    confidence: high
    confidence_basis: >
      Declarative configuration in ejb-jar.xml explicitly declares session-type as Stateless
      and transaction-type as Container. Multiple callers (OrderEJBAction, AdminRequestBD) use
      the component consistently via the same local home interface pattern, confirming both
      the contract and the usage pattern across the application.
    risk_class: operational
    basis: >
      The component is structured as a J2EE stateless session bean with a single business
      method (sendAMessage). The deployment descriptor declares it as Stateless with
      Container-managed transactions. The bean is instantiated fresh for each call via
      the local home interface.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 46
        line_end: 68
        excerpt: |
          <session>
            <display-name>AsyncSenderJAR</display-name>
            <ejb-name>AsyncSenderEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender</local>
            <ejb-class>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 49
        line_end: 66
        excerpt: |
          public class AsyncSenderEJB implements SessionBean {
            private SessionContext sc;
            private Queue q;
            private QueueConnectionFactory qFactory;
            public AsyncSenderEJB() {}
            public void ejbCreate( ) throws CreateException {
              try {
                ServiceLocator serviceLocator = new ServiceLocator();
                qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
                q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.bean_type: StatelessSessionBean

  - record_key: ASYNC-INTF-0001
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL provide a local EJB interface (AsyncSender) with a single method
      sendAMessage(String message) to enable synchronous invocation of asynchronous message
      delivery from other EJB components within the same JVM.
    confidence: high
    confidence_basis: >
      The local interface is explicitly declared in ejb-jar.xml and the implementation in
      AsyncSender.java is used consistently across multiple callers. Both OrderEJBAction
      and AdminRequestBD obtain the home interface and create instances to call sendAMessage.
    risk_class: operational
    basis: >
      The AsyncSender interface defines a single business method that accepts a String
      parameter representing the message payload. The interface extends EJBLocalObject,
      restricting access to local (same JVM) invocations only. This prevents remote access
      and ensures tight coupling only within the same application container.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSender.java
        line_start: 44
        line_end: 47
        excerpt: |
          public interface AsyncSender extends EJBLocalObject {
              public void sendAMessage(String message);
          }
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 49
        line_end: 51
        excerpt: |
          <local-home>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome</local-home>
          <local>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender</local>
          <ejb-class>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderEJB</ejb-class>
    stack_metadata:
      ejb.interface_type: Local

  - record_key: ASYNC-MSG-0001
    kind: business-rule
    capability_key: customer-communications
    requirement: >
      The system SHALL send messages asynchronously to jms/AsyncSenderQueue via a JMS
      TextMessage containing the caller-provided payload, with each message delivered
      through a transacted queue session to ensure reliable delivery.
    confidence: high
    confidence_basis: >
      The sendAMessage implementation is explicit and enforced at the EJB implementation
      level. The code creates a transacted queue session (first parameter true in
      createQueueSession), creates a TextMessage, sets the text, and sends it. This pattern
      is enforced programmatically with no alternative path, making it high confidence.
    risk_class: operational
    basis: >
      In AsyncSenderEJB.sendAMessage(), the implementation creates a QueueConnection from
      the injected factory, creates a transacted session via qConnect.createQueueSession(true, 0),
      creates a TextMessage via session.createTextMessage(), sets the message text with the
      provided string, and sends it via qSender.send(jmsMsg). The true flag ensures transacted
      delivery.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;
            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
            }catch  (Exception e) {
              e.printStackTrace();
              throw new EJBException("askMDBToSendAMessage: Error!",e);
            } finally {
              try {
                        if( qConnect != null ) {
                  qConnect.close();
                        }
              } catch(Exception e) {}
                }
          }
    stack_metadata:
      jms.queue: jms/AsyncSenderQueue
      jms.session_type: Transacted
      jms.message_type: TextMessage

  - record_key: ASYNC-TXN-0001
    kind: business-rule
    capability_key: customer-communications
    requirement: >
      The sendAMessage method SHALL execute within a container-managed transaction context
      with transaction attribute Required, ensuring that message delivery participates in
      the transaction of the calling client or creates a new transaction if none exists.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml explicitly declares container-transaction with trans-attribute Required
      for the sendAMessage method. This is declarative configuration, the strongest form of
      evidence in J2EE deployments. The container enforces this at method invocation time.
    risk_class: operational
    basis: >
      The deployment descriptor specifies a container-transaction element that identifies
      the sendAMessage method specifically and sets its trans-attribute to Required. This
      means the container will create a new transaction if none exists, or enlist the message
      send within the existing transaction.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 122
        line_end: 132
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>AsyncSenderEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>sendAMessage</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.transaction: Required

  - record_key: ASYNC-JMS-0001
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL declare and manage JMS resources through JNDI references:
      jms/QueueConnectionFactory (javax.jms.QueueConnectionFactory) and jms/AsyncSenderQueue
      (javax.jms.Queue), with both resources configured as shareable and container-managed.
    confidence: high
    confidence_basis: >
      The resource references are declared in ejb-jar.xml with explicit res-type and
      res-auth attributes. The res-auth=Container indicates container-managed authentication.
      res-sharing-scope=Shareable indicates the resource is pooled and shared across multiple
      instances, which is standard J2EE practice.
    risk_class: operational
    basis: >
      The deployment descriptor declares both a resource-ref for QueueConnectionFactory and
      a resource-env-ref for the AsyncSenderQueue. The implementation looks up both via
      ServiceLocator during bean creation (ejbCreate method). The JNDI names are defined as
      java:comp/env/ prefixed names in JNDINames utility class.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 58
        line_end: 67
        excerpt: |
          <resource-ref>
            <res-ref-name>jms/QueueConnectionFactory</res-ref-name>
            <res-type>javax.jms.QueueConnectionFactory</res-type>
            <res-auth>Container</res-auth>
            <res-sharing-scope>Shareable</res-sharing-scope>
          </resource-ref>
          <resource-env-ref>
            <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
            <resource-env-ref-type>javax.jms.Queue</resource-env-ref-type>
          </resource-env-ref>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/util/JNDINames.java
        line_start: 51
        line_end: 60
        excerpt: |
          public static final String ASYNCSENDER_LOCAL_EJB_HOME =
                                               "java:comp/env/ejb/AsyncSender";
          public static final String QUEUE_CONNECTION_FACTORY =
                              "java:comp/env/jms/QueueConnectionFactory";
          public static final String ASYNC_SENDER_QUEUE =
                                        "java:comp/env/jms/AsyncSenderQueue";
    stack_metadata:
      jms.connection_factory: javax.jms.QueueConnectionFactory
      jms.queue: javax.jms.Queue

  - record_key: ASYNC-SEC-0001
    kind: requirement
    capability_key: customer-communications
    requirement: >
      All methods of the AsyncSenderEJB SHALL be accessible without authorization checks,
      and the bean SHALL use the caller's security identity (use-caller-identity) for any
      downstream security decisions.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml explicitly declares <use-caller-identity/> in the security-identity
      element and marks all methods with <unchecked/> in the method-permission assembly
      descriptor. This is declarative security configuration, the authoritative source for
      J2EE security policy.
    risk_class: operational
    basis: >
      The deployment descriptor specifies that the bean will propagate the caller's security
      context to any components it calls (like the JMS system). There are no role-based
      restrictions; all methods are unchecked, allowing any authenticated or unauthenticated
      caller to invoke sendAMessage.
