  - record_key: ASYNC-ERR-0001
    kind: business-rule
    capability_key: customer-communications
    requirement: >
      If any exception occurs during message creation or sending, the system SHALL catch
      the exception, log it via printStackTrace(), and throw a new EJBException with the
      original exception as the cause, preserving the stack trace for debugging.
    confidence: medium
    confidence_basis: >
      The error handling is explicit in the sendAMessage implementation, but the strategy
      (printStackTrace and rethrow as EJBException) provides only partial visibility.
      The printStackTrace writes to stderr, which may not be captured by all logging
      frameworks. This is a single-source implementation with no test coverage visible
      that validates the error path.
    risk_class: operational
    basis: >
      The sendAMessage method wraps all JMS operations in a try-catch block that catches
      the generic Exception type. When caught, the exception is printed to stderr via
      printStackTrace() and then wrapped in an EJBException with the message
      "askMDBToSendAMessage: Error!" and the original exception as the cause.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 80
        line_end: 90
        excerpt: |
          }catch  (Exception e) {
            e.printStackTrace();
            throw new EJBException("askMDBToSendAMessage: Error!",e);
          } finally {
            try {
                      if( qConnect != null ) {
                qConnect.close();
                      }
            } catch(Exception e) {}
              }
    stack_metadata:
      exception_handling: rethrow_as_ejbexception

  - record_key: ASYNC-RES-0001
    kind: business-rule
    capability_key: customer-communications
    requirement: >
      All JMS resources (QueueConnection, QueueSession, QueueSender) SHALL be properly
      cleaned up to prevent resource leaks. The QueueConnection SHALL be closed in a
      finally block after message delivery or error, while QueueSession and QueueSender
      are implicitly closed when the connection closes.
    confidence: high
    confidence_basis: >
      The implementation explicitly closes qConnect in a finally block, ensuring cleanup
      regardless of success or exception. This is a standard J2EE resource management pattern
      and is enforced at the code level with no alternative path. The local variables for
      session and sender are set to null initially, relying on connection closure for
      their cleanup.
    risk_class: operational
    basis: >
      The sendAMessage method creates QueueConnection, QueueSession, and QueueSender in
      sequence but only explicitly closes the connection. The connection closure implicitly
      closes the session and sender, which is per JMS specification. The finally block
      ensures this cleanup occurs even if an exception is thrown during message operations.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;
            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
            }catch  (Exception e) {
              e.printStackTrace();
              throw new EJBException("askMDBToSendAMessage: Error!",e);
            } finally {
              try {
                        if( qConnect != null ) {
                  qConnect.close();
                        }
              } catch(Exception e) {}
                }
          }
    stack_metadata:
      jms.resource_management: finally_block_cleanup

  - record_key: ASYNC-INIT-0001
    kind: business-rule
    capability_key: customer-communications
    requirement: >
      During bean creation (ejbCreate), the system SHALL look up and cache the JMS
      QueueConnectionFactory and Queue references from JNDI. If lookup fails, the system
      SHALL convert the ServiceLocatorException to an EJBException and prevent bean creation.
    confidence: high
    confidence_basis: >
      The ejbCreate lifecycle method is explicit and enforces this behavior. The implementation
      uses ServiceLocator (a common J2EE pattern) to perform lookups and wraps any
      ServiceLocatorException in an EJBException. This is the only path for bean creation,
      enforced by the container.
    risk_class: operational
    basis: >
      The AsyncSenderEJB.ejbCreate method is invoked by the container immediately after
      instantiation. It creates a ServiceLocator and calls getQueueConnectionFactory and
      getQueue, storing results in instance variables qFactory and q. If either lookup
      throws ServiceLocatorException, it is caught and wrapped in an EJBException with
      message "AsyncSenderEJB.ejbCreate failed".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 66
        excerpt: |
          public void ejbCreate( ) throws CreateException {
                try {
              ServiceLocator serviceLocator = new ServiceLocator();
              qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
              q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
                } catch (ServiceLocatorException sle) {
              throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
                }
          }
    stack_metadata:
      ejb.lifecycle_method: ejbCreate

  - record_key: ASYNC-USAGE-0001
    kind: workflow
    capability_key: customer-communications
    requirement: >
      GIVEN an order has been created and processed in the petstore application,
      WHEN the OrderEJBAction completes order processing,
      THEN the system SHALL obtain an AsyncSender instance via local home lookup,
      create the sender, send the PurchaseOrder XML representation as a message,
      and handle any ServiceLocatorException or CreateException by logging and suppressing
      the error (the order processing is not blocked).
    confidence: high
    confidence_basis: >
      The OrderEJBAction code explicitly shows this pattern being used after order creation.
      The AdminRequestBD also uses the same pattern for order approvals. Both callers handle
      exceptions the same way (printStackTrace and continue), indicating this is the expected
      usage pattern.
    risk_class: operational
    basis: >
      OrderEJBAction.java contains a try block that obtains the AsyncSenderLocalHome via
      ServiceLocator, creates an instance, and calls sendAMessage with purchaseOrder.toXML().
      Exceptions (ServiceLocatorException, CreateException) are caught and printed but not
      rethrown, meaning the order is successfully created even if async notification fails.
      The same pattern appears in AdminRequestBD for order approvals.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 1
        line_end: 5
        excerpt: |
          // async component imports
          import com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome;
          import com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender;
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 1
        line_end: 1
        excerpt: |
          AsyncSenderLocalHome home = (AsyncSenderLocalHome) ServiceLocator.getInstance().getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
          AsyncSender sender= home.create();
          sender.sendAMessage(oa.toXML());

  - record_key: ASYNC-DEST-0001
    kind: business-rule
    capability_key: customer-communications
    requirement: >
      The AsyncSenderQueue destination maps to application-specific queue names:
      jms/opc/OrderQueue in the petstore application and jms/opc/OrderApprovalQueue
      in the admin application, allowing the same AsyncSender bean to deliver messages
      to different downstream consumers based on deployment context.
    confidence: high
    confidence_basis: >
      The mapping is declared in the application server configuration files
      (sun-j2ee-ri.xml) for each application (petstore and admin). The resource-env-ref
      binding shows a consistent pattern where the logical JNDI name jms/AsyncSenderQueue
      is mapped to a physical queue based on application context.
    risk_class: operational
    basis: >
      Both the petstore and admin application server configuration files declare a
      resource-env-ref that binds jms/AsyncSenderQueue (the logical name used in the
      component) to a physical queue name specific to each application (OrderQueue in
      petstore, OrderApprovalQueue in admin).
    traces:
