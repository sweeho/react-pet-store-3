records:
  - record_key: order-workflow-entity-0001
    kind: entity
    capability_key: order-workflow
    requirement: >
      The system SHALL maintain a PurchaseOrder entity with the following attributes:
      OrderId (unique identifier), UserId, EmailId, OrderDate, Locale, TotalPrice,
      and relationships to ContactInfo, CreditCard, and LineItems.
    confidence: high
    confidence_basis: >
      Declared in DTD schema, ejb-jar.xml CMP field definitions, and Java entity bean
      with multiple enforcement points (DDL constraints, CMP metadata, and programmatic
      validation in ejbCreate).
    risk_class: operational
    basis: >
      PurchaseOrder.dtd defines the element structure; ejb-jar.xml declares CMP fields
      and relationships at lines 60-112; PurchaseOrderEJB.java defines abstract accessor
      methods at lines 79-181.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 42
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShippingInfo, BillingInfo, TotalPrice, CreditCard, LineItem+)>
          <!ATTLIST PurchaseOrder
            locale CDATA "en_US"
          >
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 60
        line_end: 83
        excerpt: |
          <cmp-field>
            <field-name>poId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poUserId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poEmailId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poDate</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poLocale</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>poValue</field-name>
          </cmp-field>
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      db.object: PurchaseOrder CMP 2.x Entity Bean

  - record_key: order-workflow-rel-0001
