  - record_key: customer-management-cookie-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      GIVEN the user checks "remember username", WHEN the sign-on form is submitted,
      THEN the system SHALL set a cookie named bp_signon with the userName value,
      with a maximum age of 2678400 seconds (31 days).
    confidence: high
    confidence_basis: >
      The cookie logic is explicitly implemented in SignOnFilter.validateSignOn()
      with clear variable names and the 2678400 magic number is present in the code.
    risk_class: presentational
    basis: >
      SignOnFilter.validateSignOn() checks for REMEMBER_USERNAME request parameter.
      If present, it creates a Cookie with name bp_signon and userName value, sets
      maxAge to 2678400 seconds, and adds it to the response.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 167
        line_end: 186
        excerpt: |
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
          } else {
              // see if the cookie exists and remove accordingly
              Cookie[] cookies = hreq.getCookies();
              if (cookies != null) {
                  for (int loop=0; loop < cookies.length; loop++) {
                      if (cookies[loop].getName().equals(COOKIE_NAME)) {
                          cookies[loop].setMaxAge(0);
                          hres.addCookie(cookies[loop]);
                      }
                  }
              }
          }
    stack_metadata:
      framework: Servlet

