  - record_key: UIDGEN-STK-0001
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The UniqueIdGenerator component SHALL be deployed as a stateless session bean
      that maintains no conversational state between invocations.
    confidence: high
    confidence_basis: >
      Session type is declared in ejb-jar.xml as Stateless. No instance variables
      persist across method invocations except for initialization-time JNDI lookups.
      This is a deployment-level constraint enforced by the EJB container.
    risk_class: operational
    basis: >
      The UniqueIdGeneratorEJB declares session-type=Stateless in ejb-jar.xml.
      The bean stores a single InitialContext and CounterLocalHome reference at
      create time (lines 56-62 of UniqueIdGeneratorEJB.java) but has no business
      state that would violate statefulness.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 71
        line_end: 90
        excerpt: |
          <session>
            <display-name>UniqueIdGeneratorEB</display-name>
            <ejb-name>UniqueIdGeneratorEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>

  - record_key: UIDGEN-INT-0001
    kind: integration
    capability_key: order-workflow
    requirement: >
      The UniqueIdGenerator SHALL locate the Counter entity via local JNDI reference
      java:comp/env/ejb/Counter at initialization time and cache the home interface
      reference for the lifetime of the session bean instance.
    confidence: high
    confidence_basis: >
      JNDI lookup is explicit in ejbCreate() (lines 57-61). The lookup happens exactly
      once and the result is stored in an instance variable. EJBException is thrown
      if the lookup fails, ensuring initialization failures are detected immediately.
    risk_class: operational
    basis: >
      UniqueIdGeneratorEJB.ejbCreate() performs InitialContext lookup for
      "java:comp/env/ejb/Counter" and casts the result to CounterLocalHome.
      The ejb-jar.xml declares this binding via ejb-local-ref.
    traces:
