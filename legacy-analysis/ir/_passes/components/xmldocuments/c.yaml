  - record_key: XMLDOC-SCHEMA-0008
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The TPA Invoice document SHALL define a namespaced XML structure with namespace
      URI "http://blueprints.j2ee.sun.com/TPAInvoice" and prefix "tpai". The document
      SHALL contain OrderId, UserId, OrderDate, ShippingDate, and a LineItems container
      with one or more line items from the TPALineItem namespace. Line item IDs MUST
      be unique within a single invoice (enforced by XSD unique constraint).
    confidence: high
    confidence_basis: >
      TPAInvoice.xsd declares all schema elements with namespace support and defines
      an explicit unique constraint on itemId attribute. The TPAInvoiceXDE.java class
      implements both DTD and XSD validation with namespace handling.
    risk_class: operational
    basis: >
      TPAInvoice.xsd (lines 3-33) defines the Invoice element in namespace
      "http://blueprints.j2ee.sun.com/TPAInvoice" with elements OrderId, UserId,
      OrderDate, ShippingDate, and LineItems. LineItems references tpali:LineItem
      (line 21) with minOccurs=1 and maxOccurs=unbounded. A unique constraint
      (lines 24-26) enforces itemId uniqueness via xpath selector and field.
      TPAInvoiceXDE.java (lines 58-64) defines corresponding PUBLIC ID, namespace,
      and XSD system IDs.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPAInvoice.xsd
        line_start: 1
        line_end: 33
        excerpt: |
          <?xml version="1.0" encoding="UTF-8"?>

          <xsd:schema xmlns:xsd="http://www.w3.org/2001/XMLSchema"
                  targetNamespace="http://blueprints.j2ee.sun.com/TPAInvoice"
                  xmlns="http://blueprints.j2ee.sun.com/TPAInvoice"
          	xmlns:tpali="http://blueprints.j2ee.sun.com/TPALineItem"
          	elementFormDefault="qualified">

          	<xsd:import namespace="http://blueprints.j2ee.sun.com/TPALineItem" schemaLocation="TPALineItem.xsd" />

          	<xsd:element name="Invoice">
          		<xsd:complexType>
          			<xsd:sequence>
          				<xsd:element name="OrderId" type="xsd:string" />
          				<xsd:element name="UserId" type="xsd:string" />
          				<xsd:element name="OrderDate" type="xsd:date" />
          				<xsd:element name="ShippingDate" type="xsd:date" />
          				<xsd:element name="LineItems">
          					<xsd:complexType>
          						<xsd:sequence>
          					   		<xsd:element ref="tpali:LineItem" minOccurs="1" maxOccurs="unbounded" />
          						</xsd:sequence>
          					</xsd:complexType>
                      <xsd:unique name="itemIdUniqueness">
                          <xsd:selector xpath="tpali:LineItem"/>
                          <xsd:field xpath="@itemId"/>
                      </xsd:unique>
          				</xsd:element>
          			</xsd:sequence>
          		</xsd:complexType>
          	</xsd:element>

          </xsd:schema>
    stack_metadata:
      framework: JAXP (XSD validation)
      declarative_validator: XSD (TPAInvoice.xsd)

