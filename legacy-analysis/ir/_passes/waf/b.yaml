  - record_key: WAF-ENTITY-0001
    kind: entity
    capability_key: admin-dashboard
    requirement: >
      Event objects SHALL contain an EJBActionClassName property that is set
      by the RequestProcessor based on the event-mapping configuration, and SHALL
      be used by the EJB tier to route events to the appropriate handler.
    confidence: high
    confidence_basis: >
      Event class is explicitly constructed and used in RequestProcessor.processRequest().
      The EJBActionClassName property is set and read from mappings. Code shows this
      clearly as a two-pass operation: find mapping, set class name, pass to controller.
    risk_class: operational
    basis: >
      RequestProcessor retrieves the EventMapping for the generated Event using
      getEventMapping(ev), then calls ev.setEJBActionClassName(eventMapping.getEJBActionClassName())
      before passing it to the WebController. The Event class carries this property
      to the EJB tier for routing.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/RequestProcessor.java
        line_start: 103
        line_end: 111
        excerpt: |
          private EventMapping getEventMapping(Event eventClass) {
              // get the fully qualified name of the event class
              String eventClassName = eventClass.getClass().getName();
              if ((eventMappings != null) && eventMappings.containsKey(eventClassName)) {
                  return (EventMapping)eventMappings.get(eventClassName);
              } else {
                  return null;
              }
          }
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/RequestProcessor.java
        line_start: 132
        line_end: 138
        excerpt: |
          if (ev != null) {
             // set the ejb action class name on the event
              EventMapping eventMapping = getEventMapping(ev);
              if (eventMapping != null) {
                      ev.setEJBActionClassName(eventMapping.getEJBActionClassName());
              }
    stack_metadata:
      domain-object: Event
      properties: ["EJBActionClassName"]

  - record_key: WAF-SCREEN-0001
    kind: screen
    capability_key: admin-dashboard
    requirement: >
      The TemplateServlet SHALL render screen definitions referenced by URL mappings,
      accepting a *.screen extension, and MAY optionally cache previous screen
      attributes and parameters if configured.
    confidence: high
    confidence_basis: >
      TemplateServlet is declared in web.xml with servlet-mapping for *.screen.
      Init parameters control caching behavior (cache_previous_screen_attributes,
      cache_previous_screen_parameters). Both config + code confirm this.
    risk_class: presentational
    basis: >
