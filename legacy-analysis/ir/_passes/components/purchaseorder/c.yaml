  - record_key: order-workflow-datequery-0001
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      The system SHALL support querying PurchaseOrders by a date range via the
      findPOBetweenDates method, which returns all PurchaseOrders with OrderDate
      between two timestamp values (inclusive).
    confidence: high
    confidence_basis: >
      ejb-jar.xml defines an EJB-QL query at lines 117-127 with findPOBetweenDates
      method accepting two long parameters; the query uses BETWEEN operator on poDate.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 117-127 define the query method and its implementation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 117
        line_end: 127
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findPOBetweenDates</method-name>
              <method-params>
                <method-param>long</method-param>
                <method-param>long</method-param>
              </method-params>
            </query-method>
            <ejb-ql>SELECT OBJECT(a) From PurchaseOrder a WHERE a.poDate BETWEEN ?1 AND ?2</ejb-ql>
          </query>
    stack_metadata:
      ejb.query: EJB-QL
      ejb.bean: PurchaseOrderEJB

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: >
      Line 268 in PurchaseOrderEJB.getData() sets both billingInfo and shippingInfo
      to the same ContactInfo object (purchaseOrder.getBillingInfo()); the comment "// XXX"
      suggests this is a known issue. It is unclear whether this is intentional or a bug.
      The DTD and design suggest they should be distinct, but the implementation conflates them.
