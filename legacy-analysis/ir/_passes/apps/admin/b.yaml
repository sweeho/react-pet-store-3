  - record_key: admin-dashboard-0001
    kind: requirement
    capability_key: admin-dashboard
    requirement: >
      The system SHALL provide analytics functionality that aggregates order
      and revenue data for a specified date range. For REVENUE request type,
      the system SHALL sum the product of (quantity × unit price) for each
      line item. For ORDERS request type, the system SHALL sum quantities.
      Results SHALL be aggregated by product category when no category filter
      is specified, or by individual item when a specific category is selected.
    confidence: high
    confidence_basis: >
      Analytics logic is implemented in OPCAdminFacadeEJB.getChartInfo()
      with explicit conditional logic for REVENUE vs ORDERS aggregation.
      ApplRequestProcessor.getChartInfo() handles client requests and
      formatting. Both implementations show clear intent and consistent
      calculation approach. Single authoritative source but comprehensive.
    risk_class: presentational
    basis: >
      OPCAdminFacadeEJB.getChartInfo() retrieves purchase orders between
      start and end dates, iterates over line items, and accumulates values
      into HashMap keyed by category or item ID. For REVENUE: sums
      (quantity × unit_price). For ORDERS: sums quantity. Results returned
      as Map. ApplRequestProcessor.getChartInfo() parses XML request with
      Start, End, ReqCategory elements, calls getChartInfo(), iterates
      Map entries, and returns XML with Category or Item elements containing
      values plus TotalSales aggregate.
