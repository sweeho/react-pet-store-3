  - record_key: SUPPLIER_INTEGRATION-INTEGRATION-0001
    kind: integration
    capability_key: supplier-integration
    requirement: >
      XML Document Editor Factory SHALL instantiate document-type-specific editors
      (XMLDocumentEditor implementations) by looking up editor class names in a
      properties catalog keyed by schema URI. Factory SHALL load the catalog from a URL
      and throw XMLDocumentException if mapping not found for a given schema.
    confidence: high
    confidence_basis: >
      The factory pattern is directly implemented in XMLDocumentEditorFactory class
      with public getXDE(String schemaURI) method and loadable properties catalog.
    risk_class: operational
    basis: >
      XMLDocumentEditorFactory loads a properties file at construction time that maps
      schema URIs to XMLDocumentEditor implementation class names. The getXDE() method
      looks up the schema URI and instantiates the corresponding class via reflection.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditorFactory.java
        line_start: 45
        line_end: 75
        excerpt: |
          public class XMLDocumentEditorFactory {
            private Properties xdeCatalog = new Properties();

            public XMLDocumentEditorFactory() {}

            public XMLDocumentEditorFactory(URL catalogURL) throws XMLDocumentException {
              try {
                xdeCatalog.load(catalogURL.openStream());
              } catch (IOException exception) {
                throw new XMLDocumentException("Can't load from resource: " + catalogURL, exception);
              }
            }

            public XMLDocumentEditor getXDE(String schemaURI) throws XMLDocumentException {
              String className = xdeCatalog.getProperty(schemaURI);
              if (className != null) {
                return createXDE(className);
              }
              throw new XMLDocumentException("No mapping for schema: " + schemaURI);
            }

            public XMLDocumentEditor createXDE(String className) throws XMLDocumentException {
              try {
                return (XMLDocumentEditor) Class.forName(className).newInstance();
              } catch(Exception exception) {
                throw new XMLDocumentException("Can't instantiate XDE: " + className, exception);
              }
            }
    stack_metadata:
      framework: J2EE factory pattern
      db.object: XML document editor catalog

