  - record_key: order-workflow-requirement-0010
    kind: requirement
    capability_key: order-workflow
    requirement: >
      The system SHALL support lookup of environment entries (JNDI-configured String,
      Boolean, and URL values) to enable externalized configuration of system parameters
      such as feature flags and external service URLs.
    confidence: medium
    confidence_basis: >
      Both ServiceLocator implementations provide getBoolean(), getString(), and getUrl()
      methods for environment entry lookups. However, the requirements comment mentions
      SEND_CONFIRMATION_MAIL property but no declarative configuration (faces-config.xml,
      web.xml env-entry) was reviewed to confirm these entries are actually defined.
      The code is present and would work if the entries are configured in deployment
      descriptor.
    risk_class: operational
    basis: >
      The getBoolean(), getString(), and getUrl() methods in both ServiceLocator
      implementations (ejb lines 200-243, web lines 261-304) perform JNDI lookup of
      environment entries with type casting and exception handling.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 217
        line_end: 243
        excerpt: |
          public boolean getBoolean(String envName) throws ServiceLocatorException {
            Boolean bool = null;
            try {
              bool = (Boolean)ic.lookup(envName);
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
            return bool.booleanValue();
          }

          public String getString(String envName) throws ServiceLocatorException {
            String envEntry = null;
            try {
              envEntry = (String)ic.lookup(envName);
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
