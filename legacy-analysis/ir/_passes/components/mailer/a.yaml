  - record_key: CUST-COMM-REQ-0003
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL create a MIME email message and send it via J2EE mail
      services using the JNDI-looked-up mail session.
    confidence: high
    confidence_basis: >
      Both the ejb-jar.xml resource-ref declaration and the MailHelper implementation
      confirm that mail delivery is mandatory. JNDI lookup is the only path to
      obtain a mail session; there is no fallback mechanism.
    risk_class: operational
    basis: >
      The ejb-jar.xml declares a required resource-ref for mail/MailSession.
      MailHelper.createAndSendMail performs JNDI lookup of JNDINames.MAIL_SESSION
      and constructs a MimeMessage. Transport.send is used to dispatch.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 58
        line_end: 63
        excerpt: |
          <resource-ref>
             <res-ref-name>mail/MailSession</res-ref-name>
             <res-type>javax.mail.Session</res-type>
             <res-auth>Container</res-auth>
             <res-sharing-scope>Shareable</res-sharing-scope>
           </resource-ref>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 70
        line_end: 85
        excerpt: |
          public void createAndSendMail(String emailAddress, String subject, String mailContent, Locale locale) throws MailerAppException {
              try {
                  InitialContext ic = new InitialContext();
                  Session session = (Session) ic.lookup(JNDINames.MAIL_SESSION);
              Message msg = new MimeMessage(session);
                  msg.setFrom();
                  msg.setRecipients(Message.RecipientType.TO,
                           InternetAddress.parse(emailAddress, false));
                  msg.setSubject(subject);
                  String contentType = "text/html";
                      StringBuffer sb = new StringBuffer(mailContent);
                    msg.setDataHandler(new DataHandler(
                                        new ByteArrayDataSource(sb.toString(), contentType)));
                  msg.setHeader("X-Mailer", "JavaMailer");
                  msg.setSentDate(new Date());
                  Transport.send(msg);
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/util/JNDINames.java
        line_start: 49
        line_end: 50
        excerpt: |
          public static final String MAIL_SESSION =
                "java:comp/env/mail/MailSession";
    stack_metadata:
      ejb.bean: message-driven
      jndi.resource: mail/MailSession

