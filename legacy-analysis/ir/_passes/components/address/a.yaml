records:
  - record_key: ADDRESS-ENTITY-0001
    kind: entity
    capability_key: order-checkout
    requirement: >
      The system SHALL provide an Address entity with persistent storage for
      street name (line 1), street name (line 2 optional), city, state,
      zip code, and country fields.
    confidence: high
    confidence_basis: >
      Address fields are declared as CMP fields in ejb-jar.xml (lines 180-203)
      and implemented as abstract getters/setters in AddressEJB.java. The
      DTD schema confirms field structure. Both declarative and programmatic
      sources agree on the complete field set. Multiplicity and nullability
      inferred from optional streetName2 and no NOT NULL constraints in schema.
    risk_class: operational
    basis: >
      CMP field declarations in ejb-jar.xml define the persistent data model.
      DTD Address.dtd defines XML serialization structure matching the entity
      fields. Address.java class methods serialize to/from DOM with matching
      field order.
