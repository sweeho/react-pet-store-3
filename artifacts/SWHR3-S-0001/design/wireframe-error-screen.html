<!doctype html>
<html>
<head><meta charset="utf-8"><title>Error screen</title>
<style>
body{margin:0;background:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3f3f46}
.page{width:720px;margin:0 auto}
.chrome{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e4e4e7;padding:10px 16px;background:#fafafa}
.logo{width:96px;height:20px;background:#d4d4d8;border-radius:4px;flex:none}
.navbars{display:flex;gap:10px;flex:1}
.navbar{width:52px;height:8px;background:#e4e4e7;border-radius:4px}
.search{width:150px;height:26px;border:1px solid #d4d4d8;border-radius:6px;background:#fff;display:flex;align-items:center;padding:0 8px;font-size:10px;color:#a1a1aa;flex:none}
.body{padding:44px 16px}
.wrap{max-width:480px;margin:0 auto;text-align:center}
.mark{width:38px;height:38px;border-radius:50%;border:1px solid #a1a1aa;background:#fafafa;margin:0 auto 16px}
.h1{font-size:19px;font-weight:700;color:#27272a;margin:0 0 8px}
.msg{font-size:12px;line-height:1.6;color:#52525b;margin:0 0 20px}
.link{font-size:11px;color:#52525b;text-decoration:underline}
.det{margin-top:26px;border:1px solid #e4e4e7;border-radius:8px;background:#fafafa;padding:12px 14px;text-align:left}
.dethead{font-size:10px;font-weight:600;color:#71717a;margin:0 0 9px;display:flex;align-items:center;gap:6px}
.bar{height:7px;background:#e4e4e7;border-radius:4px;margin-bottom:6px}
</style></head>
<body>
<div class="page">
  <div class="chrome">
    <div class="logo"></div>
    <div class="navbars"><div class="navbar"></div><div class="navbar"></div><div class="navbar"></div><div class="navbar"></div><div class="navbar"></div></div>
    <div class="search">Search</div>
  </div>

  <div class="body">
    <div class="wrap">
      <div class="mark"></div>
      <div class="h1">Something Went Wrong</div>
      <div class="msg">The request could not be completed. Please return to the previous page and try again.</div>
      <div><span class="link">&#8592; Return to the previous page</span></div>

      <div class="det">
        <div class="dethead"><span>&#9656;</span> Error details</div>
        <div class="bar" style="width:100%"></div>
        <div class="bar" style="width:86%"></div>
        <div class="bar" style="width:54%"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
