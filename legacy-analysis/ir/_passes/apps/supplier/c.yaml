  - record_key: SUPP-RULE-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      An order that has been fully fulfilled (all line items shipped) SHALL have its
      status set to COMPLETED. An order where at least one line item cannot be fulfilled
      SHALL remain in PENDING status for retry.
    confidence: high
    confidence_basis: >
      processAnOrder checks allItemsAvailable flag (line 178), set to true initially.
      When checkInventory fails for any item, allItemsAvailable is set to false (line 190)
      and processing continues. At the end (lines 197-198), po.setPoStatus(COMPLETED) is
      called ONLY if allItemsAvailable is true. If any item fails, the condition is never
      met and status is not updated. Comment at line 240-241 confirms retry on PENDING.
    risk_class: operational
    basis: >
      processAnOrder boolean allItemsAvailable starts as true (line 178). Line 190 sets
      it to false when checkInventory fails. Line 197 checks if(allItemsAvailable) before
      calling po.setPoStatus(COMPLETED). If at least one item fails inventory check,
      allItemsAvailable remains false and status is not updated, leaving order in PENDING.
      processPendingPO finds orders with PENDING status (line 251) and retries them.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      order.status: PENDING,COMPLETED

