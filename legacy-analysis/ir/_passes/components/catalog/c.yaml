  - record_key: CATALOG-WORKFLOW-0003
    kind: workflow
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support full-text search of items by keyword. GIVEN a search query string,
      WHEN the query is tokenized into keywords, THEN return all items matching ANY keyword in
      name, category id, or description fields.
    confidence: medium
    confidence_basis: >
      Search implementation is in GenericCatalogDAO.searchItems (lines 343-398). The logic is clear:
      tokenize query into keywords, build parameter array with locale and 3 parameters per keyword
      (wildcard-wrapped), execute variable-clause SQL. Medium confidence because the tokenizer uses
      StringTokenizer (line 346) with default delimiters (whitespace), which may differ from intent.
      The clause matching order (name OR catid OR descn, repeated for each keyword) is not explicitly
      stated in requirements.
    risk_class: operational
    basis: >
      GenericCatalogDAO.searchItems (lines 343-398) tokenizes search query using StringTokenizer.
      For each keyword found, creates SQL LIKE wildcard patterns with '%' surrounding the keyword.
      Parameter array structure: parameterValues[0] = locale, then for each keyword i:
      parameterValues[(i*3)+1] = "%" + keyword + "%", etc. (lines 359-365).
      SQL query (CatalogDAOSQL.xml lines 112-127) searches in name, catid, description with
      OR operator and variable clause repetition for multiple keywords.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 375
        excerpt: |
          public Page searchItems(String searchQuery, int start, int count, Locale locale)
            throws CatalogDAOSysException {
              Collection keywordSet = new HashSet();
              StringTokenizer tokenizer = new StringTokenizer(searchQuery);
              while (tokenizer.hasMoreTokens()) {
                keywordSet.add(tokenizer.nextToken());
              }
              if (keywordSet.isEmpty()) {
                return Page.EMPTY_PAGE;
              }
              String[] keywords = (String[]) keywordSet.toArray(new String[0]);
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[1 + (keywords.length * 3)];
                  parameterValues[0] = locale.toString();
                  for (int i = 0; i < keywords.length; i++) {
                      parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
                      parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
                      parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
        line_end: 127
        excerpt: |
          <SQLStatement method="SEARCH_ITEMS">
              <SQLFragment parameterNb="4">
                  select catid, a.productid, name, a.itemid, b.image, b.descn, attr1,
                          attr2, attr3, attr4, attr5, listprice, unitcost
                      from (((item a join item_details b on a.itemid=b.itemid)
                          join product_details c on a.productid=c.productid)
                          join product d on d.productid=c.productid and b.locale = c.locale)
                      where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
              <SQLFragment parameterNb="3" occurrence="VARIABLE">
                  or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)

