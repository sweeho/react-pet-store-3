  - record_key: supplier-integration-creation-0001
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      A Supplier Order SHALL be created from a populated SupplierOrder value object containing
      order ID, order date, and shipping contact information. WHEN the EJB create() method is
      called with the value object, THEN the ejbPostCreate() method SHALL automatically create
      and associate the related ContactInfo and LineItem entities.
    confidence: high
    confidence_basis: >
      SupplierOrderEJB.ejbCreate() (lines 151-156) populates the CMP fields from the
      SupplierOrder value object and sets initial status to PENDING. ejbPostCreate() (lines
      162-184) is explicitly called to set up relationships with ContactInfo and LineItems using
      ServiceLocator. The pattern follows standard EJB 2.x entity bean lifecycle with
      ejbCreate followed by ejbPostCreate for relationship initialization.
    risk_class: operational
    basis: >
      SupplierOrderEJB.ejbCreate() (lines 151-156) receives a SupplierOrder value object
      and extracts orderId, orderDate, and status. ejbPostCreate() (lines 162-184) uses ServiceLocator
      to look up and create ContactInfo entity from the supplied contact info, then creates LineItem
      entities for each line item in the order, associating them via addLineItem().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 184
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }

          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                              throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);
              LineItemLocalHome lineItemref = (LineItemLocalHome)
                  serviceLocator.getLocalHome(JNDINames.LI_EJB);
              Collection litems = supplierOrder.getLineItems();
              Iterator it = litems.iterator();
              while((it != null) && (it.hasNext())) {
                LineItem li = (LineItem) it.next();
                LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
                addLineItem(lineItemloc);
              }
            } catch(ServiceLocatorException ne) {
              throw new CreateException("ServiceLocator Ex while persisting PO CMR :" +
                                        ne.getMessage());
            }
          }
    stack_metadata:
      ejb.lifecycle: ejbCreate, ejbPostCreate

