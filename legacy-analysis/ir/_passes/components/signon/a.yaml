records:
  - record_key: CUST-AUTH-0001
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL authenticate a user by verifying the supplied username and
      password against the stored user record.
    confidence: high
    confidence_basis: >
      Both passes will find this in SignOnEJB.authenticate(), which is the core
      authentication logic called by the SignOnFilter. The requirement is enforced
      in both programmatic (authenticate method) and declarative (session attribute
      SIGNED_ON_USER) layers.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate() method takes userName and password, looks up the user
      by primary key, and calls user.matchPassword(password) to verify credentials.
      Returns false if user not found (FinderException caught).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 68
        line_end: 78
        excerpt: |
          /**
           * business method used to check if a user is allowed to sign on
           */
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }

  - record_key: CUST-AUTH-0002
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL create a new user account when provided with a username and
      password during registration.
    confidence: high
    confidence_basis: >
      The createUser method appears in both SignOnEJB and the HTTP entry point
      (CreateUserServlet), providing independent verification of the requirement
      across the architecture layers.
    risk_class: operational
    basis: >
      SignOnEJB.createUser() delegates to UserLocalHome.create(userName, password).
      CreateUserServlet extracts form parameters and invokes SignOnEJB.createUser().
      User entity is created with CMP fields userName and password.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 79
        line_end: 82
        excerpt: |
          /** business method to called to create new users **/
          public void createUser(String userName, String password) throws CreateException {
            UserLocal user = ulh.create(userName, password);
          }

