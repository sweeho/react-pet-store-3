  - record_key: customer-management-userid-length-0001
    kind: business-rule
    capability_key: customer-management
    requirement: >
      The system SHALL reject user creation if the userName exceeds 25 characters.
    confidence: high
    confidence_basis: >
      The constraint is defined as a static constant MAX_USERID_LENGTH in UserLocal
      interface and enforced in UserEJB.ejbCreate() with explicit validation and
      CreateException thrown on violation.
    risk_class: operational
    basis: >
      UserLocal defines MAX_USERID_LENGTH = 25 as a public constant. UserEJB.ejbCreate()
      checks userName.length() > MAX_USERID_LENGTH and throws CreateException with
      an explicit message if violated.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserLocal.java
        line_start: 46
        line_end: 47
        excerpt: |
          public static final int MAX_USERID_LENGTH = 25;
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 64
        line_end: 67
        excerpt: |
          if(userName.length() > UserLocal.MAX_USERID_LENGTH) {
              throw new CreateException("User ID cant be more than " +
              UserLocal.MAX_USERID_LENGTH + " chars long");
          }
    stack_metadata:
