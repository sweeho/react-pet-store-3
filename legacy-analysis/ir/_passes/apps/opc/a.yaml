  # Customer Communications
  - record_key: CC-INT-0001
    kind: integration
    capability_key: customer-communications
    requirement: >
      The system SHALL send email notifications to customers for order approval, invoice receipt, and
      order completion.
      GIVEN an order is approved or denied
      WHEN the status change is processed
      THEN the system SHALL queue a message to the customer relations mail queue with order status.
      GIVEN an invoice is received and processed
      WHEN all items are shipped and order is COMPLETED
      THEN the system SHALL send completion notification to customer.
    confidence: medium
    confidence_basis: >
      Three dedicated customer relations MDBs exist (MailInvoiceMDB, MailOrderApprovalMDB, MailCompletedOrderMDB)
      that listen to specific JMS queues. Environment entries (param/SendConfirmationMail, param/SendApprovalMail,
      param/SendCompletedOrderMail) control whether emails are sent. However, the actual email implementation
      is in the mailer-ejb.jar module which is separate, so only the queueing mechanism is visible in OPC code.
    risk_class: operational
    basis: >
      ejb-jar.xml defines MailInvoiceMDB, MailOrderApprovalMDB, MailCompletedOrderMDB message-driven beans.
      sun-j2ee-ri.xml maps these to queues (jms/InvoiceTopic, jms/MailOrderApprovalQueue, jms/MailCompletedOrderQueue).
      env-entry values (param/SendConfirmationMail etc.) are booleans that gate whether mail is sent.
      Transition delegates route approval and completion messages to mail queues.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
        line_start: 404
        line_end: 490
        excerpt: |
          <!-- CUSTOMER RELATIONS Process recieving an INVOICE from the Suppler Start-->
          <message-driven>
            <description>opc node to process Invoice from the Supplier</description>
            <display-name>MailInvoiceMDB</display-name>
