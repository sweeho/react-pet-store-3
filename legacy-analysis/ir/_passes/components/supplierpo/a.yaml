  - record_key: supplier-integration-business-rule-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      When a line item quantity is shipped, the system SHALL track the
      quantityShipped field separately from the requested quantity, allowing
      partial shipments.
    confidence: medium
    confidence_basis: >
      LineItem CMP fields include both quantity and quantityShipped. Container-
      transaction methods setQuantityShipped and getQuantityShipped are declared,
      confirming the field is updatable. However, no business logic validates
      or constrains the relationship between these two fields (e.g., that
      quantityShipped <= quantity).
    risk_class: operational
    basis: >
      ejb-jar.xml LineItem definition includes two fields:
      - quantity (requested quantity)
      - quantityShipped (amount shipped)
      Both can be independently set via container methods, suggesting support
      for partial shipments.
