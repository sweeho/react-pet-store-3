records:
  - record_key: SC-REQUIREMENT-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL provide a stateful shopping cart session bean that maintains
      a collection of items during a user's browsing and purchasing session.
    confidence: high
    confidence_basis: >
      Both the EJB interface (ShoppingCartLocal) and implementation (ShoppingCartLocalEJB)
      consistently define this behavior. The ejb-jar.xml declares a Stateful session bean
      with transaction management, and the HashMap storage pattern is enforced in two
      independent places. This is the foundational requirement for the entire component.
    risk_class: operational
    basis: >
      The ShoppingCartLocalEJB class implements a stateful EJB with a HashMap field that
      persists cart state. The ShoppingCartLocal interface exposes methods for item
      manipulation. The ejb-jar.xml defines the EJB as session-type=Stateful.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 62
        line_end: 70
        excerpt: |
          public class ShoppingCartLocalEJB implements SessionBean {
              private HashMap cart;
              // default to the US English
              private Locale locale = Locale.US;
              public ShoppingCartLocalEJB() {
                  cart = new HashMap();
              }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/ejb-jar.xml
        line_start: 47
        line_end: 54
        excerpt: |
          <session>
            <display-name>ShoppingCartSB</display-name>
            <ejb-name>ShoppingCartEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.cart.ejb.ShoppingCartLocalEJB</ejb-class>
            <session-type>Stateful</session-type>

