  - record_key: ADMIN-DASH-0002
    kind: requirement
    capability_key: admin-dashboard
    requirement: >
      Chart data retrieval SHALL support two query modes: REVENUE mode (aggregates quantity × unit price)
      and ORDERS mode (aggregates line item quantities). Both modes MAY be filtered by category ID or
      aggregated across all categories.
    confidence: high
    confidence_basis: >
      The getChartInfo() method explicitly implements both REVENUE and ORDERS logic paths with category
      filtering. The code clearly shows the dual aggregation approach (Float for revenue, Integer for quantity).
      The implementation is complete and shows the exact conditional logic.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB.getChartInfo() uses the request parameter to determine aggregation mode. When categ is null,
      results are aggregated by categoryId. When categ is specified, results are aggregated by itemId within that
      category. Revenue is calculated as quantity × unitPrice; quantities are summed directly.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 193
        line_end: 245
        excerpt: |
          if(request.equals("REVENUE")) {
            if(categ == null) {
              id = loc.getCategoryId();
              if(chartDetails.containsKey(id)) {
                tmpValue = (Float) chartDetails.get(id);
                chartDetails.put(id,
                     new Float(tmpValue.floatValue() +
                     (loc.getQuantity()*loc.getUnitPrice())));
              } else {
                chartDetails.put(id, new Float((loc.getQuantity()*
                                                        loc.getUnitPrice())));
              }
            } else {
              if(loc.getCategoryId().equals(categ)) {
                id = loc.getItemId();
                if(chartDetails.containsKey(id)) {
                  tmpValue = (Float) chartDetails.get(id);
                  chartDetails.put(id,
                    new Float(tmpValue.floatValue() +
                    (loc.getQuantity()*loc.getUnitPrice())));
                } else {
                  chartDetails.put(id,
                   new Float(loc.getQuantity()*loc.getUnitPrice()));
                }
              }
            }
          } else {
            if(categ == null) {
              id = loc.getCategoryId();
              if(chartDetails.containsKey(id)) {
                tmpQty = (Integer) chartDetails.get(id);
                chartDetails.put(id,
                     new Integer(tmpQty.intValue() +
                                 loc.getQuantity()));
              } else {
                chartDetails.put(id, new
                                 Integer(loc.getQuantity()));
              }
            } else {
              if(loc.getCategoryId().equals(categ)) {
                id = loc.getItemId();
                if(chartDetails.containsKey(id)) {
                  tmpQty = (Integer) chartDetails.get(id);
                  chartDetails.put(id,
                          new Integer(tmpQty.intValue() +
                          loc.getQuantity()));
                } else {
                  chartDetails.put(id,
                         new Integer(loc.getQuantity()));
                }
              }
            }
          }
