  - record_key: UIDGEN-BIZ-0002
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      All ID generation operations (getUniqueId on UniqueIdGeneratorEJB, getNextValue on
      CounterEJB, and Counter entity creation) SHALL execute within a container-managed
      transaction with isolation level Required.
    confidence: high
    confidence_basis: >
      Transaction attributes are declared in ejb-jar.xml for all three operations
      (getUniqueId, getNextValue, and Counter.create). No programmatic transaction
      demarcation is present; container management is exclusive.
    risk_class: operational
    basis: >
      The ejb-jar.xml assembly descriptor defines container-transaction entries with
      trans-attribute=Required for: (1) UniqueIdGeneratorEJB.getUniqueId, (2) CounterEJB.getNextValue,
      and (3) CounterEJB.create. This ensures ACID guarantees around counter mutation.
