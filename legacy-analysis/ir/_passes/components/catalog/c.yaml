  - record_key: CATALOG-WORKFLOW-0001
    kind: workflow
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support paginated retrieval of categories with a start offset and count limit.
      GIVEN a request for categories, WHEN pagination parameters (start, count) are provided,
      THEN return a Page containing up to count items starting from the start offset, with a hasNext
      flag indicating whether more results are available.
    confidence: high
    confidence_basis: >
      Pagination logic is implemented in two places: (1) GenericCatalogDAO.getCategories (line 194)
      uses resultSet.absolute(start+1) to position; (2) loop (line 201) reads count items and checks
      for hasNext. Both passes should see this clearly—it's the only path and it's explicit.
    risk_class: operational
    basis: >
      GenericCatalogDAO.getCategories (lines 182-210) demonstrates the pagination workflow:
      getConnection, execute query, call resultSet.absolute(start + 1) to position cursor,
      loop up to count items, set hasNext based on whether resultSet.next() returns true.
      Same pattern repeated in getCategories, getProducts, getItems, searchItems.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[] { locale.toString() };
                  statement = buildSQLStatement(connection, sqlStatements, XML_GET_CATEGORIES, parameterValues);
                  resultSet = statement.executeQuery();
                  if (start >= 0 && resultSet.absolute(start + 1)) {
                      boolean hasNext = false;
                      List categories = new ArrayList();
                      do {
                          categories.add(new Category(resultSet.getString(1).trim(),
                                                      resultSet.getString(2),
                                                      resultSet.getString(3)));
                      } while ((hasNext = resultSet.next()) && (--count > 0));
                      return new Page(categories, start, hasNext);
                  }
                  return Page.EMPTY_PAGE;

