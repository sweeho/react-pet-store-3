findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
    description: >
      The Country field has conflicting optionality semantics across the three sources.
      The DTD schema (Address.dtd line 38) marks Country as optional (Country?). However,
      the toDOM() serialization method (line 153) unconditionally appends the country
      element without checking for null or empty, which will serialize empty/null country
      values as empty XML elements. The fromDOM() deserialization method (line 175) calls
      getNextSibling with false parameter, marking country as required when parsing XML.
      This creates three different semantics: DTD says optional, serialization treats it
      as always-present, deserialization treats it as required. Applications may fail to
      round-trip Address objects through XML if country is null.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
    description: >
      The AddressEJB primary key is declared as java.lang.Object (line 53: prim-key-class)
      with no primkey-field or prim-key-field-name element. This means the container will
      generate a unique synthetic key. The semantics of key generation (database-generated,
      UUID-based, object identity) are not documented. It is unclear whether multiple
      Address instances with identical field values will receive the same key or different
      keys, or whether Address entities are implicitly deduplicated by field values or kept
      as distinct instances. This affects the semantics of findByPrimaryKey and the
      uniqueness contract.
