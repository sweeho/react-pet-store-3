  - record_key: ADMIN-DASH-0001
    kind: requirement
    capability_key: admin-dashboard
    requirement: >
      The system SHALL provide admin methods to query orders by status and generate chart data for orders
      and revenue within a date range. Admin queries SHALL support optional category filtering for
      revenue and order analysis.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB exposes two remote methods with clear signatures: getOrdersByStatus(String) and
      getChartInfo(String, Date, Date, String). The methods are declared in the remote interface and
      configured with Container-managed transactions in ejb-jar.xml. The implementation is complete and testable.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB.getOrdersByStatus() returns OrdersTO containing order details (ID, user, date, value, status).
      getChartInfo() accepts a request type (REVENUE or ORDERS), date range, and optional category filter.
      It iterates through PurchaseOrders and their LineItems, accumulating revenue or quantities by category or item ID.
    traces:
