<!doctype html>
<html>
<head><meta charset="utf-8"><title>Admin home</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#3f3f46}
.shell{max-width:940px;margin:0 auto;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;border:1px solid #e4e4e7;border-radius:10px;padding:10px 14px;background:#fafafa}
.brand{font-weight:600;color:#27272a}
.right{display:flex;align-items:center;gap:10px}
.nav{display:flex;gap:6px;margin:14px 0 18px}
.navitem{padding:6px 12px;border:1px solid #e4e4e7;border-radius:8px;color:#71717a;font-size:13px}
.navitem.active{background:#27272a;color:#fff;border-color:#27272a}
.bar{background:#d4d4d8;border-radius:3px;height:9px;display:inline-block}
.btn{display:inline-flex;align-items:center;height:34px;padding:0 14px;border:1px solid #d4d4d8;border-radius:8px;background:#fff;color:#3f3f46;font-size:13px;font-weight:500}
.btn.primary{background:#27272a;color:#fff;border-color:#27272a}
h1{font-size:22px;color:#27272a;margin:0 0 4px}
.sub{font-size:13px;color:#a1a1aa;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid #e4e4e7;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:170px}
.card h2{font-size:15px;color:#27272a;margin:0}
.big{font-size:30px;font-weight:600;color:#27272a;line-height:1}
.note{font-size:12px;color:#a1a1aa}
.spacer{flex:1}
.counts{display:flex;gap:18px;margin-top:4px}
.count{font-size:12px;color:#71717a}
.count b{display:block;font-size:17px;color:#3f3f46;font-weight:600}
</style></head>
<body><div class="shell">

  <div class="topbar">
    <span class="brand">Pet Store — Admin</span>
    <div class="right"><span class="bar" style="width:90px"></span><span class="note">Administrator</span><span class="btn" style="height:28px">Sign out</span></div>
  </div>

  <div class="nav"><span class="navitem active">Home</span><span class="navitem">Order review</span><span class="navitem">Reports</span></div>

  <h1>Administrator home</h1>
  <p class="sub">Review held orders, or open sales reports.</p>

  <div class="grid">
    <div class="card">
      <h2>Order review</h2>
      <span class="big">12</span>
      <span class="note">orders pending review ($500 and above)</span>
      <div class="counts">
        <span class="count"><b>8</b>Approved</span>
        <span class="count"><b>3</b>Denied</span>
        <span class="count"><b>24</b>Completed</span>
      </div>
      <div class="spacer"></div>
      <div><span class="btn primary">Review orders</span></div>
    </div>

    <div class="card">
      <h2>Sales reports</h2>
      <span class="bar" style="width:100%"></span>
      <span class="bar" style="width:86%"></span>
      <span class="bar" style="width:54%"></span>
      <span class="note">Sales by category over a date range.</span>
      <div class="spacer"></div>
      <div><span class="btn">Open reports</span></div>
    </div>
  </div>

</div></body></html>
