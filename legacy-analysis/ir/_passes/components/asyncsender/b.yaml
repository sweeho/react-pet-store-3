  - record_key: CUST-COMM-REQ-0006
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL ensure QueueConnection resources are closed in all execution
      paths to prevent connection leaks.
    confidence: medium
    confidence_basis: >
      The implementation includes a finally block that closes the QueueConnection.
      However, QueueSession and QueueSender are not explicitly closed, and the
      finally block catches and suppresses exceptions without re-throwing, which
      could mask resource cleanup failures. The pattern is partially implemented.
    risk_class: operational
    basis: >
      AsyncSenderEJB.sendAMessage includes a finally block checking if qConnect
      is not null before calling qConnect.close(). However, qConnect.close()
      does not close the underlying session and sender, and exceptions during
      close are silently caught and suppressed.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 83
        line_end: 89
        excerpt: |
          } finally {
            try {
              if( qConnect != null ) {
                qConnect.close();
              }
            } catch(Exception e) {}
          }
    stack_metadata:
      error-handling: incomplete

  - record_key: CUST-COMM-REQ-0007
    kind: requirement
    capability_key: customer-communications
    requirement: >
      The system SHALL initialize the AsyncSender EJB at creation time by looking up
      the JMS QueueConnectionFactory and AsyncSenderQueue via ServiceLocator and storing
      them as instance variables for reuse across message transmissions.
    confidence: high
    confidence_basis: >
      The ejbCreate method is the EJB lifecycle hook that executes once per bean
      instance (stateless beans are pooled, but each instance is initialized once).
      ServiceLocator is used to retrieve both the factory and queue, and both are
      stored as private fields. This initialization pattern is enforced by the EJB
      container contract.
    risk_class: operational
    basis: >
      AsyncSenderEJB.ejbCreate (invoked by container at bean creation) calls
      ServiceLocator to retrieve QueueConnectionFactory and Queue by their JNDI
      names and stores them in qFactory and q fields. These are reused in sendAMessage.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 49
        line_end: 66
        excerpt: |
          public class AsyncSenderEJB implements SessionBean {
            private SessionContext sc;
            private Queue q;
            private QueueConnectionFactory qFactory;
            public AsyncSenderEJB() {}
            public void ejbCreate( ) throws CreateException {
              try {
                ServiceLocator serviceLocator = new ServiceLocator();
                qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
                q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
              } catch (ServiceLocatorException sle) {
                throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
              }
            }
    stack_metadata:
      ejb.lifecycle: ejbCreate
      service-locator: true

