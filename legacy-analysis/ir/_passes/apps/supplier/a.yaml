      SHALL be skipped when reprocessing pending orders.
    confidence: high
    confidence_basis: >
      The processAnOrder method explicitly checks if li.getQuantity() equals
      li.getQuantityShipped() and continues (skips) if they are equal.
    risk_class: operational
    basis: >
      In OrderFulfillmentFacadeEJB.processAnOrder() (lines 187-188), the code checks:
      if(li.getQuantity() == li.getQuantityShipped()) continue; This prevents
      already-shipped items from being processed again.
    traces:
