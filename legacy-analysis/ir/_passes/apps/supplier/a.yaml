  - record_key: SUPP-REQ-0005
    kind: requirement
    capability_key: supplier-integration
    requirement: >
      When items can be fulfilled from inventory, the system SHALL generate an invoice
      document in XML format containing the itemId, lineNumber, quantity, unitPrice,
      categoryId, productId, poId, userId, orderDate, and shippingDate.
    confidence: high
    confidence_basis: >
      The createInvoice method constructs an invoice using TPAInvoiceXDE, setting all
      required fields. The method is called only when invoiceReqd is true, which is set
      only when at least one item passes inventory check and is marked as shipped.
    risk_class: operational
    basis: >
      The createInvoice method (lines 145-171 in OrderFulfillmentFacadeEJB) builds an
      invoice by setting poId, userId, orderDate, shippingDate, and then iterating
      through line items to add those with available inventory, including itemId,
      lineNumber, quantity, unitPrice, categoryId, and productId.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 171
        excerpt: |
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
                }
              }
              String invDoc = null;
              invDoc = invoiceXDE.getDocumentAsString();
              return(invDoc);
    stack_metadata:
      framework: ejb
      ejb.bean: OrderFulfillmentFacadeEJB

