  - record_key: CUST-COMM-RULE-0002
    kind: business-rule
    capability_key: customer-communications
    requirement: >
      When email sending fails, the system SHALL log the error message but
      continue processing. Mail server configuration failures SHALL be silently
      ignored.
    confidence: medium
    confidence_basis: >
      The code shows MailerAppException being caught and swallowed with an
      inline comment explaining the rationale. However, this is a single code
      path with no specification document confirming this is intended behavior
      vs. a temporary workaround. The comment suggests it may be a stopgap.
    risk_class: operational
    basis: >
      MailerMDB.onMessage catches MailerAppException and logs to stderr with a
      comment stating "ignore since user probably forgot to set up mail server".
      This indicates graceful degradation rather than failure propagation.
      XMLDocumentException is re-thrown as EJBException, but MailerAppException
      is not.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 83
        line_end: 90
        excerpt: |
          } catch (MailerAppException me) {
            //throw new EJBException("MailerMDB.onMessage" + me);
            //ignore since user probably forgot to set up mail server
          } catch (XMLDocumentException xde) {
            throw new EJBException("MailerMDB.onMessage" + xde);
          } catch(JMSException je) {
            throw new EJBException("MailerMDB.onMessage" + je);
    stack_metadata:
      error_handling: silently_ignored

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
    description: >
      MailerAppException is caught and silently ignored with an inline comment
      suggesting it is a workaround for missing mail server configuration.
      It is unclear whether this is intentional permanent behavior (graceful
      degradation) or a temporary debug workaround that should propagate as an
      exception in production. The inline comment is commented-out exception
      re-throw code, suggesting uncertainty about the correct behavior. A
      business decision is required: should mail delivery failures be silent,
      logged, or exception-propagating?

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
    description: >
      msg.setFrom() is called without arguments. The javax.mail.Message API
      expects setFrom(Address) or setFrom() to use a default. Behavior when
      no from address is set is not clear from the code — the mail may use
      a server-configured default, or the header may be omitted. This is
      framework-dependent and not specified in the mailer code.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
    description: >
      The MailHelper.createAndSendMail method declares throws MailerAppException
      but the caller (MailerMDB.onMessage) catches it. The exception path is
      reachable (line 88 throws) but the condition under which it is thrown
      is unclear. The catch block's comment suggests it may be thrown on
      javax.mail.MessagingException, but the mapping is not explicit.
