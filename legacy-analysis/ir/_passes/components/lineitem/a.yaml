    requirement: >
      The system SHALL store line items as a Container-Managed Persistence (CMP)
      entity bean with eight required fields: categoryId, productId, itemId, lineNumber,
      quantity, unitPrice, and quantityShipped.
    confidence: high
    confidence_basis: >
      The requirement is declaratively defined in ejb-jar.xml with CMP 2.x configuration
      and seven abstract fields in LineItemEJB. Confirmed by both deployment descriptor
      and implementation.
    risk_class: operational
