      cardNumber is declared as a CMP field in ejb-jar.xml. It is retrieved and set
      via getCardNumber() and setCardNumber() methods in CreditCardEJB. Sample data shows
      card number "0100-001-0001" but no explicit length constraint is found in the schema.
