  # ========== CATALOG BROWSING ==========
  - record_key: catalog-browsing-req-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support browsing the product catalog via a Fast Lane
      Reader Pattern, allowing direct JDBC access to catalog data from the
      web tier (bypassing EJB layer for read-only operations).
    confidence: medium
    confidence_basis: >
      web.xml declares a resource-ref for jdbc/CatalogDB and an env-entry for
      CatalogDAODatabase with value «REDACTED:secret-finding-30» and CatalogDAOClass with
      value «REDACTED:secret-finding-31». These enable Fast Lane pattern. However, no
      Java code is provided showing the actual implementation of catalog browsing
      in the petstore module (it may be in a separate component).
    risk_class: operational
    basis: >
      web.xml lines 171-189 define resource and environment entries for Fast
      Lane catalog access. Comment on lines 169 says "Enable Fast Lane Pattern".
      These entries enable the pattern but actual catalog browsing code may be
      in a separate component module.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 169
        line_end: 199
        excerpt: |
          <!-- Enable Fast Lane Pattern  -->
          <resource-ref>
            <description>Allow the Fast Lane Reader Pattern to Read Catalog Data Directly via JDBC in the Web Tier</description>
            <res-ref-name>jdbc/CatalogDB</res-ref-name>
            <res-type>javax.sql.DataSource</res-type>
            <res-auth>Container</res-auth>
          </resource-ref>
          <resource-ref>
            <res-ref-name>url/CatalogDAOSQLURL</res-ref-name>
            <res-type>java.net.URL</res-type>
