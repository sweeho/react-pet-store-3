records:
  - record_key: XMLDOC-ENTITY-0001
    kind: entity
    capability_key: order-checkout
    requirement: >
      A PurchaseOrder XML document SHALL contain the following elements: OrderId, UserId, EmailId, OrderDate,
      ShipAddress, BillAddress, TotalPrice, CreditCard (CardNumber, ExpiryDate, CardType), and one or more LineItem elements.
      The PurchaseOrder element has a locale attribute with default value "en_US".
    confidence: high
    confidence_basis: >
      The DTD schema (PurchaseOrder.dtd) explicitly defines all required elements and attributes.
      Both XMLDocumentUtils and OrderApproval classes reference these elements in their implementation,
      confirming consistent usage across the module. The schema is enforced through XML parsing with
      validation enabled (VALIDATING = true).
    risk_class: operational
    basis: >
      PurchaseOrder.dtd defines element structure with mandatory child elements and locale attribute.
      XMLDocumentEditor and XMLDocumentUtils provide serialization/deserialization methods.
      Test and example files reference this document type.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 85
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>
          <!ATTLIST PurchaseOrder
          	locale CDATA "en_US"
          >
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentEditor.java
        line_start: 47
        line_end: 102
        excerpt: |
          public interface XMLDocumentEditor {
            public void setDocument(Source source) throws XMLDocumentException;
            public Source getDocument() throws XMLDocumentException;
            public void copyDocument(Result result) throws XMLDocumentException;
          }
    stack_metadata:
      dtd.document: PurchaseOrder.dtd
      validation.enabled: true

  - record_key: XMLDOC-ENTITY-0002
    kind: entity
    capability_key: order-approval
    requirement: >
      An OrderApproval XML document SHALL contain one or more Order elements.
      Each Order element SHALL contain OrderId and OrderStatus child elements.
      OrderStatus element should be an attribute rather than a child element (schema has FIXME comment).
    confidence: medium
    confidence_basis: >
      The DTD schema explicitly defines the structure. The DTD includes a FIXME comment suggesting
      OrderStatus should be an attribute, indicating ambiguity in the design. However, the current
      implementation uses it as an element, and ChangedOrder.java and OrderApproval.java both
      confirm the element-based approach in their fromDOM/toDOM methods.
    risk_class: operational
    basis: >
      OrderApproval.dtd defines the element structure. DTD contains inline FIXME comment
      suggesting design intent mismatch. ChangedOrder and OrderApproval classes implement
      the element-based serialization. The class manages order lists and converts between
      XML and in-memory representations.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 46
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>
          <!ELEMENT Order (OrderId, OrderStatus)>
          <!ELEMENT OrderId (#PCDATA)>
          <!-- FIXME should be attribute -->
          <!ELEMENT OrderStatus (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 44
        line_end: 91
        excerpt: |
          public class ChangedOrder {
            public static final String XML_ORDERID = "OrderId";
            public static final String XML_ORDERSTATUS = "OrderStatus";
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_ORDER);
              XMLDocumentUtils.appendChild(document, root, XML_ORDERID, orderId);
              XMLDocumentUtils.appendChild(document, root, XML_ORDERSTATUS, orderStatus);
              return root;
            }
          }
    stack_metadata:
      dtd.document: OrderApproval.dtd
      java.class: ChangedOrder

  - record_key: XMLDOC-ENTITY-0003
    kind: entity
    capability_key: supplier-integration
    requirement: >
      An Invoice XML document SHALL contain OrderId, UserId, OrderDate, ShippingDate, and one or more LineItem elements.
      LineItem is an external entity reference to LineItem.dtd.
    confidence: high
    confidence_basis: >
      Invoice.dtd explicitly defines all required elements. The LineItem entity is publicly defined
      as an external DTD reference following J2EE Blueprints conventions. No ambiguity in element structure.
    risk_class: operational
    basis: >
      Invoice.dtd defines the Invoice element with public external entity for LineItem.
      Schema is used in supplier integration workflows for sending invoices.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/Invoice.dtd
        line_start: 38
        line_end: 53
        excerpt: |
          <!ENTITY % LineItem PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Line Item 1.0//EN" "LineItem.dtd">
          %LineItem;
          <!ELEMENT Invoice (OrderId, UserId, OrderDate, ShippingDate, LineItem+)>
          <!ATTLIST Invoice
          	locale CDATA "en_US"
          >
    stack_metadata:
      dtd.document: Invoice.dtd
      entity.reference: LineItem.dtd

  - record_key: XMLDOC-ENTITY-0004
    kind: entity
    capability_key: supplier-integration
    requirement: >
      A SupplierOrder XML document SHALL contain orderid, orderdate, shipaddress, and one or more lineitem elements (lowercase).
      ShipAddress SHALL include FirstName, LastName, Street, City, State, Country, and ZipCode.
      LineItem is an external entity reference.
    confidence: high
    confidence_basis: >
      SupplierOrder.dtd explicitly defines all elements with lowercase naming for most elements
      (contrary to CamelCase used in PurchaseOrder). This distinction is deliberate and enforced
      through XML validation. TPA classes reference this schema with consistent naming.
    risk_class: operational
    basis: >
      SupplierOrder.dtd defines elements with different casing than PurchaseOrder (orderid vs OrderId).
      Used in supplier purchase order management workflows.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 64
        excerpt: |
          <!ELEMENT SupplierOrder (orderid, orderdate, shipaddress, lineitem+)>
          <!ELEMENT orderid (#PCDATA)>
          <!ELEMENT orderdate (#PCDATA)>
          <!ENTITY % Address "firstname, lastname, street, city, state, country, zip">
          <!ELEMENT shipaddress (%Address;)>
    stack_metadata:
      dtd.document: SupplierOrder.dtd
      element.case: lowercase

