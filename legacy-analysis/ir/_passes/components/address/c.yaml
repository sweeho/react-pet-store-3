    requirement: >
      The system SHALL maintain an Address entity with six persistent attributes:
      streetName1, streetName2, city, state, zipCode, and country. Each attribute
      is managed as a Container-Managed Persistence (CMP) field.
    confidence: high
    confidence_basis: >
      All six fields are declared as abstract CMP fields in AddressEJB (lines 53-69),
      with corresponding declarative CMP field definitions in ejb-jar.xml (lines 57-80).
      The transfer object Address.java defines matching instance variables (lines 62-67).
      All three sources independently confirm the complete field set and their types.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 57-80 declare six <cmp-field> elements with field-names:
      zipCode, streetName2, state, streetName1, city, country. AddressEJB.java
      lines 53-69 declare abstract getter/setter methods for each field. Address.java
      lines 62-67 declare instance variables with matching names.
