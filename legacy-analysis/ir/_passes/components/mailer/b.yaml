    kind: entity
    capability_key: customer-communications
    requirement: >
      The system SHALL maintain a Mail entity with three required fields: recipient email
      address (Address), email subject (Subject), and email content (Content).
    confidence: high
    confidence_basis: >
      The Mail class explicitly defines three private fields (address, subject, content)
      with public getters and constructor. The Mail.dtd schema enforces these as required
      elements in that exact order. Both code and schema agree on the mandatory structure.
    risk_class: operational
    basis: >
      Mail.java defines private String fields for address, subject, and content with
      public getters. The DTD schema declares Mail element with required child elements
      Address, Subject, Content in sequence with no optional markers.
    traces:
