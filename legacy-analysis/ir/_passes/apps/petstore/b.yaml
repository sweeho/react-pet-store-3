  # ========== SHOPPING CART VALIDATION ==========
  - record_key: shopping-cart-req-0005
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL throw ShoppingCartEmptyOrderException if an order is
      submitted when the shopping cart contains zero items.
    confidence: high
    confidence_basis: >
      Rule is explicitly enforced in OrderEJBAction at the point where items
      are collected from cart. Check is programmatic (items.size() == 0) and
      throws named exception. Exception is mapped in mappings.xml to error screen.
    risk_class: operational
    basis: >
      OrderEJBAction lines 130-132 check cart item count and throw exception
      by name. mappings.xml line 110 maps this exception to cart_empty_order_error.screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          Collection items = cart.getItems();
          // if the cart is empty throw an exception saying so
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>

  # ========== CUSTOMER MANAGEMENT ==========
  - record_key: customer-management-req-0001
    kind: requirement
    capability_key: customer-management
    requirement: >
      The system SHALL allow users to create a new account with a unique user ID
      (userName) and password; SHALL prevent duplicate account creation by throwing
      DuplicateAccountException if the user ID already exists.
    confidence: high
    confidence_basis: >
      CreateUserEJBAction calls signOn.createUser(userName, password) which is
      caught for CreateException (lines 93-101). The exception is re-thrown as
      DuplicateAccountException. Exception mapping confirms the error flow.
    risk_class: operational
    basis: >
      CreateUserEJBAction lines 78-103 show the full flow. SignOn EJB is located
      and create() is called. The catch block maps CreateException to
      DuplicateAccountException. mappings.xml line 111 maps the exception to
      duplicate_account.screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 78
        line_end: 103
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              CreateUserEvent cue = (CreateUserEvent)e;
              SignOnLocal signOn = null;
              String userName = cue.getUserName();
              String password = «REDACTED:secret-finding-22»
              try {
                 ServiceLocator sl = new ServiceLocator();
                 SignOnLocalHome home =(SignOnLocalHome)sl.getLocalHome(JNDINames.SIGN_ON_EJBHOME);
                 signOn = home.create();
              } catch (ServiceLocatorException  slx) {
                  throw new DuplicateAccountException("Failed to Create SignOn EJB: caught " + slx);
              } catch (CreateException cx) {
                  throw new DuplicateAccountException("Failed to Create SignOn EJB: caught " + cx);
              }
             try {
                  signOn.createUser(userName, password);
                  ShoppingClientFacadeLocal scf = null;
                  scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
                  scf.setUserId(userName);
             } catch (CreateException ce) {
                 throw new DuplicateAccountException("Bad UserName or password");
             }
             return null;
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
