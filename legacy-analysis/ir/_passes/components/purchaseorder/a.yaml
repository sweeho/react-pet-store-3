  - record_key: ORDER-WORKFLOW-0001
    kind: workflow
    capability_key: order-workflow
    requirement: >
      When a PurchaseOrder is received, the system SHALL create a PurchaseOrder entity
      and initialize its workflow status to PENDING.
    confidence: high
    confidence_basis: >
      The PurchaseOrderMDB's onMessage() method at line 156 explicitly calls
      processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING).
      This is the single entry point for all orders entering the system, and the
      OrderStatusNames constant indicates this is a declared workflow state.
    risk_class: operational
    basis: >
      PurchaseOrderMDB.java lines 151-165 show the order creation and initial status assignment.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
        line_end: 165
        excerpt: |
          private String doWork(String xmlMessage) throws XMLDocumentException, CreateException {
            String ret = null;
            PurchaseOrder purchaseOrder = PurchaseOrder.fromXML(xmlMessage, entityCatalogURL, validateXmlPurchaseOrder);
            poHome.create(purchaseOrder);
            //update process manager to start workflow for this purchase order
            processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);
            if(canIApprove(purchaseOrder)) {
              ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
              OrderApproval oa = new OrderApproval();
              oa.addOrder(co);
              ret = oa.toXML();
            }
            return ret;
          }
    stack_metadata:
      framework: EJB Message-Driven Bean
      jms.queue: PurchaseOrderQueue
      ejb.bean: PurchaseOrderMDB

  - record_key: ORDER-APPROVAL-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      An order for a customer in the US locale with total price < 500 USD SHALL be
      automatically approved and transitioned to APPROVED status. An order for a customer
      in the Japan locale with total price < 50000 JPY SHALL be automatically approved.
    confidence: medium
    confidence_basis: >
      The thresholds are hardcoded in the canIApprove method at lines 183-191. While this
      implements automatic approval logic, there is no external documentation or configuration
      file declaring these thresholds. The values are bare literals without a comment
      explaining their business rationale.
    risk_class: financial
    basis: >
      PurchaseOrderMDB.java lines 183-191 contain the approval logic. The method checks
      locale and total price against literal threshold values.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      framework: EJB Message-Driven Bean

  - record_key: ORDER-APPROVAL-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      Only orders in PENDING status SHALL be processed for approval or denial. Orders
      that are already APPROVED, DENIED, or COMPLETED SHALL NOT be processed again.
    confidence: high
    confidence_basis: >
      The OrderApprovalMDB's doWork method explicitly checks the order status (line 204-207)
      and skips processing if the status is not PENDING. This is a defensive check that
      prevents duplicate processing of the same order.
    risk_class: operational
    basis: >
      OrderApprovalMDB.java lines 199-207 show the status guard condition.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 207
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
    stack_metadata:
      framework: EJB Message-Driven Bean

  - record_key: ORDER-WORKFLOW-0002
    kind: workflow
    capability_key: order-workflow
    requirement: >
      When an order status is updated to APPROVED, the order SHALL transition to APPROVED
      state. The system SHALL then generate a supplier purchase order from the customer
      order and send it for fulfillment.
    confidence: high
    confidence_basis: >
      Lines 218-223 of OrderApprovalMDB show that for all approved orders, the system
      builds and queues an XML supplier purchase order. This is a required step in the
      order workflow.
    risk_class: operational
    basis: >
      OrderApprovalMDB.java lines 215-223 show the approval-to-supplier-PO transition.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 215
        line_end: 223
        excerpt: |
          //update process manager
          //for this purchase order workflow
          processManager.updateStatus(co.getOrderId(), co.getOrderStatus());

          //for all approved orders, send a PO to supplier
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
    stack_metadata:
      framework: EJB Message-Driven Bean

  - record_key: SUPPLIER-INTEGRATION-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      A supplier purchase order SHALL contain the order ID, order date, shipping address
      (given name, family name, street, city, state, country, zip code, email, telephone),
      and line items with product details (category, product, item ID, line number,
      quantity, unit price).
    confidence: high
    confidence_basis: >
      The getXmlPO method at lines 248-268 demonstrates exactly what fields are extracted
      from the PurchaseOrder entity and written to the supplier PO. This is the single
      code path for all supplier order generation.
    risk_class: operational
    basis: >
      OrderApprovalMDB.java lines 248-268 show the supplier PO generation logic.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 248
        line_end: 268
        excerpt: |
          private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
            supplierOrderXDE.newDocument();
            supplierOrderXDE.setOrderId(po.getPoId());
            Date tmpDate = new Date(po.getPoDate());
            supplierOrderXDE.setOrderDate(tmpDate);
            ContactInfoLocal cinfo = po.getContactInfo();
            AddressLocal addr = cinfo.getAddress();
            supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                addr.getStreetName1(), addr.getCity(),
                                                addr.getState(), addr.getCountry(),
                                                addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());
            Collection liColl = po.getData().getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItem li = (LineItem) liIt.next();
              supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),
                                           li.getLineNumber(), li.getQuantity(), li.getUnitPrice());
            }
            return supplierOrderXDE.getDocumentAsString();
          }
    stack_metadata:
      framework: EJB Message-Driven Bean

  - record_key: ORDER-WORKFLOW-0003
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      An order SHALL be marked as COMPLETED only when all of its line items have been
      shipped in full quantity. The system SHALL track quantityShipped for each line item
      and compare it against the requested quantity.
    confidence: high
    confidence_basis: >
      PurchaseOrderHelper.processInvoice() (lines 80-103) is the single handler for
      invoice processing and shipment tracking. It loops through all line items and only
      returns true (order complete) when quantity == quantityShipped for all items.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.java lines 80-103 show the completion logic.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 103
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

            //set the quantity of line items shipped in the PO
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                        Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                }
            }//end while

            // now loop through all LIs and see if all are shipped completely
            liColl = po.getLineItems();
            liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(li.getQuantity() != li.getQuantityShipped()) {
                  return false;
                  }
            }//end while
            return true;
          }
    stack_metadata:
      framework: EJB Session Bean Helper

