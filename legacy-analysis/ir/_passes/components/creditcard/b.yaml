    requirement: >
      The system SHALL require credit card number, type, and expiry date as mandatory fields
      with no null values allowed.
    confidence: medium
    confidence_basis: >
      CMP fields are defined without optional indicators, suggesting required status.
      CustomerHTMLAction performs presence validation on all three fields before constructing
      CreditCard, adding missing fields to a missingFields list. However, validation logic
