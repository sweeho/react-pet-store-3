            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.transaction: Required

  - record_key: CUSTOMER-ENTITY-0011
    kind: requirement
    capability_key: customer-management
    requirement: >
      When a Customer entity is deleted, its associated Account and Profile entities
      SHALL be automatically deleted via cascade-delete semantics.
      When an Account entity is deleted, its associated ContactInfo and CreditCard
      entities SHALL be automatically deleted.
      When a ContactInfo entity is deleted, its associated Address entity SHALL be
      automatically deleted.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml defines cascade-delete elements for all child relationships
      (lines 280, 301, 322, 343, 364). These are declarative constraints enforced by
      the EJB container at the database level. The relationships are one-to-one mandatory
      associations, so cascade-delete ensures referential integrity and prevents orphaned
      records.
    risk_class: operational
    basis: >
      The ejb-jar.xml relationships section declares all parent-child associations with
      cascade-delete. For example, lines 280 show cascade-delete for the Customer-Account
      relationship. Lines 301 and 322 show cascade-delete for Customer relationships with
      both Account and Profile. Lines 343 and 364 show cascade-delete for Account
      relationships. The cascade-delete element ensures that when the parent is removed,
      the container automatically removes the child.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 265
        line_end: 370
        excerpt: |
          <relationships>
            <ejb-relation>
              <ejb-relationship-role>
                <ejb-relationship-role-name>CustomerEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
              </ejb-relationship-role>
              <ejb-relationship-role>
                <ejb-relationship-role-name>AccountEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
                <cascade-delete />
              </ejb-relationship-role>
            </ejb-relation>
            <ejb-relation>
              <ejb-relationship-role>
                <ejb-relationship-role-name>AccountEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
              </ejb-relationship-role>
              <ejb-relationship-role>
                <ejb-relationship-role-name>ContactInfoEJB</ejb-relationship-role-name>
                <multiplicity>One</multiplicity>
                <cascade-delete />
              </ejb-relationship-role>
            </ejb-relation>
