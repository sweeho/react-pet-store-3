records:
  - record_key: shopping-cart-entity-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL maintain a LineItem entity with the following attributes:
      categoryId (String), productId (String), itemId (String), lineNumber (String),
      quantity (int), unitPrice (float), and quantityShipped (int).
    confidence: high
    confidence_basis: >
      CMP entity bean definition is found in ejb-jar.xml with all fields declared as
      cmp-field elements. Both LineItemEJB abstract class and LineItem value object
      define getters/setters for all fields. Entity is used consistently across
      purchase order and order processing components.
    risk_class: operational
    basis: >
      EJB entity bean definition with Container-Managed Persistence 2.x. All seven
      fields are declared as CMP fields in ejb-jar.xml. Both the entity bean class
      (LineItemEJB) and value object (LineItem) define abstract accessors for all
      fields, and the value object constructor accepts all seven parameters.
    traces:
