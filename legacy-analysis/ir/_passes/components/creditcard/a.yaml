  - record_key: CC-FIELD-0004
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL store the card expiry date in MM/YYYY format where MM is
      two digits (01-12) and YYYY is a four-digit year.
    confidence: medium
    confidence_basis: >
      The format is inferred from the parsing logic in getExpiryMonth() and getExpiryYear()
      methods which split on "/" character. The form separately collects month (01-12)
      and year (four digits) and combines them. However, no explicit format validation
      is enforced at creation time.
    risk_class: financial
    basis: >
      CreditCardEJB.getExpiryMonth() (lines 88-96) retrieves text before the "/"
      character. getExpiryYear() (lines 98-107) retrieves text after the "/".
      The create_customer.jsp form provides separate dropdowns for month (01-12) and
      year (2001-2004 in the sample, but field names suggest it is meant to be flexible).
      Default values in getExpiryMonth/Year of "01" and "2010" indicate fallback
      behavior when parsing fails.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text before it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }

          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              // get the slash and return the text after it
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
            }
            return "2010";
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/create_customer.jsp
        line_start: 151
        line_end: 175
        excerpt: |
          <tr>
          <td class="petstore_form" align="right"><b>Expiry Date</b></td>
          <td class="petstore_form" align="left" colspan="2">
          <select size="1" name="credit_card_expiry_month">
           <option value="01">01</option>
           <option value="02">02</option>
           <option value="12">12</option>
          </select>
          /
          <select size="1" name="credit_card_expiry_year">
           <option value="2001">2001</option>
           <option value="2004">2004</option>
          </select>
    stack_metadata:
      ejb.bean: CreditCardEJB
      cmp.field: expiryDate

  - record_key: CC-LIFECYCLE-0005
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL enforce transactional boundaries on all CreditCard EJB methods
      with transaction attribute Required, meaning each invocation either commits
      within an existing transaction or creates a new one.
    confidence: high
    confidence_basis: >
      All container-transaction declarations in ejb-jar.xml explicitly set trans-attribute
      to Required for every method. This is declaratively enforced by the container.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor contains 11 container-transaction entries (lines 83-233)
      covering all CreditCard methods: remove, getExpiryDate, getExpiryMonth, getExpiryYear,
      setExpiryDate, findByPrimaryKey, create (3 overloads), setCardType, setCardNumber,
      getCardType, and getData. All specify trans-attribute=Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 83
        line_end: 102
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>CreditCardEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
              <method-name>remove</method-name>
              <method-params>
                <method-param>java.lang.Object</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          <container-transaction>
            <method>
              <ejb-name>CreditCardEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getExpiryDate</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: CreditCardEJB
      ejb.transaction: Required

  - record_key: CC-ACCESS-0006
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL allow any caller to invoke CreditCard methods without
      restriction via use-caller-identity security.
    confidence: high
    confidence_basis: >
      The security-identity section in ejb-jar.xml explicitly declares use-caller-identity
      with no method-permission restrictions limiting access.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 69-72 declare security-identity with use-caller-identity.
      assembly-descriptor line 77-81 declares unchecked permission on all (*) methods
      of CreditCardEJB, allowing any caller.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 69
        line_end: 82
        excerpt: |
          <security-identity>
            <description></description>
            <use-caller-identity></use-caller-identity>
          </security-identity>
        ...
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>CreditCardEJB</ejb-name>
              <method-name>*</method-name>
