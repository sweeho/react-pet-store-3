  - record_key: supplier-integration-order-status-workflow-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      The system SHALL enforce a purchase order status workflow with the following valid states:
      PENDING, APPROVED, DENIED, and COMPLETED. Purchase orders SHALL initially be created
      in PENDING status. Transitions between states are controlled by business processes
      outside this component.
    confidence: high
    confidence_basis: >
      OrderStatusNames.java (lines 48-62) defines the complete set of valid status values
      as public static constants: PENDING (line 51), APPROVED (line 54), DENIED (line 57),
      and COMPLETED (line 60). The ejbCreate() method in SupplierOrderEJB.java (lines 151-156)
      explicitly sets initial status to OrderStatusNames.PENDING (line 154), confirming the
      workflow entry point. This is the single source of truth for valid statuses in the
      supplier order domain.
    risk_class: operational
    basis: >
      OrderStatusNames.java defines static final String constants: PENDING = "PENDING" (line 51),
      APPROVED = "APPROVED" (line 54), DENIED = "DENIED" (line 57), COMPLETED = "COMPLETED"
      (line 60). SupplierOrderEJB.ejbCreate() (lines 151-156) invokes setPoStatus(OrderStatusNames.PENDING)
      on line 154. The poStatus CMP field (ejb-jar.xml line 67) persists the status value.
      Comments in OrderStatusNames (lines 44-46) explicitly document the workflow:
      "pending->approved->completed or pending->denied".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 40
        line_end: 62
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {

              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";

              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";

              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";

              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";

          }
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      workflow.states: PENDING, APPROVED, DENIED, COMPLETED

  - record_key: supplier-integration-contact-info-relationship-0001
    kind: business-rule
    capability_key: supplier-integration
    requirement: >
      A Supplier Order SHALL have exactly one associated Contact Information entity for
      shipping/contact details. When a Supplier Order is deleted, its associated Contact
      Information SHALL be automatically deleted (cascade delete). The relationship is
      unidirectional from SupplierOrder to ContactInfo.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml relationships section (lines 234-258) declares a ONE-TO-ONE unidirectional
      relationship between SupplierOrderEJB and ContactInfoEJB with explicit cascade-delete on
      the ContactInfo side. The SupplierOrderEJB class (lines 119-125) provides getContactInfo
      and setContactInfo abstract methods, confirming the CMR field is used for this relationship.
    risk_class: operational
    basis: >
      ejb-jar.xml defines SupplierOrder-ContactInfo relationship (lines 234-258) with
      multiplicity One on SupplierOrder, multiplicity One on ContactInfo, and explicit
      <cascade-delete /> tag (line 249). The CMR field contactInfo is declared on SupplierOrderEJB
      (lines 119-125) with abstract getter and setter methods. The relationship is unidirectional
      as noted in the XML comment (line 232).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 230
        line_end: 258
        excerpt: |
          <!--
           ONE-TO-ONE Relationship between SupplierOrder and ContactInfo.
           Every PO has one customer address related to it. This is uni-directional
          -->
          <ejb-relation>
          <ejb-relation-name>SupplierOrder-ContactInfo</ejb-relation-name>
          <ejb-relationship-role>
            <ejb-relationship-role-name>purchaseorder-has-address</ejb-relationship-role-name>
            <multiplicity>One</multiplicity>
            <relationship-role-source>
              <ejb-name>SupplierOrderEJB</ejb-name>
            </relationship-role-source>
            <cmr-field>
              <cmr-field-name>contactInfo</cmr-field-name>
            </cmr-field>
          </ejb-relationship-role>
          <ejb-relationship-role>
            <ejb-relationship-role-name>address-for-purchaseorder</ejb-relationship-role-name>
            <multiplicity>One</multiplicity>
            <cascade-delete />
            <relationship-role-source>
              <ejb-name>ContactInfoEJB</ejb-name>
            </relationship-role-source>
          </ejb-relationship-role>
        </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 115
        line_end: 125
        excerpt: |
          /**
           * Accessor method for purchase order contact info
           * @return <Code>ContactInfoLocal</Code>  the PO contactinfo
           */
          public abstract ContactInfoLocal getContactInfo();

          /**
           * Setter method for PO contact info
           * @param <Code>ContactInfoLocal</Code> the PO contact info
           */
          public abstract void setContactInfo(ContactInfoLocal addr);
    stack_metadata:
      ejb.relationship: SupplierOrder-ContactInfo
      multiplicity: One-to-One
      cascade: delete

