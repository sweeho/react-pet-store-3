      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 237
        excerpt: |
          String updateOrders(Element root) {
              OrderApproval oa = new OrderApproval();
              NodeList nl = root.getElementsByTagName("Order");
              for (int i = 0; i < nl.getLength(); i++) {
                  Element e = (Element) nl.item(i);
                  String orderId =
                      getValue((Element) e.getElementsByTagName("OrderId").item(0));
                  String orderStatus =
                      getValue((Element) e.getElementsByTagName("OrderStatus").item(0));
                  if (orderId != null && orderStatus != null) {
                      oa.addOrder(new ChangedOrder(orderId, orderStatus));
                  }
              }
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  bd.updateOrders(oa);
                  return replyHeader + "<Type>UPDATEORDERS</Type>\n"
                      + "<Status>SUCCESS</Status>\n"
                      + "</Response>\n";
              } catch (AdminBDException e) {
                  return replyHeader
                      + "<Error>Exception while processing :  " + e.getMessage()
                      + ". Please try again</Error>\n</Response>\n";
              }
          }

  - record_key: admin-biz-rule-0004
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL warn the administrator if uncommitted order status changes
      exist when attempting to refresh data, and SHALL require explicit confirmation
      to proceed with the refresh.
    confidence: high
    confidence_basis: >
      DataSource.RefreshAction checks for uncommitted data before refresh and
      displays a confirmation dialog. The check iterates through all rows checking
      if column 4 (status) differs from PENDING.
    risk_class: operational
    basis: >
      RefreshAction.actionPerformed() checks ordersApproveTableModel rows for any
      status value that is not PENDING. If uncommitted changes exist, it calls
      JOptionPane.showConfirmDialog() to warn and get user confirmation before
      proceeding with refresh.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
        line_start: 219
        line_end: 241
        excerpt: |
          public void actionPerformed(final ActionEvent action) {
              boolean isUncommitted = false;
              for (int i = 0; i < ordersApproveTableModel.getRowCount(); i++) {
                  if (!PetStoreProxy.Order.PENDING.equals(
                  ordersApproveTableModel.getValueAt(i, 4))) {
                      isUncommitted = true;
                      break;
                  }
              }
              int result = JOptionPane.OK_OPTION;
              if (isUncommitted) {
                  result = JOptionPane.showConfirmDialog(parent,
                  PetStoreAdminClient.getString(
                  "RefreshWarningDialog.message"),
                  PetStoreAdminClient.getString(
                  "RefreshWarningDialog.title"),
                  JOptionPane.OK_CANCEL_OPTION,
                  JOptionPane.WARNING_MESSAGE);
              }
              if (result == JOptionPane.OK_OPTION) {
                  pcs.firePropertyChange(DISABLE_ACTIONS, null, null);
                  StatusBar.getInstance().setMessage(
                  PetStoreAdminClient.getString("Status.retrieve"));
                  super.actionPerformed(action);
              }
          }
    stack_metadata:
      framework: Java Swing

