records:
  - record_key: ADDR-ENTITY-0001
    kind: entity
    capability_key: order-checkout
    requirement: >
      The system SHALL maintain an Address entity with six attributes: streetName1,
      streetName2, city, state, zipCode, and country. An address represents a physical
      location used for shipping or billing in orders.
    confidence: high
    confidence_basis: >
      Address entity is fully defined in both the EJB implementation (AddressEJB) and
      the DTD schema (Address.dtd). All six fields are declared as abstract CMP fields
      in the entity bean with corresponding getters and setters. The entity is also
      used in purchaseorder component for order checkout.
    risk_class: operational
    basis: >
      AddressEJB declares all six fields as abstract CMP fields (lines 53-69).
      Address.java value object has all six fields as instance variables (lines 62-67).
      Address.dtd defines the XML structure with these exact elements (line 38).
    traces:
