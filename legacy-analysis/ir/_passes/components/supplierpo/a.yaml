records:
  - record_key: supplier-integration-entity-0001
    kind: entity
    capability_key: supplier-integration
    requirement: >
      The system SHALL maintain a SupplierOrder entity with an identifier (poId),
      date (poDate), and status (poStatus) to represent a purchase order received
      from the petstore.
    confidence: high
    confidence_basis: >
      The SupplierOrder EJB is declared in ejb-jar.xml with CMP persistence,
      field definitions, and primary key. The abstract accessor methods in
      SupplierOrderEJB and the local interface confirm all fields and their types.
    risk_class: operational
    basis: >
      ejb-jar.xml defines SupplierOrder as a CMP 2.x entity bean with three
      CMP fields: poId (primary key, String), poDate (long), and poStatus (String).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 48
        line_end: 105
        excerpt: |
          <entity>
            <description>SupplierOrder CMP EJB</description>
            <ejb-name>SupplierOrderEJB</ejb-name>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>SupplierOrder</abstract-schema-name>
            <cmp-field>
              <field-name>poId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>poDate</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>poStatus</field-name>
            </cmp-field>
            <primkey-field>poId</primkey-field>
          </entity>
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.persistence: Container

  - record_key: supplier-integration-entity-0002
    kind: entity
    capability_key: supplier-integration
    requirement: >
      Each SupplierOrder SHALL maintain a one-to-one relationship with ContactInfo
      to store shipping information (contact name, email, telephone, and address).
    confidence: high
    confidence_basis: >
      The ejb-jar.xml declares a one-to-one relationship between SupplierOrder
      and ContactInfo. The SupplierOrderEJB code in ejbPostCreate creates and
      assigns ContactInfo when an order is created.
    risk_class: operational
    basis: >
      ejb-jar.xml defines an EJB relation SupplierOrder-ContactInfo with one-to-one
      multiplicity and cascade delete. The CMR field contactInfo in SupplierOrder
      provides access to the related ContactInfo entity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 234
        line_end: 258
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>SupplierOrder-ContactInfo</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-address</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>SupplierOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>contactInfo</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
          </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 164
        line_end: 170
        excerpt: |
          ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
              serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
          ContactInfoLocal cinfoloc = (ContactInfoLocal)
                          cinforef.create(supplierOrder.getShippingInfo());
          setContactInfo(cinfoloc);
    stack_metadata:
      ejb.relationship: SupplierOrder-ContactInfo
      ejb.multiplicity: One

