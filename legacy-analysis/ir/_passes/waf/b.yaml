records:
  - record_key: WAF-WORKFLOW-0001
    kind: workflow
    capability_key: admin-dashboard
    requirement: >
      The system SHALL process HTTP requests through a front controller (MainServlet)
      that routes requests to URL-mapped actions (HTMLAction implementations) and
      thereafter to screen templates for rendering.
    confidence: high
    confidence_basis: >
      Declaratively configured via web.xml servlet mapping (*.do pattern) and
      mappings.xml URL-to-action/screen mappings. Both passes would confirm this
      as it is the core framework flow, enforced in two places (declarative + code).
    risk_class: operational
    basis: >
      MainServlet receives all *.do requests, uses URLMappingsXmlDAO to load
      mappings, instantiates URLMapping objects containing action class and screen
      references. RequestProcessor extracts the action from URLMapping and invokes
      it, then ScreenFlowManager forwards to the mapped screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 95
        line_end: 98
        excerpt: |
          <servlet-mapping>
            <servlet-name>webTierEntryPoint</servlet-name>
            <url-pattern>*.do</url-pattern>
          </servlet-mapping>
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 108
        line_end: 132
        excerpt: |
          private void doProcess(HttpServletRequest request, HttpServletResponse response)
                     throws IOException, ServletException {
              // set the locale of the user to default if not set
              if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
                  request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
              }
              try {
                       getRequestProcessor().processRequest(request);
                       getScreenFlowManager().forwardToNextScreen(request,response);
              } catch (Throwable ex) {
                  String className = ex.getClass().getName();
                  String nextScreen = getScreenFlowManager().getExceptionScreen(ex);
                  request.setAttribute("javax.servlet.jsp.jspException", ex);
                  if (nextScreen == null) {
                      ex.printStackTrace();
                      throw new ServletException("MainServlet: unknown exception: " + className);
                  }
                  context.getRequestDispatcher(nextScreen).forward(request, response);
            }
          }
    stack_metadata:
      framework: Java EE Servlet API
      servlet.entry-point: MainServlet
      servlet.mapping-pattern: "*.do"

  - record_key: WAF-WORKFLOW-0002
    kind: workflow
    capability_key: admin-dashboard
    requirement: >
      The system SHALL invoke HTMLAction instances in a lifecycle pattern:
      doStart() to initialize, perform() to execute business logic and
      generate events, and doEnd() to finalize with the event response.
    confidence: high
    confidence_basis: >
      Explicitly coded in RequestProcessor.processRequest() method with clear
      sequence. Method visibility and signature are enforced by interface
      contract (HTMLActionSupport base class), so both passes will find it.
    risk_class: operational
    basis: >
      RequestProcessor retrieves an HTMLAction from the URLMapping and invokes
      the lifecycle in sequence: action.doStart(request), then action.perform(request)
      to generate an Event, then action.doEnd(request, eventResponse).
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/RequestProcessor.java
        line_start: 117
        line_end: 145
        excerpt: |
          public void processRequest(HttpServletRequest request) throws HTMLActionException, EventException, ServletException {
              Event ev = null;
              String fullURL = request.getRequestURI();
              String selectedURL = null;
              int lastPathSeparator = fullURL.lastIndexOf("/") + 1;
              if (lastPathSeparator != -1) {
                  selectedURL = fullURL.substring(lastPathSeparator, fullURL.length());
              }
              URLMapping urlMapping = getURLMapping(selectedURL);
              HTMLAction action = getAction(urlMapping);
              if (action != null) {
                  action.setServletContext(request.getSession().getServletContext());
                  action.doStart(request);
                  ev = action.perform(request);
                  EventResponse eventResponse = null;
                  if (ev != null) {
                     EventMapping eventMapping = getEventMapping(ev);
                     if (eventMapping != null) {
                             ev.setEJBActionClassName(eventMapping.getEJBActionClassName());
                     }
                     ComponentManager sl = (ComponentManager)request.getSession().getAttribute(WebKeys.COMPONENT_MANAGER);
                     WebController wcc =  sl.getWebController(request.getSession());
                     eventResponse  = wcc.handleEvent(ev, request.getSession());
                 }
                 action.doEnd(request, eventResponse);
              }
          }
    stack_metadata:
      ejb.transaction: "not applicable at this tier"
      design-pattern: Template Method

  - record_key: WAF-WORKFLOW-0003
    kind: workflow
    capability_key: admin-dashboard
    requirement: >
      The system SHALL resolve Events generated by HTMLActions to their
      corresponding EJBAction handler classes via a declarative event-to-action
      mapping, then invoke the EJBAction to process the event in the business tier.
    confidence: high
    confidence_basis: >
      Mapping is declarative (mappings.xml event-mapping elements) and enforced
      in code (EventMapping class and getEventMapping method). Dual source
      (declarative + code) confirms high confidence.
    risk_class: operational
    basis: >
      mappings.xml defines event-mapping elements binding event class to EJBAction
      class. RequestProcessor loads these via URLMappingsXmlDAO and stores in eventMappings
      HashMap. When an Event is generated, RequestProcessor uses getEventMapping(ev)
      to look up the EJBActionClassName, sets it on the Event, then passes the Event
      to WebController.handleEvent().
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 43
        line_end: 46
        excerpt: |
          <event-mapping>
              <event-class>com.sun.j2ee.blueprints.waf.event.events.ChangeLocaleEvent</event-class>
              <ejb-action-class>com.sun.j2ee.blueprints.waf.controller.ejb.action.actions.ChangeLocaleEJBAction</ejb-action-class>
          </event-mapping>
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/RequestProcessor.java
        line_start: 132
        line_end: 142
        excerpt: |
          if (ev != null) {
             // set the ejb action class name on the event
              EventMapping eventMapping = getEventMapping(ev);
              if (eventMapping != null) {
                      ev.setEJBActionClassName(eventMapping.getEJBActionClassName());
              }
             ComponentManager sl = (ComponentManager)request.getSession().getAttribute(WebKeys.COMPONENT_MANAGER);
             WebController wcc =  sl.getWebController(request.getSession());
             eventResponse  = wcc.handleEvent(ev, request.getSession());
         }
    stack_metadata:
      framework: custom WAF event framework
      pattern: event-driven architecture

