records:
  - record_key: ORDER-WORKFLOW-0001
    kind: workflow
    capability_key: order-workflow
    requirement: >
      The system SHALL manage order lifecycle through states: PENDING → APPROVED → SHIPPED_PART → COMPLETED,
      or PENDING → DENIED. Orders in states other than PENDING (APPROVED, DENIED, COMPLETED, SHIPPED_PART) SHALL NOT
      be re-processed if approval decisions are received.
    confidence: high
    confidence_basis: >
      Both the ProcessManager usage pattern and the explicit state check in OrderApprovalMDB.onMessage() line 205
      enforce that only PENDING orders are processed. This is enforced in two independent places (declarative and
      programmatic), and the state names are visible throughout the codebase.
    risk_class: operational
    basis: >
      OrderApprovalMDB enforces PENDING-only processing and updates state via ProcessManager.updateStatus().
      InvoiceMDB updates to COMPLETED or SHIPPED_PART based on shipment completeness. PurchaseOrderMDB
      initializes state to PENDING. The four state names appear in OrderStatusNames constants.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 204
        line_end: 216
        excerpt: |
          String curStatus = processManager.getStatus(co.getOrderId());
          if(!curStatus.equals(OrderStatusNames.PENDING)) {
            continue;
          }
          // ... process order ...
          processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 166
