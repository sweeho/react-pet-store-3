  - record_key: CRED-BIZ-0001
    kind: business-rule
    capability_key: creditcard-validation
    requirement: >
      The expiryDate field SHALL be stored in "MM/YYYY" format and extractable into
      separate month and year components.
    confidence: medium
    confidence_basis: >
      CreditCardEJB provides getExpiryMonth() and getExpiryYear() methods that parse
      the expiryDate string using "/" as delimiter. However, no validation is visible
      to enforce the format at storage time. This is inferred from the parsing logic.
    risk_class: financial
    basis: >
      CreditCardEJB.getExpiryMonth() (lines 88-96) and getExpiryYear() (lines 98-107)
      both parse expiryDate by finding the "/" delimiter. The substring operations
      assume the format is "MM/YYYY". No explicit format validation is present in the
      create or setter methods, so enforcement may be client-side or schema-based.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }
          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
            }
            return "2010";
          }

  - record_key: CRED-BIZ-0002
    kind: business-rule
