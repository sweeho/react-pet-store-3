    kind: entity
    capability_key: supplier-integration
    requirement: >
      Inventory SHALL be represented as an entity with itemId as a unique identifier
      and quantity as a numeric attribute tracking available stock.
    confidence: high
    confidence_basis: >
      Declared in ejb-jar.xml as a CMP entity bean with explicit cmp-field declarations
      for both itemId and quantity. Code demonstrates container-managed persistence with
      explicit field accessors. Both code and configuration agree.
    risk_class: operational
    basis: >
      The InventoryEJB is a Container-Managed Persistence entity bean with two fields:
      itemId (String, primary key) and quantity (int). The getQuantity/setQuantity accessors
      and the reduceQuantity method prove the quantity is mutable. The ejbCreate method
      shows the creation signature: ejbCreate(String itemId, int quantity).
