          }

  - record_key: admin-workflow-0003
    kind: workflow
    capability_key: customer-management
    requirement: >
      GIVEN a session timeout or authentication failure, WHEN the rich client
      attempts to send a request via XML, THEN the system SHALL return an error
      response indicating "Session Timed Out" and instruct the user to exit and
      login from the login page.
    confidence: high
    confidence_basis: >
      ApplRequestProcessor.doPost() explicitly checks session == null and returns
      a specific error message. This is the sole error path for session timeout.
    risk_class: operational
    basis: >
      ApplRequestProcessor checks req.getSession(false). If null, it returns XML
      error response stating "Session Timed Out; Please exit and login as admin
      from the login page".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 85
        line_end: 115
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
              throws java.io.IOException, javax.servlet.ServletException {
              HttpSession session = req.getSession(false);
              ServletOutputStream out = resp.getOutputStream();
              if(session == null) {
                  out.println(replyHeader +
                              "<Error>Session Timed Out; Please exit and " +
                              "login as admin from the login page</Error>\n" +
                              "</Response>\n");
              } else {
                  String sId = session.getId();
                  resp.setContentType("text/xml");
                  BufferedReader inp = req.getReader();
                  StringBuffer strbuf = new StringBuffer("");
                  while(true) {
                      String str = inp.readLine();
                      if(str == null)
                          break;
                      strbuf.append(str+"\n");
                  }
                  inp.close();
                  out.println(processRequest(strbuf.toString()));
              }
              out.flush();
              out.close();
          }

