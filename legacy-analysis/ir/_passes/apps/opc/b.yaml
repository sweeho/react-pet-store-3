  - record_key: order-workflow-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      GIVEN a purchase order in PENDING state, WHEN the order total is less than
      $500 USD or ¥50,000 JPY, THEN the system SHALL automatically transition
      the order to APPROVED state without administrator review.
    confidence: high
    confidence_basis: >
      Auto-approval threshold is hardcoded in PurchaseOrderMDB.canIApprove()
      method with explicit locale-dependent currency comparison. Code is
      straightforward and unambiguous. Single source but central to workflow
      decision logic.
    risk_class: financial
    basis: >
      PurchaseOrderMDB.canIApprove() implements locale-specific thresholds:
      if US locale and total < 500, return true; if Japan locale and
      total < 50000, return true; otherwise return false. Method called
      during PO processing to determine if approval MDB should be triggered.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }

