  # ========== SHOPPING CART (shopping-cart) ==========
  - record_key: shopping-cart-req-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow users to add items to a shopping cart identified by
      item ID and product information (category, product ID, item ID).
    confidence: high
    confidence_basis: >
      Directly implemented in CartEJBAction.perform() with CartEvent.ADD_ITEM case;
      cart.addItem(itemId) method called; mappings.xml confirms CartEvent event
      routing. Both web action (CartHTMLAction) and EJB action (CartEJBAction) exist,
      confirming two independent implementations of this rule.
    risk_class: operational
    basis: >
      CartEJBAction lines 68-71 show the add-item operation within a switch on
      CartEvent.getActionType(). The cart holds CartItem objects with category,
      productId, itemId, quantity, and unitCost (CartEJBAction lines 135-144).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 66
        line_end: 71
        excerpt: |
          switch (ce.getActionType()) {
              case  CartEvent.ADD_ITEM  : {
                  cart.addItem(ce.getItemId());
              }
              break;
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 73
        line_end: 76
        excerpt: |
          <event-mapping>
              <event-class>com.sun.j2ee.blueprints.petstore.controller.events.CartEvent</event-class>
              <ejb-action-class>com.sun.j2ee.blueprints.petstore.controller.ejb.actions.CartEJBAction</ejb-action-class>
          </event-mapping>

