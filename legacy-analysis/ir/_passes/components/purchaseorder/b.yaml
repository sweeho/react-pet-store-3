  - record_key: order-workflow-relationship-0003
    kind: business-rule
    capability_key: order-workflow
    requirement: >
      A Purchase Order SHALL have one or more Line Items associated with it.
      Each Line Item identifies a product category, product ID, item ID, line number,
      quantity ordered, unit price, and quantity shipped.
      When a Purchase Order is deleted, all its associated Line Items SHALL be
      automatically deleted (cascade delete).
    confidence: high
    confidence_basis: >
      The ejb-jar.xml relationships section (lines 372-397) declares a ONE-TO-MANY
      relationship with cascade-delete on LineItem. The PurchaseOrder.java class and
      PurchaseOrderEJB both have lineItems collection handling (PurchaseOrder.java lines
      83, 184-189; PurchaseOrderEJB.java lines 175-181, 188-190). The DTD requires at
      least one LineItem (LineItem+).
    risk_class: operational
    basis: >
      PurchaseOrder.java declares ArrayList lineItems field (line 83) with addLineItem()
      method (lines 184-189). PurchaseOrderEJB.java declares abstract Collection getLineItems()
      and setLineItems() (lines 175-181) plus addLineItem() (lines 188-189). ejb-jar.xml
      defines PurchaseOrder-LineItem relationship (lines 372-397) with multiplicity One
      on PO side, Many on LineItem side, with <cascade-delete /> (line 388). DTD shows
      LineItem+ (line 38) requiring one or more.
    traces:
