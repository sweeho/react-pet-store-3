        line_start: 180
        line_end: 203
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>zipCode</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>streetName2</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>state</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>streetName1</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>city</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>country</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 53
        line_end: 69
        excerpt: |
          public abstract String getStreetName1();
          public abstract void setStreetName1(String streetName1);
          public abstract String getStreetName2();
          public abstract void setStreetName2(String streetName2);
          public abstract String getCity();
