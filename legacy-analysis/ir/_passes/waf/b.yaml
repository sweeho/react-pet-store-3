  - record_key: WAF-WORKFLOW-0005
    kind: workflow
    capability_key: admin-dashboard
    requirement: >
      The system SHALL forward HTTP requests to screen templates (JSP pages)
      after action processing, using either static URL-to-screen mappings or
      dynamic FlowHandler-computed screen selections.
    confidence: high
    confidence_basis: >
      Screen forwarding is declared in mappings.xml (url-mapping screen attribute)
      and enforced in code (ScreenFlowManager.forwardToNextScreen). Dual evidence
      from config + implementation.
    risk_class: operational
    basis: >
      ScreenFlowManager.forwardToNextScreen() retrieves the URLMapping for the
      request URL. If the mapping does not use a FlowHandler, it returns the
      static screen name. If it does use a FlowHandler, it instantiates and invokes
      the handler's doStart(), processFlow(), doEnd() methods to compute the screen.
      Then it forwards to the resolved screen via RequestDispatcher.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 48
        line_end: 55
        excerpt: |
          <url-mapping url="changelocale.do" screen="locale_change_success.screen" >
              <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>
         </url-mapping>

          <url-mapping url="changeclientchachelinklocale.do"  useFlowHandler="true" >
              <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>
               <flow-handler class="com.sun.j2ee.blueprints.waf.controller.web.flow.handlers.ClientStateFlowHandler"/>
         </url-mapping>
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/ScreenFlowManager.java
        line_start: 119
        line_end: 158
        excerpt: |
          public void forwardToNextScreen(HttpServletRequest request, HttpServletResponse response)
                    throws java.io.IOException, FlowHandlerException, javax.servlet.ServletException {
              String fullURL = request.getRequestURI();
              String selectedURL = defaultScreen;
              int lastPathSeparator = fullURL.lastIndexOf("/") + 1;
              if (lastPathSeparator != -1) {
                  selectedURL = fullURL.substring(lastPathSeparator, fullURL.length());
              }
              String currentScreen = "";
              URLMapping urlMapping = getURLMapping(selectedURL);
              if (urlMapping != null) {
                  if (!urlMapping.useFlowHandler()) {
                      currentScreen = urlMapping.getScreen();
                  } else {
                      FlowHandler handler = null;
                      String flowHandlerString = urlMapping.getFlowHandler();
                      try {
                          handler = (FlowHandler)getClass().getClassLoader().loadClass(flowHandlerString).newInstance();
                          handler.doStart(request);
                          String flowResult = handler.processFlow(request);
                          handler.doEnd(request);
                          currentScreen = urlMapping.getResultScreen(flowResult);
                          if (currentScreen == null) currentScreen = flowResult;
                     } catch (Exception ex) {
                         System.err.println("ScreenFlowManager caught loading handler: " + ex);
                     }
                  }
              }
              if (currentScreen == null) {
                  System.err.println("ScreenFlowManager: Screen not found for " + selectedURL);
                  throw new RuntimeException("Screen not found for " + selectedURL);
              }
              context.getRequestDispatcher("/" + currentScreen).forward(request, response);
          }
    stack_metadata:
      servlet.dispatcher: RequestDispatcher
      pattern: Front Controller + Screen Template

  - record_key: WAF-WORKFLOW-0006
    kind: workflow
    capability_key: customer-communications
    requirement: >
      The system SHALL map exceptions thrown during request processing to
      designated error screens and forward the request to those screens,
      preserving the exception in the request attributes.
    confidence: medium
    confidence_basis: >
      Exception mapping is declared in mappings.xml (exception-mapping elements)
      and the forwarding is coded in MainServlet.doProcess(). The mapping config
      itself (exception-mapping) has only one source in the provided files, so
      confidence is medium rather than high.
    risk_class: operational
    basis: >
      mappings.xml declares exception-mapping elements binding exception class names
      to screen names. MainServlet catches all Throwables during processing, looks up
      the exception screen name via ScreenFlowManager.getExceptionScreen(Throwable),
      stores the exception in request.setAttribute("javax.servlet.jsp.jspException", ex),
      then forwards to the mapped error screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 57
        line_end: 57
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.GeneralFailureException" screen="error.screen"/>
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 114
        line_end: 128
        excerpt: |
          try {
                   getRequestProcessor().processRequest(request);
                   getScreenFlowManager().forwardToNextScreen(request,response);
          } catch (Throwable ex) {
              String className = ex.getClass().getName();
              String nextScreen = getScreenFlowManager().getExceptionScreen(ex);
              request.setAttribute("javax.servlet.jsp.jspException", ex);
              if (nextScreen == null) {
                  ex.printStackTrace();
                  throw new ServletException("MainServlet: unknown exception: " + className);
              }
              context.getRequestDispatcher(nextScreen).forward(request, response);
        }
    stack_metadata:
      error-handling: exception-to-screen mapping

