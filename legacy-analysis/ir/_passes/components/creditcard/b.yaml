    kind: entity
    capability_key: creditcard-validation
    requirement: >
      The system SHALL maintain a CreditCard entity with three persistent fields:
      card number, card type, and expiry date in MM/YYYY format.
    confidence: high
    confidence_basis: >
      Both passes confirm CreditCard entity exists with three CMP (Container-Managed
      Persistence) fields declared in ejb-jar.xml and implemented as abstract getter/setter
      methods in CreditCardEJB. The entity is deployed as an EJB 2.0 local entity bean with
      container-managed persistence 2.x.
    risk_class: financial
    basis: >
      CreditCardEJB defines abstract methods for cardNumber, cardType, and expiryDate.
      ejb-jar.xml declares these as CMP fields in <cmp-field> elements. Local interface
      CreditCardLocal exposes all three fields as getters and setters.
