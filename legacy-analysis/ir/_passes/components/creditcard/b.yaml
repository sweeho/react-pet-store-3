  - record_key: creditcard-validation-req-0002
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL parse the expiry date from combined month and year components
      into MM/YYYY format.
    confidence: high
    confidence_basis: >
      CustomerHTMLAction concatenates expiry month and year with "/" separator.
      CreditCardEJB provides getExpiryMonth() and getExpiryYear() methods that parse
      the stored expiryDate string by finding the "/" delimiter.
    risk_class: financial
    basis: >
      CustomerHTMLAction line 175 constructs expiryDate = creditCardExpiryMonth + "/" + creditCardExpiryYear.
      CreditCardEJB.getExpiryMonth() finds "/" index and returns substring before it.
      CreditCardEJB.getExpiryYear() finds "/" index and returns substring after it.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 159
        line_end: 178
        excerpt: |
          String creditCardExpiryMonth =  request.getParameter("credit_card_expiry_month").trim();
          String creditCardExpiryYear =  request.getParameter("credit_card_expiry_year").trim();
          String expiryDate = creditCardExpiryMonth + "/" + creditCardExpiryYear;
          return new CreditCard(creditCardNumber,
                                                creditCardType,
                                                expiryDate);
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }

          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
            }
            return "2010";
          }

  - record_key: creditcard-validation-req-0003
    kind: requirement
    capability_key: creditcard-validation
    requirement: >
      The system SHALL provide a data transfer object for CreditCard that supports
      XML serialization and deserialization.
    confidence: high
    confidence_basis: >
      CreditCard class implements toDOM() and fromDOM() methods using XMLDocumentUtils.
      PurchaseOrder invokes creditCard.toDOM(document) to serialize and CreditCard.fromDOM()
      to deserialize. Both methods reference constants for XML element names.
    risk_class: operational
    basis: >
      CreditCard class defines XML_CREDITCARD, XML_CARD_NUMBER, XML_CARD_TYPE, and
      XML_EXPIRYDATE constants. toDOM() method creates XML elements for each field.
      fromDOM() static method reconstructs CreditCard from DOM node. PurchaseOrder.toXML()
      calls creditCard.toDOM(document) and fromDOM() calls CreditCard.fromDOM(child).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 54
        line_end: 62
        excerpt: |
          public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD CreditCard 1.1//EN";
          public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd";
          public static final String XML_CREDITCARD = "CreditCard";
          public static final String XML_CARD_NUMBER = "CardNumber";
          public static final String XML_EXPIRYDATE = "ExpiryDate";
          public static final String XML_CARD_TYPE = "CardType";
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 108
        line_end: 130
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_CREDITCARD);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
            XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
            XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
            return root;
          }

          public static CreditCard fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CREDITCARD)) {
              Element child;
              CreditCard creditCard = new CreditCard();
              child = XMLDocumentUtils.getFirstChild(element, XML_CARD_NUMBER, false);
              creditCard.cardNumber = XMLDocumentUtils.getContentAsString(child, false);

