  # Admin Dashboard - Chart Generation
  - record_key: AD-BR-0003
    kind: business-rule
    capability_key: admin-dashboard
    requirement: >
      The system SHALL generate revenue and order quantity charts for date ranges and optionally
      filtered by product category.
      GIVEN an administrator requests chart data with type (REVENUE or ORDERS)
      WHEN start date, end date, and optional category filter are provided
      THEN the system SHALL aggregate line item data for orders within the date range.
      GIVEN request type is REVENUE
      WHEN category is null
      THEN the system SHALL return aggregated revenue by category.
      GIVEN request type is REVENUE
      WHEN category is specified
      THEN the system SHALL return aggregated revenue by item ID within the category.
      GIVEN request type is ORDERS
      WHEN category is null
      THEN the system SHALL return aggregated order quantities by category.
      GIVEN request type is ORDERS
      WHEN category is specified
      THEN the system SHALL return aggregated order quantities by item ID within the category.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB.getChartInfo() explicitly implements the logic with branching on request type
      and category. The code iterates through purchase orders, line items, and accumulates values
      or quantities in a HashMap. Transaction attribute is Required. Date range queries use CMP finder
      (findPOBetweenDates) with explicit SQL generation in deployment descriptor.
    risk_class: operational
    basis: >
      getChartInfo() method receives request ("REVENUE" or "ORDERS"), start date, end date, and optional
      category. It calls pohome.findPOBetweenDates(start, end) to get orders in date range, iterates
      through line items, and aggregates quantity*unitPrice for REVENUE or quantity for ORDERS.
      Results are returned as HashMap with category/item ID as key and Float/Integer values.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 169
        line_end: 246
        excerpt: |
          public Map getChartInfo(String request,
                                  Date start,
                                  Date end,
                                  String categ)
              throws OPCAdminFacadeException {
              String id;
              Float tmpValue;
              Integer tmpQty;
              PurchaseOrderLocal po;
              Map chartDetails = new HashMap();
              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection poColl =
                      pohome.findPOBetweenDates(start.getTime(), end.getTime());
                  Iterator it = poColl.iterator();
                  while((it!= null) && (it.hasNext())) {
                      po = (PurchaseOrderLocal) it.next();
                      Collection liColl = po.getAllItems();
                      Iterator lit = liColl.iterator();
                      while((lit!=null) && (lit.hasNext())) {
                          LineItem loc = (LineItem) lit.next();
                          if(request.equals("REVENUE")) {
                              if(categ == null) {
                                  id = loc.getCategoryId();
                                  if(chartDetails.containsKey(id)) {
                                      tmpValue = (Float) chartDetails.get(id);
                                      chartDetails.put(id,
                                           new Float(tmpValue.floatValue() +
                                           (loc.getQuantity()*loc.getUnitPrice())));
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml
